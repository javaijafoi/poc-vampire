    ${registroLigado ? `<h3>Ajude a melhorar o jogo</h3><p>Para descobrir onde as pessoas travam, o jogo registra de forma anônima por onde você passa: cenas, escolhas e finais. Nada do que você escreve no caderno sai daqui, e não guardamos nome nem e-mail.</p>` : ''}`,
  'Sua ficha': () => fichaHTML(story?.variablesState['nome']) + (FICHAS[story?.variablesState['nome']] ? `<p><b>Fome agora:</b> ${story.variablesState['fome']} de 5.</p>` : ''),
  'Dados e Fome': () => `<h2>Dados e Fome</h2>
    <h3>Testes</h3><p>Quando o resultado não é garantido, você faz um teste: rola dados de dez faces. Cada dado que der 6 ou mais é um sucesso. Juntou tantos sucessos quanto a dificuldade, passou.</p>
    <p>Quantos dados você rola depende das notas da sua ficha. Dois 10 na mesma rolagem valem 4 sucessos: é um crítico.</p>
    <h3>Fome</h3><p>Vampiro vive com fome de sangue. Os quadradinhos vermelhos ao lado da hora mostram a sua Fome, de 0 a 5.</p>
    <p>Usar uma Disciplina gasta sangue: depois, há uma chance em duas de a Fome subir 1 (é o "teste de Despertar" que aparece no aviso). A Disciplina forte sobe 2 de uma vez, sem sorte. Pagar a Nonna com sangue sobe 1.</p>
    <p>Com Fome 4, a Besta aparece e pede sangue. Com Fome 5, as conversas com jeitinho somem e o Príncipe desconfia de você: na Corte, ele pede uma prova a mais.</p>
    <p>Nos testes, um dado para cada ponto de Fome vira dado de Fome, vermelho. Se um dado vermelho der 1 e você falhar, é uma <b>falha bestial</b>: a Besta, o seu lado animal, escapa por um instante. Se um vermelho der 10 num crítico, é um <b>crítico bagunçado</b>: você consegue, mas de um jeito feio.</p>
    <p>Fome alta tem um lado bom: os sentidos de predador ficam mais aguçados.</p>`,
  'Etiquetas': () => `<h2>Etiquetas nas opções</h2>
    <p>Algumas respostas terminam com uma etiqueta colorida entre parênteses. Ela diz por que a opção apareceu para você. ${TOQUE ? 'Toque na etiqueta (ou segure o dedo na opção)' : 'Passe o mouse em cima da etiqueta'} para ver os detalhes.</p>
    <ul class="exemplos">
      <li><span class="porque cla">(Gangrel)</span> Clã: só aparece para quem é daquele clã.</li>
      <li><span class="porque atrib">(Carisma 3)</span> Nota da ficha: só aparece se a sua nota for alta o bastante.</li>
      <li><span class="porque prova">(Prova)</span> Só aparece quando você já tem a pista certa no caderno.</li>
      <li><span class="porque teste">(Teste: Força + Intimidação, dif. 4)</span> Rola dados. A dica mostra quantos dados e a chance de passar.</li>
      <li><span class="porque disc">(Disciplina: Presença)</span> Usa o seu poder de vampiro. Não rola dado, mas tem preço.</li>
    </ul>
    <p>Quando uma linha da história começa com <span class="passiva" style="font-size:.8em">Raciocínio 3</span>, foi algo que você percebeu sozinho graças à sua ficha.</p>`,
};
function abrirAjuda(aba = 'Como jogar') {
  registrar('abriu', { o_que: 'ajuda' });
  abrirJanela('Como jogar', Object.keys(AJUDA), aba, (a, mostrar, fechar) => ({ html: AJUDA[a](), botoes: [
    ['Fechar', 'principal', fechar], ['Rever o tutorial', 'sec', () => { fechar(); mostrarTutorial(); }],
  ] }));
}

// Tutorial curto no começo da primeira partida (pulável). Depois fica no botão "?".
const TUTORIAL = [
  `<h2>Uma noite para achar o culpado</h2><p>Você é um vampiro recém-chegado a São Paulo e deve um favor ao Príncipe. Esta noite ele cobra: alguém sumiu com uma carga preciosa dele, e você tem até o amanhecer para descobrir quem foi.</p>
    <p>Este é um jogo de conversa. Você escolhe com quem falar e o que perguntar. Não precisa saber nada de Vampiro: A Máscara.</p>`,
  `<h2>Converse e anote</h2><p>As testemunhas estão espalhadas pelo bar, uma em cada canto. Cada uma conta a sua versão, e ninguém conta a verdade inteira.</p>
    <p>O que você descobre vai sozinho para o <b>Caderno</b>, no canto da caixa de texto. Uma pista de uma testemunha pode abrir uma pergunta nova com outra.</p>`,
  `<h2>O relógio corre</h2><p>Cada pergunta custa minutos, mesmo repetida: uns 20 com as testemunhas. O sol nasce às 05h40 e você não vai conseguir falar de tudo com todos. Quando achar que sabe, chame o Príncipe e mostre a ele três provas do seu caderno.</p>`,
  `<h2>Opções especiais</h2><p>Algumas respostas têm uma etiqueta colorida no fim, como <span class="porque prova">(Prova)</span> ou <span class="porque disc">(Disciplina: Presença)</span>. Elas aparecem por causa do seu clã, das suas notas, das pistas que você achou ou dos seus poderes.</p>
    <p>${TOQUE ? 'Toque na etiqueta (ou segure o dedo na opção)' : 'Passe o mouse em cima da etiqueta'} e o jogo explica, em uma linha, o que ela faz. O mesmo vale para a hora e a Fome.</p>`,
  `<h2>Dados e Fome</h2><p>Às vezes o resultado depende de sorte: você rola dados e precisa tirar 6 ou mais em alguns deles. Quanto melhor a sua nota, mais dados.</p>
    <p>Vampiro também sente <b>Fome</b>, os quadradinhos vermelhos. Usar seus poderes pode aumentar a Fome, e com muita Fome a sua Besta pode atrapalhar os testes.</p>
    <p>Esqueceu alguma coisa? O botão <b>?</b> no canto da cena explica tudo de novo. Agora, escolha quem você é. ${CLIQUE} num personagem para ver a ficha dele.</p>`,
];
const TUT = 'matusalem-tutorial';
function mostrarTutorial() {
  try { localStorage.setItem(TUT, '1'); } catch (e) {}
  const passos = TUTORIAL.map((_, i) => String(i));
  abrirJanela('Tutorial', [], '0', (p, mostrar, fechar) => {
    const i = +p, ultimo = i === passos.length - 1;
    return { html: TUTORIAL[i], botoes: [
      [ultimo ? 'Começar' : 'Próximo ›', 'principal', () => ultimo ? fechar() : mostrar(String(i + 1))],
      ...(i ? [['‹ Voltar', 'sec', () => mostrar(String(i - 1))]] : []),
      ...(ultimo ? [] : [['Pular tutorial', 'sec', () => { registrar('tutorial_pulado', { passo: i + 1 }); fechar(); }]]),
      [`${i + 1} de ${passos.length}`, 'passo'],
    ] };
  });
}
function tutorialVisto() { try { return !!localStorage.getItem(TUT); } catch (e) { return true; } }

// Dica de uma linha sobre cada etiqueta: o que ela faz ou por que a opção apareceu.
function paradaDoTeste(nomeTeste) {
  const v = story.variablesState;
  if (/Persuasão/.test(nomeTeste)) return v['carisma'] + 1;
  if (/Subterfúgio/.test(nomeTeste)) return v['manipulacao'] + v['subterfugio'];
  if (/Intimidação/.test(nomeTeste)) return v['intimidacao'];
  return null;
}
function chanceDe(parada, fome, dif) {
  let ok = 0; const N = 3000;
  for (let i = 0; i < N; i++) { const r = V5.rolarV5(parada, fome, dif).resultado; if (r >= 1 && r <= 3) ok++; }
  return Math.round(100 * ok / N / 5) * 5;
}
function dicaDe(g, texto, passiva) {
  const v = story.variablesState, tipo = tipoBadge(g);
  if (tipo === 'cla') return `Só aparece porque você é ${g}. ${CLAS[g] || ''}`;
  if (tipo === 'prova') {
    const rot = (texto.split(':')[0] || '').trim();
    const onde = rot === 'Dossiê' ? 'o que o Príncipe contou no dossiê' : `a pista certa no caderno${rot ? ` ("${rot}")` : ''}`;
    return `Só aparece porque você já tem ${onde}. Jogar uma prova na cara de alguém pode pegar a pessoa numa mentira.`;
  }
  if (tipo === 'disc') {
    const forte = /^Disciplina forte/.test(g), d = g.replace(/^Disciplina( forte)?:\s*/, '');
    return `${d}, a sua Disciplina: ${DISC[d]?.curta || 'um poder de vampiro.'} ${forte ? CUSTO_FORTE : v['capitulo'] >= 2 ? CUSTO_DISC2 : CUSTO_DISC}`;
  }
  if (tipo === 'teste') {
    const m = g.match(/^Teste:\s*(.+?),\s*dif\.\s*(\d+)/); if (!m) return 'Teste: rola dados; cada 6 ou mais é um sucesso.';
    const dif = +m[2], n = paradaDoTeste(m[1]), f = v['fome'];
    if (n == null) return `Teste: rola dados (${m[1]}) e precisa de ${dif} sucesso${dif === 1 ? '' : 's'}. Cada dado com 6 ou mais conta um.`;
    const verm = Math.min(f, n);
    return `Teste: você rola ${n} dados (${m[1]}) e precisa de ${dif} sucesso${dif === 1 ? '' : 's'}. Cada dado com 6 ou mais conta um.${verm ? ` ${verm} ${verm === 1 ? 'deles é' : 'deles são'} de Fome.` : ''} Chance de passar: uns ${chanceDe(n, f, dif)}%.`;
  }
  const m = g.match(/^(.+?) (\d+)$/);
  if (m && m[1] === 'Sinal') return 'O chip na sua língua transmitiu. Com Sinal 5, a Inquisição vem buscar você.';
  if (m && m[1] === 'Fome') return `${passiva ? 'Você sentiu isto' : 'Só aparece'} porque a sua Fome está em ${m[2]} ou mais. Com fome, os sentidos de predador ficam mais aguçados.`;
  if (m) {
    const nota = NOTAS.find(n => n[1] === m[1]);
    return `${passiva ? 'Você percebeu isto sozinho' : 'Só aparece'} porque o seu ${m[1]} é ${m[2]} ou mais.${nota ? ' ' + nota[1] + ': ' + nota[2].charAt(0).toLowerCase() + nota[2].slice(1) : ''}`;
  }
  return '';
}

const DICAS_HUD = {
  hora: 'Hora da noite. Cada pergunta custa minutos, mesmo se você repetir: uns 20 com as testemunhas e 10 com o fantasma. A sessão da Nonna custa 1 hora. O sol nasce às 05h40, e aí o Príncipe desce.',
  sinal: 'O chip na sua língua, de 0 a 5. Do lado de fora do Elísio, cada Disciplina faz ele transmitir (sobe 2), e briga sobe 1. Com 5, a Inquisição vem buscar você. Dentro do salão o chip não importa, mas o Dr. Arnaldo põe para fora quem usar Disciplina.',
  fome: 'Fome, de 0 a 5. Usar Disciplina pode subir 1, e a Disciplina forte sobe 2 de uma vez. Cada ponto vira um dado vermelho nos testes. Com 4, a Besta aparece; com 5, a conversa com jeitinho some e a Corte desconfia de você.',
  caderno: 'Caderno: as pistas que você juntou, uma folha por testemunha, e uma folha para anotar.',
};
document.querySelectorAll('.hud [data-dica]').forEach(el => { el.dataset.dica = DICAS_HUD[el.dataset.dica]; });
function mostrarDica(el) {
  const txt = el?.dataset.dica; if (!txt) return esconderDica();
  const pop = $('dica-pop'), jogo = document.querySelector('.jogo').getBoundingClientRect(), r = el.getBoundingClientRect();
  pop.textContent = txt; pop.classList.add('on');
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let top = r.top - jogo.top - h - 8; if (top < 0) top = r.bottom - jogo.top + 8;
  pop.style.left = Math.max(0, Math.min(jogo.width - w, r.left - jogo.left + r.width / 2 - w / 2)) + 'px';
  pop.style.top = top + 'px';
}
function esconderDica() { $('dica-pop').classList.remove('on'); }
// no toque, o navegador também dispara mouseover e focusin: esses ficam de fora, e quem manda é o toque
let ultimoToque = 0, segurou = false, seguraTimer;
const tocouAgora = () => performance.now() - ultimoToque < 900;
document.querySelector('.jogo').addEventListener('mouseover', e => { if (!tocouAgora()) mostrarDica(e.target.closest('[data-dica]')); });
document.querySelector('.jogo').addEventListener('mouseleave', esconderDica);
// teclado: com a opção em foco, mostra a dica da etiqueta dela
document.querySelector('.jogo').addEventListener('focusin', e => { if (tocouAgora()) return; const el = e.target.closest?.('[data-dica]') || e.target.querySelector?.('[data-dica]'); el ? mostrarDica(el) : esconderDica(); });
addEventListener('pointerdown', esconderDica, true);
const jogoEl = document.querySelector('.jogo');
jogoEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  ultimoToque = performance.now(); segurou = false; clearTimeout(seguraTimer);
  const op = e.target.closest('#conteudo button'), dica = op?.querySelector('[data-dica]');
  if (dica) seguraTimer = setTimeout(() => { segurou = true; mostrarDica(dica); }, 450);
});
['pointerup', 'pointercancel', 'pointermove'].forEach(t => jogoEl.addEventListener(t, e => { if (t !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 6) clearTimeout(seguraTimer); }));
jogoEl.addEventListener('click', e => {
  if (!tocouAgora()) return;
  const el = e.target.closest('[data-dica]');
  if (segurou || (el && el.tagName !== 'BUTTON')) {
    e.preventDefault(); e.stopPropagation();
    if (!segurou) mostrarDica(el);
    segurou = false;
  }
}, true);
jogoEl.addEventListener('contextmenu', e => { if (tocouAgora()) e.preventDefault(); });

// ---------- Registro anônimo de como as pessoas jogam (PostHog) ----------
// Manda para o PostHog só o caminho da partida: cenas, escolhas, finais, quando a pessoa fica parada e onde sai.
// Nada de nome, e-mail, IP guardado ou anotações do caderno. O jogador é um número sorteado, guardado neste navegador.
// Sem chave, ou rodando no próprio computador (file:, localhost) ou com ?semregistro=1, não manda nada.
const REGISTRO = { chave: '{{POSTHOG_CHAVE}}', host: 'https://us.i.posthog.com', versao: '{{VERSAO}}' };
const registroLigado = /^phc_/.test(REGISTRO.chave) && /^https?:$/.test(location.protocol)
  && !/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname) && !/semregistro=1|pular=1/.test(location.search);
const sorteio = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
let jogadorId; try { jogadorId = localStorage.getItem('matusalem-jogador') || sorteio(); localStorage.setItem('matusalem-jogador', jogadorId); } catch (e) { jogadorId = sorteio(); }
const sessaoId = sorteio();
const partida = { escolhas: 0, inicio: 0, lugar: '', ativa: false, ultimaEscolha: '' };
function registrar(evento, props = {}) {
  const v = story && story.variablesState;
  const dados = {
    distinct_id: jogadorId, $session_id: sessaoId, $process_person_profile: false, $lib: 'matusalem',
    $current_url: location.origin + location.pathname, versao: REGISTRO.versao, aparelho: TOQUE ? 'toque' : 'mouse',
    ...(partida.ativa && v ? { personagem: v['nome'] || '', lugar: partida.lugar, hora_no_jogo: horaDe(v['minutos']), escolhas: partida.escolhas, pistas: pistas.length,
      minutos_jogando: Math.round((Date.now() - partida.inicio) / 60000) } : {}),
    ...props,
  };
  if (!registroLigado) { if (/registro=ver/.test(location.search)) console.log('[registro]', evento, dados); return; }
  try {
    // text/plain evita a checagem extra do navegador; keepalive deixa o envio terminar mesmo se a aba fechar
    fetch(REGISTRO.host + '/i/v0/e/', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ api_key: REGISTRO.chave, event: evento, properties: dados, timestamp: new Date().toISOString() }) }).catch(() => {});
  } catch (e) {}
}
// lugar = o trecho do roteiro (knot do Ink) onde a pessoa está, como "rayo_perguntas" ou "salao"
function marcarLugar() {
  const p = story.state.currentPathString; if (!p) return;
  const lugar = p.split('.')[0]; if (lugar === partida.lugar || /^\d/.test(lugar)) return;
  partida.lugar = lugar; registrar('cena', { fundo: fundoAtual });
}
function comecarPartida(modo) {
  Object.assign(partida, { escolhas: 0, inicio: Date.now(), lugar: '', ativa: true, ultimaEscolha: '' });
  registrar('partida_iniciada', { modo }); marcarLugar();
}
// parado: ninguém clicou nem apertou tecla por 2 minutos no meio da partida (um aviso por pausa)
let paradoTimer;
function mexeu() {
  clearTimeout(paradoTimer);
  paradoTimer = setTimeout(() => {
    if (!partida.ativa || !$('capa').hidden || document.hidden) return;
    registrar('parado', { tela: $('txt') ? 'texto' : document.querySelector('.caderno') ? 'janela' : 'escolhas', ultima_escolha: partida.ultimaEscolha });
  }, 120000);
}
['pointerdown', 'keydown'].forEach(t => addEventListener(t, mexeu, true));
// saiu: a aba foi fechada, trocada ou o celular bloqueou no meio da partida. Repetido no mesmo lugar sem escolha nova não conta.
let ultimaSaida = '';
document.addEventListener('visibilitychange', () => {
  if (!document.hidden || !partida.ativa) return;
  const marca = partida.lugar + '|' + partida.escolhas; if (marca === ultimaSaida) return;
  ultimaSaida = marca; registrar('saiu', { ultima_escolha: partida.ultimaEscolha, na_capa: !$('capa').hidden });
});

// ---------- Ligações ----------
$('novo-jogo').addEventListener('click', novoJogo);
$('continuar').addEventListener('click', continuar);
$('confirma-sim').addEventListener('click', () => { apagarSave(); if (confirmaCap2) { confirmaCap2 = false; jogarCapitulo2(false); } else tocarAbertura(iniciar); });
$('confirma-nao').addEventListener('click', mostrarCapa);
// Capítulo 2 pela capa: com jogo salvo no meio, pede confirmação como o Novo jogo
let confirmaCap2 = false;
$('capitulo-2').addEventListener('click', () => {
  if (lerSave()) { confirmaCap2 = true; $('menu').hidden = true; $('confirma').hidden = false; $('confirma-nao').focus({ preventScroll: true }); return; }
  jogarCapitulo2(false);
});
$('ver-abertura').addEventListener('click', () => tocarAbertura(mostrarCapa));
$('dialogo').addEventListener('click', clicarDialogo);
$('palco').addEventListener('click', e => { if (!e.target.closest('button') && $('txt')) clicarDialogo(); });
// tela cheia: só onde o navegador deixa (Android); no iPhone, "Adicionar à Tela de Início" abre sem a barra
if (TOQUE && document.fullscreenEnabled) $('tela-cheia').hidden = false;
$('tela-cheia').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}));
document.addEventListener('fullscreenchange', () => { $('tela-cheia').textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia'; });
$('abrir-caderno').addEventListener('click', e => { e.stopPropagation(); abrirCaderno(); });
$('ajuda-btn').addEventListener('click', e => { e.stopPropagation(); abrirAjuda(); });
$('reiniciar').addEventListener('click', mostrarCapa);
$('historico').addEventListener('click', e => { e.stopPropagation(); if (story && $('capa').hidden) abrirHistorico(); });
$('instantaneo').addEventListener('click', () => { opcoes.instantaneo = !opcoes.instantaneo; ajustarOpcoes(); });
ajustarOpcoes();
document.addEventListener('keydown', e => {
  if ((e.key === 'm' || e.key === 'M') && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { som.ligado = !som.ligado; ajustarSom(); return; }
  if (!$('abertura').hidden) { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('pular').click(); } return; }
  if (!$('capa').hidden) { if (e.key === 'Escape' && !$('confirma').hidden) mostrarCapa(); return; }
  if ((e.key === 'h' || e.key === 'H') && !document.querySelector('.dados, .caderno') && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { abrirHistorico(); return; }
  if (e.key === '?' && !document.querySelector('.dados, .caderno') && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { abrirAjuda(); return; }
  if (document.querySelector('.dados, .caderno')) { if (e.key === 'Escape') document.querySelector('.caderno')?.remove(); return; }
  if (e.key === ' ' || e.key === 'Enter') { if ($('txt')) { e.preventDefault(); clicarDialogo(); } }
  const n = parseInt(e.key, 10); const b = document.querySelector(`#conteudo [data-i="${n - 1}"]`);
  if (b && !$('txt')) b.click();
});
// ?pular=1 vai direto para o jogo (testes)
if (/pular=1/.test(location.search)) { $('capa').hidden = true; iniciar(); } else mostrarCapa();
</script>
