<meta charset="utf-8">
<title>O Matusalém Desaparecido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Spectral:ital,wght@0,400;0,600;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: palco 16:9 com fundo realista e personagens recortados; hora, Fome e caderno pequenos dentro da caixa de texto.
   Dois temas para comparar: "livro" (identidade dos livros de V5) e "revista" (recorte de revista rasgada). */
:root {
  --noite: #120a0e;        /* fundo da página */
  --vinho: #2a1219;        /* painéis */
  --vinho-claro: #3d1b24;
  --papel: #efe3d2;        /* texto principal */
  --papel-fraco: #b9a594;
  --ambar: #e0a54a;        /* destaque quente da luminária */
  --sangue: #c8313f;       /* Fome */
  --borda: #5a2c35;
  --f-tipo: "Special Elite", "Courier New", monospace;  /* máquina de escrever */
  --tinta: #2a1d16;        /* texto sobre papel */
  --folha: #e9dfc9;        /* papel do diálogo */
  --f-texto: "Spectral", Georgia, "Times New Roman", serif;
  --f-nome: var(--f-tipo);  /* nomes e títulos */
  --acento: #8f1d26;       /* vermelho de destaque */
  --tinta-fraca: #6b5646;
  color-scheme: dark;
}
/* Tema livro: como as páginas de V5 (Galápagos): papel quase branco, títulos em Bodoni, texto em Garamond, vinho escuro */
:root[data-tema="livro"] {
  --folha: #f5f2eb; --tinta: #1d1716; --tinta-fraca: #6e6260; --acento: #7b1c1c;
  --f-nome: "Bodoni Moda", "Didot", Georgia, serif;
  --f-texto: "Cormorant Garamond", "EB Garamond", Garamond, Georgia, serif;
  --f-tipo: "Bodoni Moda", "Didot", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--noite); color: var(--papel); font-family: var(--f-texto);
  display: grid; place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.jogo { width: min(100%, calc((100vh - 32px) * 16 / 9), 1280px); position: relative; container-type: inline-size; }
.palco {
  position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
  background: #1a0d12;
  container-type: inline-size;
}
.palco img { position: absolute; user-select: none; -webkit-user-drag: none; }
.fundo { inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* retícula de jornal e vinheta por cima do fundo */
.reticula { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle, rgb(0 0 0 / .35) 28%, transparent 30%) 0 0 / .55cqw .55cqw,
              radial-gradient(ellipse at 60% 40%, transparent 40%, rgb(10 4 8 / .75) 100%); mix-blend-mode: multiply; }
/* Personagens: recortes "colados" na cena, um de cada lado. Rayo à direita, os outros à esquerda.
   Quem não está falando escurece; trocar de expressão troca só a imagem. */
.lado { position: absolute; bottom: -3%; height: 98%; margin: 0; opacity: 0; --giro: 1.5deg; transform: rotate(var(--giro)) translateY(4%);
  transition: opacity .5s, transform .5s, filter .3s; filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .65)); }
.lado.esq { left: 4%; }
.lado.dir { right: 4%; --giro: -1.5deg; }
/* escala por personagem, para os rostos ficarem do mesmo tamanho (a arte do Vincenzo é um close) */
.lado[data-p="Vincenzo"] { height: 90%; bottom: 4%; }
.lado.on { opacity: 1; transform: rotate(var(--giro)); }
.lado.calado { filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .65)) brightness(.5) saturate(.6); }
.palco .lado img { position: static; display: block; height: 100%; width: auto; }
/* nome embaixo do rosto, como legenda de revista */
.legenda { position: absolute; left: 50%; bottom: 36%; transform: translateX(-50%) rotate(calc(var(--giro) * -1.4)); white-space: nowrap;
  font-family: var(--f-nome); font-size: max(12px, 1.7cqw); background: var(--acento); color: #f4e7d2; padding: .2cqw 1.1cqw; box-shadow: .1cqw .3cqw .5cqw rgb(0 0 0 / .5); }
.lado.calado .legenda { background: #3a2a26; color: #c9b998; }
.moldura { inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.lado.troca { animation: troca .25s; }
@keyframes troca { 40% { transform: rotate(calc(var(--giro) * 1.5)) translateY(-1%); } 100% { transform: rotate(var(--giro)); } }

/* Hora, Fome e caderno: pequenos, no canto da caixa de texto, longe dos rostos */
.hud { position: absolute; top: .8cqw; right: 1.6cqw; display: flex; gap: 1.1cqw; align-items: center; z-index: 1;
  font-family: var(--f-tipo); font-size: max(11px, 1.05cqw); color: var(--tinta-fraca); letter-spacing: .04em; }
.hud .hora { color: var(--acento); font-variant-numeric: tabular-nums; }
/* Tempo acabando: na última hora e meia a hora pulsa, e a luz do amanhecer vai entrando pela cena */
.hud .hora.urgente { font-weight: 700; animation: urgente 1.2s ease-in-out infinite; }
@keyframes urgente { 50% { color: #d8452f; text-shadow: 0 0 6px rgb(216 69 47 / .5); } }
.sol { position: absolute; inset: 0; pointer-events: none; opacity: var(--sol, 0); transition: opacity 1.5s;
  background: linear-gradient(180deg, rgb(255 175 95 / .8), rgb(255 130 70 / .25) 45%, transparent 80%); mix-blend-mode: screen; }
@media (prefers-reduced-motion: reduce) { .hud .hora.urgente { animation: none; color: #d8452f; } }
.hud .barra { height: 3px; background: color-mix(in srgb, var(--tinta-fraca) 30%, transparent); width: max(36px, 4.5cqw); }
.hud .barra i { display: block; height: 100%; background: var(--acento); transition: width .4s; }
.hud .grupo { display: flex; gap: .5cqw; align-items: center; }
.fome { display: flex; gap: 2px; }
.fome i { width: max(7px, .8cqw); aspect-ratio: 1; border: 1px solid var(--sangue); }
.fome i.cheio { background: var(--sangue); }
.caderno-btn { font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid currentColor; padding: 0 .1em; cursor: pointer; }
.caderno-btn:hover, .caderno-btn:focus-visible { color: var(--acento); outline: none; }
.caderno-btn b { color: var(--acento); font-weight: 600; }

/* Diálogo */
.dialogo {
  position: absolute; left: 3%; right: 3%; bottom: 3.5%; min-height: 25%;
  background: var(--folha); color: var(--tinta); border: 0; box-shadow: .3cqw .5cqw 1.2cqw rgb(0 0 0 / .55);
  padding: 2.6cqw 2.6cqw 2.2cqw; z-index: 4; cursor: pointer; transform: rotate(.3deg); font-family: var(--f-texto);
}
.nome { position: absolute; top: 0; left: 2.4cqw; transform: translateY(-60%); font-family: var(--f-nome); font-weight: 600;
  background: var(--acento); color: #f4e7d2; padding: .25cqw 1.2cqw; font-size: max(13px, 1.7cqw); letter-spacing: .04em; }
.nome[hidden] { display: none; }
.fala { font-size: max(15px, 2.05cqw); line-height: 1.45; max-width: 70ch; min-height: 2.9em; text-wrap: pretty; }
.fala.narracao { font-style: italic; color: var(--tinta-fraca); }
.fala.voce { color: #6a2a12; }
.seta { position: absolute; right: 1.6cqw; bottom: 1.2cqw; font-family: var(--f-tipo); color: var(--acento); font-size: max(12px, 1.5cqw); animation: pisca 1s steps(2) infinite; }
@keyframes pisca { 50% { opacity: 0; } }
.passiva { display: inline-block; font-family: var(--f-tipo); font-style: normal; font-size: .72em; padding: .05em .5em; margin-right: .5em;
  background: #1d3550; color: #bcd9f5; vertical-align: .12em; }

.escolhas { display: grid; gap: .15cqw; margin: 0; padding: 0; list-style: none; }
.escolhas button {
  width: 100%; text-align: left; font: inherit; font-size: max(14px, 1.6cqw); line-height: 1.3; color: var(--tinta);
  background: transparent; border: 1px solid transparent; padding: .3cqw .8cqw; cursor: pointer; display: flex; gap: .8cqw; align-items: baseline;
}
.escolhas button:hover, .escolhas button:focus-visible { background: color-mix(in srgb, var(--acento) 12%, var(--folha)); border-color: color-mix(in srgb, var(--acento) 35%, var(--folha)); outline: none; }
.escolhas .num { font-family: var(--f-tipo); color: #8a7462; min-width: 1.2em; }
/* O porquê da opção vem depois dela, no mesmo texto, entre parênteses e na cor do tipo. */
.porque { font-family: var(--f-tipo); font-size: .78em; }
.porque.cla { color: #5d2f86; }
.porque.atrib { color: #24507a; }
.porque.prova { color: #85590c; }
.porque.teste { color: #2f6a2b; }
.porque.disc { color: #8e1b2b; }

/* Escolha de personagem */
.cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6cqw; }
.carta { text-align: left; font: inherit; color: var(--tinta); background: #f3ebd9; border: 1px solid #c9b998; padding: 1.4cqw; cursor: pointer; display: grid; gap: .4cqw; }
.carta:hover, .carta:focus-visible { border-color: var(--acento); outline: none; }
.carta b { font-family: var(--f-nome); font-size: max(16px, 2.2cqw); color: var(--acento); font-weight: 600; }
.carta span { font-size: max(13px, 1.6cqw); color: var(--tinta-fraca); }
.carta small { font-family: var(--f-tipo); font-size: max(11px, 1.3cqw); color: var(--tinta); }
.titulo { font-family: var(--f-nome); font-size: max(13px, 1.6cqw); color: var(--tinta-fraca); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 1.2cqw; }

/* Dados: mesa escura por cima do jogo inteiro, dados de dez faces caem, giram e param no valor */
.mesa-dados { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; cursor: pointer;
  background: radial-gradient(ellipse at 50% 45%, rgb(18 10 14 / .55), rgb(18 10 14 / .88)); animation: mesa-entra .25s ease-out; }
@keyframes mesa-entra { from { opacity: 0; } }
.dados { background: var(--folha); color: var(--tinta); box-shadow: .3cqw .6cqw 1.4cqw rgb(0 0 0 / .6); transform: rotate(-.6deg);
  padding: 1.8cqw 2.4cqw 1.4cqw; display: grid; gap: 1.1cqw; justify-items: center; font-family: var(--f-tipo); min-width: 44%; max-width: 86%; }
.dados .linha { display: flex; gap: 1cqw; flex-wrap: wrap; justify-content: center; padding: .6cqw 0; }
.dado { width: max(34px, 5cqw); aspect-ratio: .86; position: relative; filter: drop-shadow(0 .35cqw .3cqw rgb(0 0 0 / .45));
  animation: dado-cai .9s cubic-bezier(.2, .7, .3, 1) both; animation-delay: var(--atraso, 0s); transition: translate .25s, opacity .25s, filter .25s; }
#conteudo:focus { outline: none; }
.dado .face { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 12%;
  clip-path: polygon(50% 0, 100% 42%, 50% 100%, 0 42%);
  background: linear-gradient(160deg, #f6eedc 0 48%, #d9cbab 52% 100%); color: var(--tinta); font-size: max(14px, 2.1cqw); }
.dado .face::before { content: ""; position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 42%, 50% 64%, 0 42%); background: rgb(255 255 255 / .28); }
.dado.fomed .face { background: linear-gradient(160deg, #c8313f 0 48%, #8a1622 52% 100%); color: #fbe9e6; }
.dado.rolando .face { animation: dado-gira .18s linear infinite; }
.dado.parou.ok { translate: 0 -.5cqw; filter: drop-shadow(0 0 .5cqw rgb(224 165 74 / .95)) drop-shadow(0 .5cqw .3cqw rgb(0 0 0 / .4)); }
.dado.parou.ok .face { font-weight: 700; }
.dado.parou.dez { filter: drop-shadow(0 0 .9cqw rgb(255 196 90 / 1)) drop-shadow(0 .5cqw .3cqw rgb(0 0 0 / .4)); }
.dado.parou:not(.ok) { opacity: .55; }
.dado.parou.bestial { opacity: 1; filter: drop-shadow(0 0 .7cqw rgb(200 49 63 / .9)); }
@keyframes dado-cai {
  0% { transform: translate(var(--dx, 0), -260%) rotate(var(--giro0, -200deg)); opacity: 0; }
  15% { opacity: 1; }
  60% { transform: translate(0, 8%) rotate(14deg); }
  78% { transform: translate(0, -14%) rotate(-6deg); }
  100% { transform: none; }
}
@keyframes dado-gira { 50% { transform: scaleX(.55) skewY(8deg); } }
.dados .res { font-size: max(16px, 2.5cqw); color: var(--acento); border: 2px solid currentColor; padding: .1em .7em; margin: .3cqw 0 .8cqw; opacity: 0; transform: rotate(-4deg) scale(1.8); }
.dados .res.on { animation: carimbo .35s cubic-bezier(.3, 1.6, .5, 1) forwards; }
.dados .res.bom { color: #2f6a2b; }
@keyframes carimbo { to { opacity: 1; transform: rotate(-4deg) scale(1); } }
.dados .det { font-size: max(11px, 1.3cqw); color: var(--tinta-fraca); text-align: center; }
.dados .dica { opacity: 0; transition: opacity .3s; }
.dados .dica.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .mesa-dados, .dado, .dado.rolando .face { animation: none; } .dados .res.on { animation: none; opacity: 1; transform: rotate(-4deg); } }

/* Toast e caderno */
.toast { position: absolute; top: 0; left: 50%; translate: -50% -115%; z-index: 6; background: var(--acento); color: #f4e7d2; font-family: var(--f-tipo); font-size: max(11px, 1.2cqw);
  padding: .4cqw 1cqw; max-width: 40%; opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
.caderno { position: absolute; inset: 0; z-index: 7; background: rgb(12 6 9 / .9); display: grid; place-items: center; }
.caderno .bloco-folhas { width: min(88%, 720px); max-height: 88%; display: grid; grid-template-rows: auto 1fr; }
.caderno .abas { display: flex; gap: .4cqw; padding-left: 1.6cqw; }
.caderno .aba { font-family: var(--f-tipo); font-size: max(12px, 1.45cqw); border: 0; cursor: pointer; padding: .5cqw 1.3cqw .4cqw; background: #c9b998; color: #4a3828; }
.caderno .aba[aria-selected="true"] { background: var(--folha); color: var(--acento); }
.caderno .aba:focus-visible { outline: 2px solid #8f1d26; }
.caderno .folha { overflow: auto; background: var(--folha); color: var(--tinta); font-family: var(--f-texto); padding: 2.4cqw 2.8cqw; box-shadow: .3cqw .6cqw 1.4cqw rgb(0 0 0 / .6); }
.caderno textarea { width: 100%; min-height: 12em; resize: vertical; font-family: var(--f-tipo); font-size: max(14px, 1.7cqw); line-height: 1.6; color: #2a1810;
  border: 0; padding: 0 .6em; background: repeating-linear-gradient(#e9dcc4 0 calc(1.6em - 1px), #c9b5a0 calc(1.6em - 1px) 1.6em) local; }
.caderno textarea:focus { outline: 2px solid #8f1d26; }
.caderno h2 { font-family: var(--f-nome); font-weight: 600; font-size: max(16px, 2.2cqw); margin: 0 0 1cqw; }
.caderno ol { margin: 0; padding-left: 1.4em; display: grid; gap: .6cqw; font-size: max(14px, 1.8cqw); line-height: 1.4; }
.caderno .vazio { font-style: italic; color: #6d5440; }
.caderno .fechar { margin-top: 1.6cqw; font-family: var(--f-tipo); background: #2a1810; color: #e9dcc4; border: 0; padding: .6cqw 1.4cqw; cursor: pointer; font-size: max(13px, 1.5cqw); }

.rodape { margin-top: 10px; font-family: var(--f-tipo); font-size: 12px; color: var(--papel-fraco); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rodape button { font: inherit; color: var(--papel-fraco); background: none; border: 1px solid var(--borda); padding: 2px 8px; cursor: pointer; }
.rodape .acoes { display: flex; align-items: center; gap: 10px; }
.rodape .som { display: flex; align-items: center; gap: 6px; }
.rodape .som button[aria-pressed="false"] { text-decoration: line-through; opacity: .7; }
.rodape input[type=range] { width: 90px; accent-color: #c8313f; }

@media (max-width: 640px) {
  .dialogo { position: relative; left: auto; right: auto; bottom: auto; margin-top: 18px; min-height: 9em; padding: 18px 16px 16px; }
  .nome { left: 12px; }
  .cartas { grid-template-columns: 1fr; }
  .hud { top: 6px; right: 10px; }
}
/* Tema revista: caixa de texto em papel rasgado, legenda presa com fita */
:root[data-tema="revista"] .dialogo { background: none; box-shadow: none; filter: drop-shadow(.3cqw .5cqw .8cqw rgb(0 0 0 / .55)); }
:root[data-tema="revista"] .dialogo::before { content: ""; position: absolute; inset: -.8cqw -.6cqw; z-index: -1; background: var(--folha);
  -webkit-mask: var(--rasgo) 0 0 / 100% 100%; mask: var(--rasgo) 0 0 / 100% 100%; }
:root[data-tema="revista"] .legenda::before { content: ""; position: absolute; left: 50%; top: -.7cqw; width: 3.4cqw; height: 1.2cqw; translate: -50% 0; rotate: -4deg;
  background: rgb(236 228 206 / .7); box-shadow: 0 0 .2cqw rgb(0 0 0 / .2); }

/* Tema livro: página limpa, sem moldura de pôster; nomes em Bodoni maiúsculo, espaçado */
:root[data-tema="livro"] .moldura { display: none; }
:root[data-tema="livro"] .reticula { opacity: .35; }
:root[data-tema="livro"] .palco { border: 1.1cqw solid var(--folha); box-shadow: inset 0 0 0 1px var(--acento); }
:root[data-tema="livro"] .dialogo { transform: none; box-shadow: 0 .3cqw 1.4cqw rgb(0 0 0 / .45); border-top: 2px solid var(--acento); }
:root[data-tema="livro"] .fala { font-size: max(16px, 2.25cqw); line-height: 1.4; }
:root[data-tema="livro"] .nome, :root[data-tema="livro"] .legenda { text-transform: uppercase; letter-spacing: .18em; font-weight: 400; }
:root[data-tema="livro"] .legenda { background: var(--folha); color: var(--acento); transform: translateX(-50%); padding: .35cqw 1.4cqw; font-size: max(11px, 1.45cqw);
  border-top: 1px solid var(--acento); border-bottom: 1px solid var(--acento); box-shadow: 0 .2cqw .6cqw rgb(0 0 0 / .4); }
:root[data-tema="livro"] .lado.calado .legenda { background: #d9d3c8; color: #6e6260; }
:root[data-tema="livro"] .lado { --giro: 0deg; }
:root[data-tema="livro"] .titulo { letter-spacing: .2em; }
:root[data-tema="livro"] .carta b { font-weight: 400; letter-spacing: .03em; }
:root[data-tema="livro"] .caderno h2 { font-weight: 400; letter-spacing: .06em; }
:root[data-tema="livro"] .caderno textarea { font-family: var(--f-texto); }

@media (prefers-reduced-motion: reduce) { .lado, .toast { transition: none; animation: none; } .seta { animation: none; } }

/* ---------- Primeira versão jogável: elenco, ilustrações, capa e abertura ---------- */
.fundo { transition: opacity .4s; }
.fundo.trocando { opacity: 0; }
/* escala por personagem, para os rostos ficarem de tamanho parecido */
.lado[data-p="Nonna"] { height: 74%; bottom: 10%; }
.lado[data-p="Dante"], .lado[data-p="Constance"] { height: 92%; bottom: 2%; }
.lado[data-p="Harumi"] { height: 84%; bottom: 4%; }
.lado[data-p="Harumi"] .legenda { bottom: 34%; }
/* o Biel é um fantasma: azul, flutuando, com brilho frio */
.lado[data-p="Biel"] img { animation: flutua 4.5s ease-in-out infinite; filter: drop-shadow(0 0 1.6cqw rgb(150 200 255 / .75)); opacity: .9; }
@keyframes flutua { 50% { transform: translateY(-2.5%); } }
.lado[data-p="Biel"] .legenda { background: #2b4f7a; }

/* ilustração de momento-chave: foto de jornal colada por cima da cena */
.ilustracao { position: absolute; inset: 0; z-index: 3; display: grid; place-items: start center; padding-top: 3%; background: rgb(10 5 8 / .55); opacity: 0; pointer-events: none; transition: opacity .6s; }
.ilustracao.on { opacity: 1; }
.ilustracao img { position: static; width: 64%; aspect-ratio: 16 / 9; object-fit: cover; border: 1cqw solid #ece4d2; box-shadow: .4cqw .8cqw 1.6cqw rgb(0 0 0 / .7); transform: rotate(-1.2deg) scale(.96); transition: transform .8s; }
.ilustracao.on img { transform: rotate(-1.2deg); }

/* emblema do clã nas cartas de personagem */
.carta { grid-template-columns: auto 1fr; column-gap: 1.2cqw; align-items: start; }
.carta .emblema { grid-row: span 4; width: max(40px, 5.6cqw); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--acento); color: var(--acento);
  font-family: var(--f-nome); font-size: max(18px, 2.8cqw); transform: rotate(-8deg); }
.cartas.tres { grid-template-columns: repeat(3, 1fr); }

/* Capa */
.capa, .abertura { position: absolute; inset: 0; z-index: 20; overflow: hidden; background: #0b0608; container-type: inline-size; }
.capa[hidden], .abertura[hidden] { display: none; }
.capa .capa-fundo, .abertura .quadro { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.capa .capa-fundo { filter: brightness(.6) saturate(.8); animation: kb 30s ease-in-out infinite alternate; }
.capa .elenco { position: absolute; inset: 0; pointer-events: none; }
.capa .elenco img { position: absolute; bottom: -4%; height: 62%; filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .7)); }
.capa .logo { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); margin: 0; text-align: center; width: 92%; line-height: 1.25; }
.capa .logo .palavra { display: inline-block; white-space: nowrap; margin: 0 .6cqw; }
.letra { display: inline-block; font-family: var(--f-tipo); font-size: 4.6cqw; padding: .1em .18em; margin: 0 .06em; box-shadow: .15cqw .3cqw .5cqw rgb(0 0 0 / .55); }
.letra.a { background: #ece4d2; color: #1d1412; }
.letra.b { background: #1a1212; color: #ece4d2; font-family: var(--f-nome); }
.letra.c { background: #8f1d26; color: #f4e7d2; }
.letra.d { background: #d9c9a8; color: #5a1a1f; font-family: "Bodoni Moda", Georgia, serif; font-weight: 600; }
.capa .sub { position: absolute; left: 50%; top: 37%; transform: translateX(-50%) rotate(-.6deg); margin: 0; white-space: nowrap; font-family: var(--f-tipo); font-size: max(12px, 1.45cqw);
  background: #ece4d2; color: #2a1d16; padding: .4cqw 1.4cqw; }
.capa .menu { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); display: flex; gap: 1.6cqw; align-items: center; z-index: 1; }
.capa .menu button { font-family: var(--f-tipo); font-size: max(15px, 2.1cqw); border: 0; cursor: pointer; padding: .6cqw 2.4cqw; background: #8f1d26; color: #f4e7d2; box-shadow: .2cqw .4cqw .8cqw rgb(0 0 0 / .6); transform: rotate(-1deg); }
.capa .menu[hidden] { display: none; }
.capa .menu.confirma { flex-direction: column; gap: .8cqw; }
.capa .menu.confirma p { margin: 0; font-family: var(--f-tipo); font-size: max(13px, 1.5cqw); background: #ece4d2; color: #2a1d16; padding: .4cqw 1.2cqw; transform: rotate(-.5deg); text-align: center; }
.capa .menu.confirma div { display: flex; gap: 1.6cqw; }
.capa .salvo { position: absolute; left: 50%; bottom: 1.6%; transform: translateX(-50%); margin: 0; white-space: nowrap; font-family: var(--f-tipo); font-size: max(11px, 1.2cqw); color: #2a1d16; background: #ece4d2; padding: .1cqw .8cqw; box-shadow: .2cqw .3cqw .6cqw rgb(0 0 0 / .6); }
.capa .salvo:empty { display: none; }
.capa .menu button.sec { background: #ece4d2; color: #2a1d16; font-size: max(13px, 1.6cqw); transform: rotate(.8deg); }
.capa .menu button:hover, .capa .menu button:focus-visible { outline: 2px solid #ece4d2; outline-offset: 3px; }
.capa .finais { position: absolute; right: 2.4cqw; bottom: 2cqw; margin: 0; font-family: var(--f-tipo); font-size: max(11px, 1.2cqw); color: #c9b998; }

/* Abertura animada: quadros com zoom lento, hora, legenda e recortes entrando */
.abertura .quadro { opacity: 0; transition: opacity 1s; filter: saturate(.8); }
.abertura .quadro.on { opacity: 1; animation: kb 7s ease-out forwards; }
@keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.14) translate(-1.5%, -1%); } }
.abertura .vinheta { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgb(8 3 6 / .85) 100%); }
.abertura .hora-ab { position: absolute; left: 4%; top: 7%; font-family: var(--f-tipo); font-size: 3.4cqw; color: #ece4d2; background: #8f1d26; padding: .2cqw 1.2cqw; opacity: 0; transform: translateX(-30%); transition: opacity .5s, transform .5s; }
.abertura .legenda-ab { position: absolute; left: 4%; bottom: 9%; max-width: 62%; font-family: var(--f-texto); font-size: 2.5cqw; line-height: 1.35; color: #2a1d16; background: #ece4d2; padding: 1cqw 1.8cqw;
  box-shadow: .3cqw .5cqw 1cqw rgb(0 0 0 / .6); opacity: 0; transform: translateY(20%) rotate(-.8deg); transition: opacity .5s, transform .5s; }
.abertura .on-txt { opacity: 1 !important; transform: rotate(-.8deg) !important; }
.abertura .recorte-ab { position: absolute; bottom: -3%; height: 82%; opacity: 0; transition: opacity .7s, transform 1.4s cubic-bezier(.2, .7, .2, 1); filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .7)); }
.abertura .recorte-ab.dir { right: 5%; transform: translateX(25%) rotate(-2deg); }
.abertura .recorte-ab.esq { right: 8%; transform: translateX(-15%) rotate(2deg); }
.abertura .recorte-ab.on { opacity: 1; transform: rotate(-1.5deg); }
.abertura .carimbo { position: absolute; left: 50%; top: 40%; white-space: nowrap; font-family: var(--f-tipo); font-size: 9cqw; color: #c8313f; border: .6cqw solid #c8313f; padding: 0 2cqw; opacity: 0;
  transform: translate(-50%, -50%) rotate(-12deg) scale(2.2); transition: opacity .25s, transform .35s cubic-bezier(.3, 1.6, .5, 1); mix-blend-mode: screen; }
.abertura .quadro.escuro { filter: saturate(.5) brightness(.55); }
/* etiqueta de quem é quem, presa embaixo do recorte */
.abertura .quem-ab { position: absolute; right: 7%; top: 12%; font-family: var(--f-tipo); font-size: 1.9cqw; color: #f4e7d2; background: #8f1d26; padding: .3cqw 1.2cqw; rotate: 2deg;
  box-shadow: .2cqw .4cqw .8cqw rgb(0 0 0 / .6); opacity: 0; transform: translateY(-30%); transition: opacity .4s, transform .4s; z-index: 1; }
.abertura .quem-ab.on { opacity: 1; transform: none; }
.abertura .carimbo.on { opacity: .9; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
.abertura .bilhete { position: absolute; right: 9%; top: 18%; width: 34%; background: #efe6d0; color: #2a1d16; font-family: var(--f-tipo); font-size: 2.2cqw; line-height: 1.5; padding: 2.2cqw 2.4cqw;
  box-shadow: .4cqw .8cqw 1.4cqw rgb(0 0 0 / .7); opacity: 0; transform: rotate(4deg) translateY(-30%); transition: opacity .6s, transform 1s; }
.abertura .bilhete b { display: block; width: 3.4cqw; aspect-ratio: 1; border-radius: 50%; background: #23407a; margin: 1cqw 0 0 auto; box-shadow: inset 0 0 .6cqw rgb(0 0 0 / .5); }
.abertura .bilhete.on { opacity: 1; transform: rotate(4deg); }
.abertura .flash { position: absolute; inset: 0; background: #c8313f; opacity: 0; mix-blend-mode: multiply; pointer-events: none; }
.abertura .flash.on { animation: flash 1.2s; }
@keyframes flash { 10% { opacity: .9; } 100% { opacity: 0; } }
.abertura .pular { position: absolute; right: 2cqw; top: 2cqw; z-index: 2; font-family: var(--f-tipo); font-size: max(12px, 1.3cqw); background: rgb(236 228 210 / .85); color: #2a1d16; border: 0; padding: .4cqw 1.2cqw; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .abertura .quadro.on, .capa .capa-fundo, .lado[data-p="Biel"] img { animation: none; } }

/* ---------- Ajuda para quem não joga Vampiro: ficha, botão "?", dicas e tutorial ---------- */
/* botão "?" no canto de cima da cena, longe dos rostos */
.ajuda-btn { position: absolute; top: 2.2cqw; right: 2.2cqw; z-index: 5; width: max(28px, 3.2cqw); aspect-ratio: 1; border-radius: 50%; border: 2px solid #ece4d2;
  background: var(--acento); color: #f4e7d2; font-family: var(--f-nome); font-size: max(15px, 1.8cqw); line-height: 1; cursor: pointer; box-shadow: .2cqw .4cqw .8cqw rgb(0 0 0 / .6); }
.ajuda-btn:hover, .ajuda-btn:focus-visible { outline: 2px solid #ece4d2; outline-offset: 2px; }
/* dica de uma linha ao passar o mouse sobre uma etiqueta */
.dica-pop { position: absolute; z-index: 30; max-width: min(420px, 60%); pointer-events: none; background: #1d1412; color: #efe3d2; font-family: var(--f-texto); font-size: max(13px, 1.35cqw);
  line-height: 1.35; padding: .6em .8em; box-shadow: .2cqw .4cqw 1cqw rgb(0 0 0 / .6); border-left: 3px solid var(--sangue); opacity: 0; transition: opacity .15s; }
.dica-pop.on { opacity: 1; }
.dica-pop b { font-family: var(--f-tipo); font-weight: 400; color: var(--ambar); }
[data-dica] { cursor: help; }
.porque[data-dica], .passiva[data-dica] { text-decoration: underline dotted; text-underline-offset: .2em; }
.carta .ver { font-family: var(--f-tipo); font-size: max(11px, 1.2cqw); color: var(--acento); }
/* ficha, ajuda e tutorial usam a mesma folha do caderno */
.caderno .folha.longa { min-height: 0; }
.caderno:has(.folha.longa) { grid-template-rows: 100%; }
.caderno .bloco-folhas:has(.folha.longa) { width: min(92%, 860px); display: flex; flex-direction: column; }
.caderno .folha.longa { flex: 0 1 auto; padding-bottom: 0; }
/* botões sempre à vista, mesmo com a folha rolando */
.caderno .folha.longa .botoes { position: sticky; bottom: 0; background: var(--folha); padding: 1cqw 0 1.6cqw; margin-top: .6cqw; }
.caderno .folha h3 { font-family: var(--f-nome); font-weight: 600; font-size: max(14px, 1.7cqw); margin: 1.4cqw 0 .4cqw; color: var(--acento); }
.caderno .folha p { margin: 0 0 .7cqw; font-size: max(14px, 1.65cqw); line-height: 1.45; }
.caderno .folha .lead { font-style: italic; color: #6d5440; }
.ficha-tab { width: 100%; border-collapse: collapse; font-size: max(13px, 1.4cqw); line-height: 1.3; color: inherit; }
.ficha-tab th, .ficha-tab td { color: inherit; font-size: inherit; }
.ficha-tab th { text-align: left; font-family: var(--f-tipo); font-weight: 400; white-space: nowrap; padding: .25cqw 1cqw .25cqw 0; vertical-align: top; }
.ficha-tab td { padding: .25cqw 0; vertical-align: top; border-bottom: 1px solid #d6c7ad; }
.ficha-tab th { border-bottom: 1px solid #d6c7ad; }
.pontos { font-family: var(--f-tipo); color: var(--acento); letter-spacing: .1em; white-space: nowrap; padding-right: 1cqw !important; }
.caderno .botoes { display: flex; gap: 1cqw; flex-wrap: wrap; align-items: center; }
.caderno .botoes .fechar { margin-top: 0; }
.caderno .botoes .fechar.sec { background: none; color: #2a1810; border: 1px solid #2a1810; }
.caderno .botoes .fechar.principal { background: var(--acento); color: #f4e7d2; }
.caderno .passo { font-family: var(--f-tipo); font-size: max(11px, 1.2cqw); color: #6d5440; margin-left: auto; }
.exemplos { display: grid; gap: .4cqw; margin: .4cqw 0 .8cqw; padding: 0; list-style: none; font-size: max(13px, 1.5cqw); }
.exemplos .porque { margin-right: .4em; }
</style>

<script>{{V5}}</script>
<script>
const HISTORIA = {{STORY}};
// fundos: { balcao, salao, ... }; personagens: { rayo: { neutro, ... } }
const ARTE = { fundos: {{FUNDOS}}, moldura: "{{MOLDURA}}", rasgo: "{{RASGO}}", personagens: {{PERSONAGENS}} };
const $ = id => document.getElementById(id);
$('moldura').src = ARTE.moldura;
document.documentElement.style.setProperty('--rasgo', `url(${ARTE.rasgo})`);

// Tema visual: o Peter escolheu "revista" em 2026-10-29. O tema "livro" (identidade dos livros de V5) fica no CSS.
document.documentElement.dataset.tema = 'revista';

// Elenco. Testemunhas ficam à direita; Vincenzo, Dante, Constance e Nonna entram à esquerda.
const PERS = {
  rayo: { nome: 'Rayo', lado: 'dir', desc: 'Rayo, Gangrel barbudo de colete de couro e braço tatuado' },
  cao: { nome: 'Cão', lado: 'dir', desc: 'O Cão, Xerife Nosferatu de capuz e jaqueta de couro, olhos amarelos' },
  harumi: { nome: 'Harumi', lado: 'dir', desc: 'Harumi, mulher de cabelo preto liso e quimono preto com serpentes bordadas, sorriso de canto com uma presa à mostra' },
  biel: { nome: 'Biel', lado: 'dir', desc: 'O fantasma do Biel, rapaz magro de jaqueta de entregador, todo em azul e branco' },
  vincenzo: { nome: 'Vincenzo', lado: 'esq', desc: 'Vincenzo, o dono do bar, velho de cabelo branco e terno cinza risca de giz' },
  dante: { nome: 'Dante', lado: 'esq', desc: 'O Príncipe Dante, de barba grisalha e terno risca de giz azul-marinho' },
  constance: { nome: 'Constance', lado: 'esq', desc: 'Constance, a Primogênita Lasombra, de terno rosa' },
  nonna: { nome: 'Nonna', lado: 'esq', desc: 'Nonna Benedetta, senhora muito velha de xale preto de renda' },
};
const CHAVE = Object.fromEntries(Object.entries(PERS).map(([k, p]) => [p.nome, k]));
// folhas do caderno: chave da tag "# pista <aba>:" -> título da aba
const ABAS_PISTA = { dossie: 'Dossiê', rayo: 'Rayo', cao: 'Cão', harumi: 'Harumi', biel: 'Biel', constance: 'Constance', bar: 'Vincenzo' };
const FINAIS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
let cena;

// Põe o personagem no lado dele (troca quem estava lá). Devolve false se ele não tem arte.
function mostrarPersonagem(chave, expr) {
  const p = PERS[chave], a = ARTE.personagens[chave];
  if (!p || !a) return false;
  const src = a[expr || cena.expr[chave] || 'neutro'] || a.neutro;
  const lado = p.lado, el = $(lado), img = el.querySelector('img');
  if (cena[lado] !== chave) {
    cena[lado] = chave; el.dataset.p = p.nome; el.classList.remove('on'); void el.offsetWidth;
    el.querySelector('.legenda').textContent = p.nome; img.alt = p.desc + ', recortado como foto de revista.';
  }
  if (expr) cena.expr[chave] = expr;
  if (img.getAttribute('src') !== src) {
    const trocou = img.getAttribute('src'); img.src = src;
    if (trocou && el.classList.contains('on')) { el.classList.remove('troca'); void el.offsetWidth; el.classList.add('troca'); }
  }
  el.classList.add('on');
  return true;
}

// Quem fala fica aceso; o outro lado escurece. Quem está à esquerda só fica em cena enquanto fala ou é respondido.
function falando(chave) {
  if (cena.esq && chave !== cena.esq && chave !== cena.dir && cena.dir) tirar('esq');
  for (const lado of ['esq', 'dir']) $(lado).classList.toggle('calado', !!chave && cena[lado] !== chave);
}
function tirar(lado) { cena[lado] = null; $(lado).classList.remove('on', 'calado'); }
function limparCena() {
  cena = cena || { expr: {} }; cena.esq = cena.dir = null;
  for (const lado of ['esq', 'dir']) $(lado).classList.remove('on', 'calado', 'troca');
}

function trocarFundo(nome) {
  esconderIlustracao();
  if (MUSICA_FUNDO[nome]) tocarMusica(MUSICA_FUNDO[nome]);
  const src = ARTE.fundos[nome]; if (!src || $('fundo').getAttribute('src') === src) return;
  fundoAtual = nome;
  const f = $('fundo'); f.classList.add('trocando');
  setTimeout(() => { f.src = src; f.alt = DESC_FUNDO[nome] || ''; f.classList.remove('trocando'); }, 200);
}
const DESC_FUNDO = {
  balcao: 'O balcão do Porão do Vincenzo, com prateleiras de garrafas e luminárias amareladas.',
  salao: 'O salão do Porão: teto de tijolo em arco, mesinhas com toalha xadrez vermelha.',
  escada: 'O canto escuro embaixo da escada de pedra, com uma lâmpada pendurada.',
  sinuca: 'A mesa de sinuca de feltro verde, sob uma luminária baixa.',
  fundo_bar: 'A mesa do fundo, com toalha de renda, velas acesas, terço e fotos antigas.',
  corte: 'O salão arrumado para a Corte, com uma poltrona de veludo vermelho no centro.',
  rua: 'Rua do Bixiga à noite, na chuva.',
};
function mostrarIlustracao(nome) {
  const src = ARTE.fundos[nome]; if (!src) return;
  limparCena(); ilustracaoAtual = nome;
  const il = $('ilustracao'); il.querySelector('img').src = src; il.querySelector('img').alt = 'Ilustração provisória: ' + nome.replace(/_/g, ' ');
  il.classList.add('on');
}
function esconderIlustracao() { ilustracaoAtual = null; $('ilustracao').classList.remove('on'); }

const RESULTADOS = ['Falha', 'Sucesso', 'Crítico', 'Crítico bagunçado', 'Falha bestial'];
let story, fila, pistas, digitando, alvoTexto, fimTimer, exprPendente, finalTexto, finalLetra, fundoAtual, ilustracaoAtual;

function tipoBadge(g) {
  if (/^(Gangrel|Ventrue|Nosferatu|Brujah|Toreador|Tremere|Malkaviano|Lasombra|Ministério)/.test(g)) return 'cla';
  if (/^Prova/.test(g)) return 'prova';
  if (/^Teste/.test(g)) return 'teste';
  if (/^Disciplina/.test(g)) return 'disc';
  return 'atrib';
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function novaHistoria() {
  story = new inkjs.Story(HISTORIA);
  fila = []; pistas = []; finalTexto = finalLetra = null; cena = null;
  story.BindExternalFunction('rolar', (parada, fome, dif) => {
    const r = V5.rolarV5(parada, fome, dif); fila.push({ tipo: 'dados', r }); return r.resultado;
  }, false);
  story.BindExternalFunction('despertar', () => {
    const ok = V5.despertarV5();
    if (!ok) story.variablesState['fome'] = Math.min(5, story.variablesState['fome'] + 1);
    fila.push({ tipo: 'despertar', ok });
  }, false);
}
function iniciar() {
  novaHistoria();
  limparCena(); esconderIlustracao();
  fundoAtual = 'salao'; $('fundo').src = ARTE.fundos.salao; tocarMusica('salao');
  atualizarHud();
  avancar();
  if (!tutorialVisto()) mostrarTutorial();
}

// ---------- Jogo salvo: grava sozinho neste navegador antes de cada linha ----------
// Guarda o estado do Ink (variáveis, personagem, onde está no roteiro), as pistas do caderno e o que está em cena.
// Ao continuar, a linha que estava na tela é lida de novo. Acabou a partida, o save é apagado.
const SAVE = 'matusalem-save';
function salvar() {
  const v = story.variablesState;
  try {
    localStorage.setItem(SAVE, JSON.stringify({
      ink: story.state.toJson(), pistas, finalLetra, finalTexto, fundo: fundoAtual, ilustracao: ilustracaoAtual, musica: som.faixa,
      cena: { esq: cena.esq, dir: cena.dir, expr: cena.expr }, nome: v['nome'], minutos: v['minutos'],
    }));
  } catch (e) {}
}
function lerSave() { try { const s = JSON.parse(localStorage.getItem(SAVE)); return s && s.ink ? s : null; } catch (e) { return null; } }
function apagarSave() { try { localStorage.removeItem(SAVE); } catch (e) {} }
function continuar() {
  const s = lerSave(); if (!s) return iniciar();
  pararAbertura(); $('abertura').hidden = true; $('capa').hidden = true;
  novaHistoria();
  try { story.state.LoadJson(s.ink); if (!story.canContinue && !story.currentChoices.length) throw new Error('save vazio'); }
  catch (e) { apagarSave(); iniciar(); toast('O jogo salvo não abriu nesta versão. Começando do zero.'); return; }
  pistas = s.pistas || []; finalLetra = s.finalLetra || null; finalTexto = s.finalTexto || null;
  limparCena(); esconderIlustracao(); cena.expr = (s.cena && s.cena.expr) || {};
  fundoAtual = ARTE.fundos[s.fundo] ? s.fundo : 'salao';
  $('fundo').src = ARTE.fundos[fundoAtual]; $('fundo').alt = DESC_FUNDO[fundoAtual] || '';
  if (s.ilustracao) mostrarIlustracao(s.ilustracao);
  else for (const lado of ['esq', 'dir']) if (s.cena && s.cena[lado]) mostrarPersonagem(s.cena[lado]);
  tocarMusica(s.musica || MUSICA_FUNDO[fundoAtual] || 'salao');
  atualizarHud();
  avancar();
}

function atualizarHud() {
  const v = story.variablesState, min = v['minutos'];
  $('hora').textContent = horaDe(min);
  $('hora').classList.toggle('urgente', min >= v['limite'] - 100);
  $('sol').style.setProperty('--sol', Math.max(0, Math.min(1, (min - (v['limite'] - 160)) / 160)).toFixed(2));
  $('barra').style.width = Math.max(0, Math.min(100, 100 * (v['limite'] - min) / v['limite'])) + '%';
  $('fome').innerHTML = [1, 2, 3, 4, 5].map(i => `<i class="${i <= v['fome'] ? 'cheio' : ''}"></i>`).join('');
  $('n-pistas').textContent = pistas.length;
}

function horaDe(min) { const h = (23 + Math.floor(min / 60)) % 24, m = min % 60; return `${String(h).padStart(2, '0')}h${String(m).padStart(2, '0')}`; }
function toast(txt) { const t = $('toast'); t.textContent = txt; t.classList.add('on'); clearTimeout(fimTimer); fimTimer = setTimeout(() => t.classList.remove('on'), 2600); }

// Puxa a próxima linha do roteiro e trata efeitos (dados, tags) antes de mostrar.
function avancar() {
  if (fila.length) return mostrarEvento(fila.shift());
  if (story.canContinue) {
    salvar();
    let texto = story.Continue().trim();
    for (const tag of story.currentTags) {
      const [k, ...resto] = tag.split(':'); const val = resto.join(':').trim();
      const [chave, aba] = k.trim().split(/\s+/);
      if (chave === 'fundo') trocarFundo(val);
      if (chave === 'limpa') limparCena();
      if (chave === 'imagem') mostrarIlustracao(val);
      if (chave === 'entra') mostrarPersonagem(val);
      if (chave === 'expr') exprPendente = val;  // vale para quem fala nesta linha
      if (chave === 'musica') tocarMusica(val);
      if (chave === 'final') { finalLetra = val; finalTexto = texto; texto = ''; }
      if (chave === 'pista') { pistas.push({ aba: ABAS_PISTA[aba] || 'Dossiê', texto: val }); toast('Nova pista no caderno'); }
    }
    atualizarHud();
    if (fila.length) { fila.push({ tipo: 'linha', texto }); return avancar(); }
    if (!texto) return avancar();
    // pergunta curta logo antes das opções ("Para onde você vai?") vira o título das opções
    if (!story.canContinue && story.currentChoices.length && texto.length < 60 && !/: /.test(texto) && !/ :: /.test(texto)) return mostrarEscolhas(texto);
    return mostrarLinha(texto);
  }
  if (story.currentChoices.length) return mostrarEscolhas();
  mostrarFim();
}

function mostrarEvento(ev) {
  if (ev.tipo === 'linha') return ev.texto ? mostrarLinha(ev.texto) : avancar();
  if (ev.tipo === 'dados') return mostrarDados(ev.r);
  if (ev.tipo === 'despertar') { atualizarHud(); toast(ev.ok ? 'Teste de Despertar: a Fome se manteve' : 'Teste de Despertar: a Fome subiu'); return avancar(); }
}

// Os dados caem na mesa, giram mostrando números ao acaso e param um a um no valor tirado; depois vem o carimbo do resultado.
// Clicar durante a rolagem pula a animação; clicar de novo (ou Enter/Espaço) fecha e segue a história.
function mostrarDados(r) {
  const mesa = document.createElement('div'); mesa.className = 'mesa-dados';
  mesa.innerHTML = `<div class="dados" role="dialog" aria-label="Rolagem de dados"><div class="det">Parada de ${r.dados.length} dados · dificuldade ${r.dificuldade}</div>
    <div class="linha">${r.dados.map((d, i) => `<span class="dado rolando ${d.fome ? 'fomed' : ''}" style="--atraso:${(i * 0.09).toFixed(2)}s;--dx:${(Math.random() * 120 - 60).toFixed(0)}%;--giro0:${(Math.random() * 360 - 540).toFixed(0)}deg"><span class="face">${1 + Math.floor(Math.random() * 10)}</span></span>`).join('')}</div>
    <div class="res ${r.resultado === 1 || r.resultado === 2 ? 'bom' : ''}">${RESULTADOS[r.resultado]} · ${r.sucessos} sucesso${r.sucessos === 1 ? '' : 's'}</div>
    <div class="det dica">Dados vermelhos são de Fome. Clique para continuar.</div></div>`;
  document.querySelector('.jogo').appendChild(mesa);
  const dados = [...mesa.querySelectorAll('.dado')];
  const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pronto = false;
  const embaralha = setInterval(() => dados.forEach(el => { if (el.classList.contains('rolando')) el.firstChild.textContent = 1 + Math.floor(Math.random() * 10); }), 70);
  const timers = [];
  const parar = (el, i) => {
    const d = r.dados[i]; el.classList.remove('rolando'); el.classList.add('parou');
    el.firstChild.textContent = d.valor;
    if (d.valor >= 6) el.classList.add('ok');
    if (d.valor === 10) el.classList.add('dez');
    if (d.fome && d.valor === 1 && r.resultado === 4) el.classList.add('bestial');
  };
  const terminar = () => {
    if (pronto) return; pronto = true; clearInterval(embaralha); timers.forEach(clearTimeout);
    dados.forEach((el, i) => { el.style.animation = 'none'; parar(el, i); });
    mesa.querySelector('.res').classList.add('on'); mesa.querySelector('.dica').classList.add('on');
  };
  if (reduzido) terminar();
  else {
    dados.forEach((el, i) => timers.push(setTimeout(() => parar(el, i), 750 + i * 160)));
    timers.push(setTimeout(terminar, 900 + dados.length * 160));
  }
  const fechar = () => { if (!pronto) return terminar(); clearInterval(embaralha); mesa.remove(); document.removeEventListener('keydown', tecla); avancar(); };
  const tecla = e => { if (!mesa.isConnected) return document.removeEventListener('keydown', tecla); if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fechar(); } };
  mesa.addEventListener('click', e => { e.stopPropagation(); fechar(); }); setTimeout(() => document.addEventListener('keydown', tecla), 50);
}

function mostrarLinha(texto) {
  const v = story.variablesState; let nome = null, chave = null, corpo = texto, classe = 'narracao', passiva = null;
  const m = texto.match(/^([A-ZÀ-Ú][a-zà-ú]+): (.*)$/);
  if (m && (m[1] === 'Você' || CHAVE[m[1]])) { nome = m[1] === 'Você' ? v['nome'] : m[1]; chave = CHAVE[m[1]] || null; corpo = m[2]; classe = m[1] === 'Você' ? 'voce' : ''; }
  const p = texto.match(/^(.+?) :: (.*)$/);
  if (!nome && p) { passiva = p[1]; corpo = p[2]; }
  // personagem com arte: aparece no lado dele e o nome vai para a legenda; sem arte (você), o nome fica na caixa
  const comArte = chave && !$('ilustracao').classList.contains('on') && mostrarPersonagem(chave, exprPendente);
  exprPendente = null;
  falando(comArte ? chave : null);
  $('nome').hidden = !nome || comArte; if (nome) $('nome').textContent = nome;
  const c = $('conteudo');
  c.innerHTML = `<div class="fala ${classe}">${passiva ? `<span class="passiva" data-dica="${esc(dicaDe(passiva, corpo, true))}">${esc(passiva)}</span>` : ''}<span id="txt"></span></div><span class="seta" aria-hidden="true">▼</span>`;
  digitar(corpo);
}

function digitar(t) {
  const alvo = $('txt'); alvoTexto = t; let i = 0; clearInterval(digitando);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { alvo.textContent = t; return; }
  digitando = setInterval(() => { i += 2; alvo.textContent = t.slice(0, i); if (i >= t.length) clearInterval(digitando); }, 16);
}

function clicarDialogo() {
  const alvo = $('txt'); if (!alvo) return;
  if (alvo.textContent.length < alvoTexto.length) { clearInterval(digitando); alvo.textContent = alvoTexto; return; }
  avancar();
}

const EMBLEMA = { Gangrel: 'G', Nosferatu: 'N', 'Ministério': 'M' };

function finaisVistos() { try { return JSON.parse(localStorage.getItem('matusalem-finais') || '[]'); } catch (e) { return []; } }

    <ul class="escolhas"><li><button type="button" data-a="caderno"><span class="num">1</span><span>Ver o caderno</span></button></li><li><button type="button" data-a="de-novo"><span class="num">2</span><span>Jogar de novo com outro personagem</span></button></li><li><button type="button" data-a="menu"><span class="num">3</span><span>Voltar ao menu</span></button></li></ul>`;

// Caderno: uma folha por fonte (dossiê e cada testemunha que já deu pista) e uma folha livre para anotar.
// As anotações ficam só neste navegador.
let abaAtual = 'Dossiê', anotacoes = '';
try { anotacoes = localStorage.getItem('porao-anotacoes') || ''; } catch (e) {}

function abrirCaderno() {
  const abas = ['Dossiê', ...Object.values(ABAS_PISTA).filter(a => a !== 'Dossiê' && pistas.some(p => p.aba === a)), 'Anotações'];
  if (!abas.includes(abaAtual)) abaAtual = 'Dossiê';
  const el = document.createElement('div'); el.className = 'caderno';
  el.innerHTML = `<div class="bloco-folhas"><div class="abas" role="tablist">${abas.map(a =>
    `<button class="aba" role="tab" type="button" data-aba="${esc(a)}">${esc(a)}</button>`).join('')}</div><div class="folha" role="tabpanel"></div></div>`;
  $('palco').appendChild(el);
  const folha = el.querySelector('.folha');
  const mostrar = aba => {
    abaAtual = aba;
    el.querySelectorAll('.aba').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === aba));
    if (aba === 'Anotações') {
      folha.innerHTML = `<h2>Minhas anotações</h2><textarea aria-label="Minhas anotações" placeholder="Escreva aqui o que quiser lembrar."></textarea>`;
      const t = folha.querySelector('textarea'); t.value = anotacoes;
      t.addEventListener('input', () => { anotacoes = t.value; try { localStorage.setItem('porao-anotacoes', anotacoes); } catch (e) {} });
    } else {
      const lista = pistas.filter(p => p.aba === aba);
      folha.innerHTML = `<h2>${aba === 'Dossiê' ? 'Dossiê do Príncipe' : 'O que descobri: ' + esc(aba)}</h2>${lista.length ? `<ol>${lista.map(p => `<li>${esc(p.texto)}</li>`).join('')}</ol>` : '<p class="vazio">Nada anotado ainda.</p>'}`;
    }
    folha.insertAdjacentHTML('beforeend', '<button class="fechar" type="button">Fechar</button>');
    folha.querySelector('.fechar').addEventListener('click', () => el.remove());
  };
  el.querySelectorAll('.aba').forEach(b => b.addEventListener('click', () => mostrar(b.dataset.aba)));
  el.addEventListener('click', e => { if (e.target === el) el.remove(); });
  mostrar(abaAtual);
  el.querySelector(`.aba[data-aba="${abaAtual}"]`).focus();
}

// ---------- Capa ----------
function letrasDeRecorte(texto) {
  // cada letra recortada de uma revista diferente, como bilhete de sequestro
  let n = 0; const tipos = 'abcadbcabd';
  return texto.split(' ').map(p => `<span class="palavra">${[...p].map(ch => {
    n++; const giro = ((n * 37) % 11 - 5) * 1.1, sobe = ((n * 53) % 7 - 3) * .12;
    return `<span class="letra ${tipos[n % tipos.length]}" style="transform:rotate(${giro}deg) translateY(${sobe}em)">${ch}</span>`; }).join('')}</span>`).join(' ');
}
$('logo').innerHTML = `<span aria-hidden="true">${letrasDeRecorte('O MATUSALÉM DESAPARECIDO')}</span>`;
$('capa-fundo').src = ARTE.fundos.rua;
// elenco da capa: a Primogênita Lasombra, o Príncipe e o Xerife, sem um recorte cobrir o outro
[['constance', 2, 2, 56], ['dante', 34, 0, 62], ['cao', 75, -2, 60]].forEach(([k, x, giro, alt]) => {
  const src = ARTE.personagens[k]?.neutro; if (!src) return;
  const img = document.createElement('img'); img.src = src; img.alt = '';
  img.style.cssText = `left:${x}%;height:${alt}%;transform:rotate(${giro}deg)`; $('elenco').appendChild(img);
});
function mostrarCapa() {
  document.querySelector('.mesa-dados')?.remove();
  pararAbertura(); $('abertura').hidden = true; $('capa').hidden = false; tocarMusica('capa');
  const v = finaisVistos().length; $('finais').textContent = v ? `Finais encontrados: ${v} de ${FINAIS.length}` : '';
  // com jogo salvo, "Continuar" vira o botão principal e "Novo jogo" pede confirmação
  const s = lerSave(); $('menu').hidden = false; $('confirma').hidden = true;
  $('continuar').hidden = !s; $('novo-jogo').classList.toggle('sec', !!s);
  $('salvo').textContent = s ? `Jogo salvo${s.nome ? ': ' + s.nome : ''}${s.minutos != null ? ', ' + horaDe(s.minutos) : ''}` : '';
  (s ? $('continuar') : $('novo-jogo')).focus({ preventScroll: true });
}
function novoJogo() {
  if (lerSave()) { $('menu').hidden = true; $('confirma').hidden = false; $('confirma-nao').focus({ preventScroll: true }); return; }
  tocarAbertura(iniciar);
}

const QUADROS = [
  // o Matusalém nunca tem rosto: só o sarcófago lacrado, no escuro
  { fundo: 'bunker', escuro: true, hora: '00h00', txt: 'Um sarcófago lacrado atravessa o oceano. Dentro dele dorme um Matusalém, mais velho que a cidade.', carimbo: 'NÃO ABRIR' },
  { fundo: 'porto', hora: '00h10', txt: 'No Porto de Santos, a Harumi libera a carga. E abre o que não devia.', rec: 'harumi', quem: 'HARUMI · Ministério, porto' },
  { fundo: 'serra', hora: '01h00', txt: 'Um caminhão sobe a Serra do Mar, na neblina, levando a carga para o cofre do Príncipe.', rec: 'rayo', quem: 'RAYO · Gangrel, motorista' },
  { fundo: 'tunel', hora: '02h40', txt: 'O portão do túnel da Vila Sônia. Alguém espera a carga no escuro.', rec: 'cao', quem: 'O CÃO · Xerife' },
  { fundo: 'tunel', hora: '03h30', txt: 'O caminhão chega vazio. O Matusalém sumiu, e o rapaz que vigiava a carga também.', carimbo: 'SUMIU' },
  { fundo: 'corte', hora: '22h00', txt: 'Na noite seguinte, o Príncipe Dante quer um nome antes do amanhecer.', rec: 'dante', quem: 'DANTE · Príncipe de São Paulo' },
  { fundo: 'rua', hora: '22h30', txt: 'E ele mandou chamar você.', bilhete: true },
];
let timersAbertura = [];
function pararAbertura() { timersAbertura.forEach(clearTimeout); timersAbertura = []; }
function tocarAbertura(depois) {
  pararAbertura();
  const ab = $('abertura'), qs = ab.querySelectorAll('.quadro'), rec = ab.querySelector('.recorte-ab');
  const hora = ab.querySelector('.hora-ab'), leg = ab.querySelector('.legenda-ab'), carimbo = ab.querySelector('.carimbo'), bilhete = ab.querySelector('.bilhete'), flash = ab.querySelector('.flash'), quem = ab.querySelector('.quem-ab');
  [rec, carimbo, bilhete, quem].forEach(e => e.classList.remove('on')); qs.forEach(q => q.classList.remove('on')); hora.classList.remove('on-txt'); leg.classList.remove('on-txt');
  $('capa').hidden = true; ab.hidden = false; $('pular').focus({ preventScroll: true }); tocarMusica('abertura', false);
  const fim = () => { pararAbertura(); ab.hidden = true; depois(); };
  ab.onclick = e => { if (e.target.id === 'pular') fim(); };
  $('pular').onclick = fim;
  let t = 0;
  const em = (ms, f) => timersAbertura.push(setTimeout(f, ms));
  QUADROS.forEach((q, i) => {
    const dur = q.bilhete ? 5200 : 5000;
    em(t, () => {
      const atual = qs[i % 2], antigo = qs[(i + 1) % 2];
      if (!i || QUADROS[i - 1].fundo !== q.fundo) { atual.src = ARTE.fundos[q.fundo]; atual.classList.toggle('escuro', !!q.escuro); atual.classList.remove('on'); void atual.offsetWidth; atual.classList.add('on'); antigo.classList.remove('on'); }
      hora.classList.remove('on-txt'); leg.classList.remove('on-txt'); rec.classList.remove('on'); carimbo.classList.remove('on'); quem.classList.remove('on');
      em(300, () => { hora.textContent = q.hora; hora.classList.add('on-txt'); });
      em(700, () => { leg.textContent = q.txt; leg.classList.add('on-txt'); });
      if (q.rec) em(900, () => { rec.src = ARTE.personagens[q.rec].neutro; rec.className = 'recorte-ab ' + (i % 2 ? 'dir' : 'esq'); void rec.offsetWidth; rec.classList.add('on'); });
      if (q.quem) em(1500, () => { quem.textContent = q.quem; quem.classList.add('on'); });
      if (q.carimbo) em(1200, () => { carimbo.textContent = q.carimbo; carimbo.classList.add('on'); flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on'); });
      if (q.bilhete) em(900, () => bilhete.classList.add('on'));
    });
    t += dur;
  });
  em(t, fim);
}

// ---------- Música: uma faixa por cena (musica/<nome>.mp3), com fade na troca ----------
// Todas CC0, do OpenGameArt (créditos em musica/CREDITOS.md). A tag "# musica: nome" do roteiro troca a faixa; sem ela, vale a do fundo.
const MUSICA_FUNDO = { rua: 'rua', salao: 'salao', balcao: 'balcao', escada: 'escada', sinuca: 'sinuca', fundo_bar: 'sessao', corte: 'corte' };
const som = { faixa: null, el: null, vol: .6, ligado: true, liberado: false };
try { Object.assign(som, JSON.parse(localStorage.getItem('matusalem-som') || '{}')); } catch (e) {}
const volumeAlvo = () => som.ligado ? som.vol : 0;
function fade(el, para, ms, fim) {
  cancelAnimationFrame(el._fade); const de = el.volume, t0 = performance.now();
  const passo = t => { const k = Math.max(0, Math.min(1, (t - t0) / ms)); el.volume = de + (para - de) * k; if (k < 1) el._fade = requestAnimationFrame(passo); else fim?.(); };
  el._fade = requestAnimationFrame(passo);
}
function tocarMusica(nome, loop = true) {
  if (som.faixa === nome) return;
  som.faixa = nome;
  const velho = som.el; if (velho) fade(velho, 0, 1200, () => velho.pause());
  const el = som.el = new Audio(`musica/${nome}.mp3`); el.loop = loop; el.volume = 0;
  if (som.liberado && !document.hidden) el.play().then(() => fade(el, volumeAlvo(), 1500)).catch(() => {});
}
function ajustarSom() {
  $('som').setAttribute('aria-pressed', som.ligado); $('volume').value = Math.round(som.vol * 100);
  if (som.el) fade(som.el, volumeAlvo(), 300);
  try { localStorage.setItem('matusalem-som', JSON.stringify({ vol: som.vol, ligado: som.ligado })); } catch (e) {}
}
// o navegador só deixa tocar som depois do primeiro clique ou tecla
function liberarSom() {
  if (som.liberado) return; som.liberado = true;
  som.el?.play().then(() => fade(som.el, volumeAlvo(), 1500)).catch(() => {});
}
addEventListener('pointerdown', liberarSom, true); addEventListener('keydown', liberarSom, true);
document.addEventListener('visibilitychange', () => { if (!som.el || !som.liberado) return; if (document.hidden) som.el.pause(); else som.el.play().catch(() => {}); });
$('som').addEventListener('click', () => { som.ligado = !som.ligado; if (som.ligado && !som.vol) som.vol = .6; ajustarSom(); });
$('volume').addEventListener('input', e => { som.vol = e.target.value / 100; som.ligado = som.vol > 0; ajustarSom(); });
ajustarSom();

// Janela com a cara do caderno: abas opcionais, uma folha e botões embaixo. montar(aba) devolve { html, botoes: [[texto, classe, ação]] }.
function abrirJanela(rotulo, abas, inicial, montar) {
  document.querySelector('.caderno')?.remove(); esconderDica();
  const el = document.createElement('div'); el.className = 'caderno';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', rotulo);
  el.innerHTML = `<div class="bloco-folhas">${abas.length ? `<div class="abas" role="tablist">${abas.map(a =>
    `<button class="aba" role="tab" type="button" data-aba="${esc(a)}">${esc(a)}</button>`).join('')}</div>` : '<div></div>'}<div class="folha longa" tabindex="-1"></div></div>`;
  $('palco').appendChild(el);
  const folha = el.querySelector('.folha'), fechar = () => el.remove();
  const mostrar = aba => {
    el.querySelectorAll('.aba').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === aba));
    const { html, botoes = [] } = montar(aba, mostrar, fechar);
    folha.innerHTML = html + `<div class="botoes">${botoes.map(([t, cl], i) => cl === 'passo' ? `<span class="passo">${esc(t)}</span>`
      : `<button class="fechar ${cl || ''}" type="button" data-b="${i}">${esc(t)}</button>`).join('')}</div>`;
    folha.querySelectorAll('[data-b]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); botoes[+b.dataset.b][2](); }));
    folha.scrollTop = 0;
    (folha.querySelector('.principal') || folha.querySelector('[data-b]'))?.focus({ preventScroll: true });
  };
  el.querySelectorAll('.aba').forEach(b => b.addEventListener('click', () => mostrar(b.dataset.aba)));
  el.addEventListener('click', e => { if (e.target === el) fechar(); });
  mostrar(inicial);
  return el;
}

// Dica de uma linha sobre cada etiqueta: o que ela faz ou por que a opção apareceu.
function paradaDoTeste(nomeTeste) {
  const v = story.variablesState;
  if (/Persuasão/.test(nomeTeste)) return v['carisma'] + 1;
  if (/Subterfúgio/.test(nomeTeste)) return v['manipulacao'] + v['subterfugio'];
  if (/Intimidação/.test(nomeTeste)) return v['intimidacao'];
  return null;
}
function chanceDe(parada, fome, dif) {
  let ok = 0; const N = 3000;
  for (let i = 0; i < N; i++) { const r = V5.rolarV5(parada, fome, dif).resultado; if (r >= 1 && r <= 3) ok++; }
  return Math.round(100 * ok / N / 5) * 5;
}
function dicaDe(g, texto, passiva) {
  const v = story.variablesState, tipo = tipoBadge(g);
  if (tipo === 'cla') return `Só aparece porque você é ${g}. ${CLAS[g] || ''}`;
  if (tipo === 'prova') {
    const rot = (texto.split(':')[0] || '').trim();
    const onde = rot === 'Dossiê' ? 'o que o Príncipe contou no dossiê' : `a pista certa no caderno${rot ? ` ("${rot}")` : ''}`;
    return `Só aparece porque você já tem ${onde}. Jogar uma prova na cara de alguém pode pegar a pessoa numa mentira.`;
  }
  if (tipo === 'disc') {
    const d = g.replace(/^Disciplina:\s*/, '');
    return `${d}, a sua Disciplina: ${DISC[d]?.curta || 'um poder de vampiro.'} ${CUSTO_DISC}`;
  }
  if (tipo === 'teste') {
    const m = g.match(/^Teste:\s*(.+?),\s*dif\.\s*(\d+)/); if (!m) return 'Teste: rola dados; cada 6 ou mais é um sucesso.';
    const dif = +m[2], n = paradaDoTeste(m[1]), f = v['fome'];
    if (n == null) return `Teste: rola dados (${m[1]}) e precisa de ${dif} sucesso${dif === 1 ? '' : 's'}. Cada dado com 6 ou mais conta um.`;
    const verm = Math.min(f, n);
    return `Teste: você rola ${n} dados (${m[1]}) e precisa de ${dif} sucesso${dif === 1 ? '' : 's'}. Cada dado com 6 ou mais conta um.${verm ? ` ${verm} ${verm === 1 ? 'deles é' : 'deles são'} de Fome.` : ''} Chance de passar: uns ${chanceDe(n, f, dif)}%.`;
  }
  const m = g.match(/^(.+?) (\d+)$/);
  if (m && m[1] === 'Fome') return `${passiva ? 'Você sentiu isto' : 'Só aparece'} porque a sua Fome está em ${m[2]} ou mais. Com fome, os sentidos de predador ficam mais aguçados.`;
  if (m) {
    const nota = NOTAS.find(n => n[1] === m[1]);
    return `${passiva ? 'Você percebeu isto sozinho' : 'Só aparece'} porque o seu ${m[1]} é ${m[2]} ou mais.${nota ? ' ' + nota[1] + ': ' + nota[2].charAt(0).toLowerCase() + nota[2].slice(1) : ''}`;
  }
  return '';
}

const DICAS_HUD = {
  hora: 'Hora da noite. Quase toda pergunta gasta uns 20 minutos. O sol nasce às 05h40.',
  fome: 'Fome, de 0 a 5. Usar Disciplina pode subir. Cada ponto vira um dado vermelho nos testes, que pode dar falha bestial.',
  caderno: 'Caderno: as pistas que você juntou, uma folha por testemunha, e uma folha para anotar.',
};
document.querySelectorAll('.hud [data-dica]').forEach(el => { el.dataset.dica = DICAS_HUD[el.dataset.dica]; });
function mostrarDica(el) {
  const txt = el?.dataset.dica; if (!txt) return esconderDica();
  const pop = $('dica-pop'), jogo = document.querySelector('.jogo').getBoundingClientRect(), r = el.getBoundingClientRect();
  pop.textContent = txt; pop.classList.add('on');
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let top = r.top - jogo.top - h - 8; if (top < 0) top = r.bottom - jogo.top + 8;
  pop.style.left = Math.max(0, Math.min(jogo.width - w, r.left - jogo.left + r.width / 2 - w / 2)) + 'px';
  pop.style.top = top + 'px';
}
function esconderDica() { $('dica-pop').classList.remove('on'); }
document.querySelector('.jogo').addEventListener('mouseover', e => mostrarDica(e.target.closest('[data-dica]')));
document.querySelector('.jogo').addEventListener('mouseleave', esconderDica);
// teclado: com a opção em foco, mostra a dica da etiqueta dela
document.querySelector('.jogo').addEventListener('focusin', e => { const el = e.target.closest?.('[data-dica]') || e.target.querySelector?.('[data-dica]'); el ? mostrarDica(el) : esconderDica(); });
addEventListener('pointerdown', esconderDica, true);

document.addEventListener('keydown', e => {
  if ((e.key === 'm' || e.key === 'M') && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { som.ligado = !som.ligado; ajustarSom(); return; }
  if (!$('abertura').hidden) { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('pular').click(); } return; }
  if (!$('capa').hidden) { if (e.key === 'Escape' && !$('confirma').hidden) mostrarCapa(); return; }
  if (e.key === '?' && !document.querySelector('.dados, .caderno') && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { abrirAjuda(); return; }
  if (document.querySelector('.dados, .caderno')) { if (e.key === 'Escape') document.querySelector('.caderno')?.remove(); return; }
  if (e.key === ' ' || e.key === 'Enter') { if ($('txt')) { e.preventDefault(); clicarDialogo(); } }
  const n = parseInt(e.key, 10); const b = document.querySelector(`#conteudo [data-i="${n - 1}"]`);
  if (b && !$('txt')) b.click();
});
// ?pular=1 vai direto para o jogo (testes)
if (/pular=1/.test(location.search)) { $('capa').hidden = true; iniciar(); } else mostrarCapa();
