<style>
/* Layout: palco 16:9 em pixel art, HUD no canto, caixa de diálogo sobre o balcão (abaixo do palco no celular) */
:root {
  --noite: #120a0e;        /* fundo da página */
  --vinho: #2a1219;        /* painéis */
  --vinho-claro: #3d1b24;
  --papel: #efe3d2;        /* texto principal */
  --papel-fraco: #b9a594;
  --ambar: #e0a54a;        /* destaque quente da luminária */
  --sangue: #c8313f;       /* Fome */
  --borda: #5a2c35;
  --f-pixel: "Pixelify Sans", "Courier New", monospace;
  --f-texto: "Spectral", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--noite); color: var(--papel); font-family: var(--f-texto);
  display: grid; place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.jogo { width: min(100%, calc((100vh - 32px) * 16 / 9), 1280px); position: relative; }
.palco {
  position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
  border: 2px solid var(--borda); background: #1a0d12;
  container-type: inline-size;
}
.palco img { position: absolute; image-rendering: pixelated; user-select: none; -webkit-user-drag: none; }
.fundo { inset: 0; width: 100%; height: 100%; }
.rayo { left: 56.25%; top: 8.9%; width: 37.5%; opacity: 0; transform: translateY(3%); transition: opacity .6s, transform .6s; }
.rayo.on { opacity: 1; transform: none; }
.balcao { left: 0; top: 72.2%; width: 100%; height: 27.8%; object-fit: cover; object-position: bottom; }
.capacete { left: 40%; top: 59.5%; width: 9%; opacity: 0; transition: opacity .6s; }
.capacete.on { opacity: 1; }

/* HUD */
.hud { position: absolute; top: 2.5cqw; left: 2.5cqw; display: flex; gap: 1.2cqw; align-items: stretch; font-family: var(--f-pixel); z-index: 3; }
.hud .bloco { background: rgb(18 10 14 / .82); border: 1px solid var(--borda); padding: .8cqw 1.2cqw; display: grid; gap: .3cqw; }
.hud .rotulo { font-size: max(10px, 1.15cqw); color: var(--papel-fraco); letter-spacing: .08em; text-transform: uppercase; }
.hud .hora { font-size: max(16px, 2.6cqw); color: var(--ambar); font-variant-numeric: tabular-nums; line-height: 1; }
.hud .barra { height: 4px; background: var(--vinho-claro); width: max(80px, 11cqw); }
.hud .barra i { display: block; height: 100%; background: var(--ambar); transition: width .4s; }
.fome { display: flex; gap: 4px; }
.fome i { width: max(9px, 1.3cqw); aspect-ratio: 1; border: 1px solid var(--sangue); }
.fome i.cheio { background: var(--sangue); }
.caderno-btn { font: inherit; color: var(--papel); background: rgb(18 10 14 / .82); border: 1px solid var(--borda); padding: .8cqw 1.2cqw; cursor: pointer; text-align: left; }
.caderno-btn:hover, .caderno-btn:focus-visible { border-color: var(--ambar); outline: none; }
.caderno-btn b { color: var(--ambar); font-size: max(16px, 2.6cqw); display: block; line-height: 1; }

/* Diálogo */
.dialogo {
  position: absolute; left: 3%; right: 3%; bottom: 3.5%; min-height: 25%;
  background: rgb(26 12 17 / .94); border: 2px solid var(--borda); box-shadow: 0 0 0 4px rgb(18 10 14 / .6);
  padding: 2.2cqw 2.6cqw; z-index: 4; cursor: pointer;
}
.nome { position: absolute; top: 0; left: 2.4cqw; transform: translateY(-60%); font-family: var(--f-pixel); font-weight: 600;
  background: var(--ambar); color: #1d0e08; padding: .25cqw 1.2cqw; font-size: max(13px, 1.7cqw); letter-spacing: .04em; }
.nome[hidden] { display: none; }
.fala { font-size: max(15px, 2.05cqw); line-height: 1.45; max-width: 70ch; min-height: 2.9em; text-wrap: pretty; }
.fala.narracao { font-style: italic; color: var(--papel-fraco); }
.fala.voce { color: #f6d9a8; }
.seta { position: absolute; right: 1.6cqw; bottom: 1.2cqw; font-family: var(--f-pixel); color: var(--ambar); font-size: max(12px, 1.5cqw); animation: pisca 1s steps(2) infinite; }
@keyframes pisca { 50% { opacity: 0; } }
.passiva { display: inline-block; font-family: var(--f-pixel); font-style: normal; font-size: .72em; padding: .05em .5em; margin-right: .5em;
  background: #1d3550; color: #bcd9f5; vertical-align: .12em; }

.escolhas { display: grid; gap: .15cqw; margin: 0; padding: 0; list-style: none; }
.escolhas button {
  width: 100%; text-align: left; font: inherit; font-size: max(14px, 1.6cqw); line-height: 1.3; color: var(--papel);
  background: transparent; border: 1px solid transparent; padding: .3cqw .8cqw; cursor: pointer; display: flex; gap: .8cqw; align-items: baseline;
}
.escolhas button:hover, .escolhas button:focus-visible { background: var(--vinho-claro); border-color: var(--borda); outline: none; }
.escolhas .num { font-family: var(--f-pixel); color: var(--papel-fraco); min-width: 1.2em; }
.badge { font-family: var(--f-pixel); font-size: .72em; padding: .1em .5em; white-space: nowrap; flex: none; }
.badge.cla { background: #4b2a6b; color: #e2cdf7; }
.badge.atrib { background: #1d3550; color: #bcd9f5; }
.badge.prova { background: #6a4a12; color: #f8dfa5; }
.badge.teste { background: #2e4a2c; color: #cdeec8; }
.badge.disc { background: #6b1622; color: #ffc9cf; }

/* Escolha de personagem */
.cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6cqw; }
.carta { text-align: left; font: inherit; color: var(--papel); background: var(--vinho); border: 1px solid var(--borda); padding: 1.4cqw; cursor: pointer; display: grid; gap: .4cqw; }
.carta:hover, .carta:focus-visible { border-color: var(--ambar); outline: none; }
.carta b { font-family: var(--f-pixel); font-size: max(16px, 2.2cqw); color: var(--ambar); font-weight: 600; }
.carta span { font-size: max(13px, 1.6cqw); color: var(--papel-fraco); }
.carta small { font-family: var(--f-pixel); font-size: max(11px, 1.3cqw); color: var(--papel); }
.titulo { font-family: var(--f-pixel); font-size: max(13px, 1.6cqw); color: var(--papel-fraco); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 1.2cqw; }

/* Dados */
.dados { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 5; background: rgb(18 10 14 / .95); border: 2px solid var(--borda);
  padding: 1.6cqw 2cqw; display: grid; gap: 1cqw; justify-items: center; font-family: var(--f-pixel); min-width: 38%; }
.dados .linha { display: flex; gap: .8cqw; flex-wrap: wrap; justify-content: center; }
.dado { width: max(28px, 4.2cqw); aspect-ratio: 1; display: grid; place-items: center; font-size: max(14px, 2cqw); border: 2px solid var(--papel); color: var(--papel); }
.dado.fomed { border-color: var(--sangue); color: #ffb3bb; background: rgb(200 49 63 / .15); }
.dado.ok { background: var(--papel); color: #1d0e08; }
.dado.fomed.ok { background: var(--sangue); color: #fff; }
.dados .res { font-size: max(15px, 2.2cqw); color: var(--ambar); }
.dados .det { font-size: max(11px, 1.3cqw); color: var(--papel-fraco); }

/* Toast e caderno */
.toast { position: absolute; top: 2.5cqw; right: 2.5cqw; z-index: 6; background: #6a4a12; color: #f8dfa5; font-family: var(--f-pixel); font-size: max(12px, 1.5cqw);
  padding: .6cqw 1.2cqw; max-width: 40%; opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
.caderno { position: absolute; inset: 0; z-index: 7; background: rgb(12 6 9 / .9); display: grid; place-items: center; }
.caderno .folha { width: min(88%, 720px); max-height: 86%; overflow: auto; background: #e9dcc4; color: #2a1810; padding: 2.4cqw 2.8cqw; border: 2px solid #8b6a44; }
.caderno h2 { font-family: var(--f-pixel); font-weight: 600; font-size: max(16px, 2.2cqw); margin: 0 0 1cqw; }
.caderno ol { margin: 0; padding-left: 1.4em; display: grid; gap: .6cqw; font-size: max(14px, 1.8cqw); line-height: 1.4; }
.caderno .vazio { font-style: italic; color: #6d5440; }
.caderno .fechar { margin-top: 1.6cqw; font-family: var(--f-pixel); background: #2a1810; color: #e9dcc4; border: 0; padding: .6cqw 1.4cqw; cursor: pointer; font-size: max(13px, 1.5cqw); }

.rodape { margin-top: 10px; font-family: var(--f-pixel); font-size: 12px; color: var(--papel-fraco); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rodape button { font: inherit; color: var(--papel-fraco); background: none; border: 1px solid var(--borda); padding: 2px 8px; cursor: pointer; }

@media (max-width: 640px) {
  .dialogo { position: relative; left: auto; right: auto; bottom: auto; margin-top: 18px; min-height: 9em; padding: 18px 16px 16px; }
  .nome { left: 12px; }
  .cartas { grid-template-columns: 1fr; }
  .hud { gap: 6px; }
  .dados { top: 50%; }
  .hud .bloco, .caderno-btn { padding: 4px 6px; }
  .hud .barra { width: 56px; }
  .toast { top: auto; bottom: 8px; right: 8px; max-width: 70%; }
}
@media (prefers-reduced-motion: reduce) { .rayo, .capacete, .toast { transition: none; } .seta { animation: none; } }
</style>

<script>// Regras de dados de Vampiro V5, usadas pelo jogo web e pelos testes.
// Resultado: 0 falha, 1 sucesso, 2 crítico, 3 crítico bagunçado, 4 falha bestial
(function (root) {
  function rolarV5(parada, fome, dificuldade, rng) {
    rng = rng || Math.random;
    const d10 = () => 1 + Math.floor(rng() * 10);
    const nFome = Math.min(fome, parada);
    const dados = [];
    for (let i = 0; i < parada; i++) dados.push({ valor: d10(), fome: i < nFome });
    let sucessos = dados.filter(d => d.valor >= 6).length;
    const dezes = dados.filter(d => d.valor === 10);
    const pares = Math.floor(dezes.length / 2);
    sucessos += pares * 2; // cada par de 10 vale 4 sucessos no total
    const passou = sucessos >= dificuldade;
    let resultado;
    if (passou && pares > 0 && dezes.some(d => d.fome)) resultado = 3;
    else if (passou && pares > 0) resultado = 2;
    else if (passou) resultado = 1;
    else if (dados.some(d => d.fome && d.valor === 1)) resultado = 4;
    else resultado = 0;
    return { resultado, sucessos, dados, dificuldade };
  }
  function despertarV5(rng) { return 1 + Math.floor((rng || Math.random)() * 10) >= 6; }
  root.V5 = { rolarV5, despertarV5 };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

function tipoBadge(g) {
  if (/^(Gangrel|Ventrue|Nosferatu|Brujah|Toreador|Tremere|Malkaviano|Lasombra)/.test(g)) return 'cla';
  if (/^Prova/.test(g)) return 'prova';
  if (/^Teste/.test(g)) return 'teste';
  if (/^Disciplina/.test(g)) return 'disc';
  return 'atrib';
}

  fila = []; pistas = [];
  story.BindExternalFunction('rolar', (parada, fome, dif) => {
    const r = V5.rolarV5(parada, fome, dif); fila.push({ tipo: 'dados', r }); return r.resultado;
  }, false);
  story.BindExternalFunction('despertar', () => {
    const ok = V5.despertarV5();
    if (!ok) story.variablesState['fome'] = Math.min(5, story.variablesState['fome'] + 1);
    fila.push({ tipo: 'despertar', ok });
  }, false);
  $('rayo').classList.remove('on'); $('capacete').classList.remove('on');
  atualizarHud();
  avancar();
}

function atualizarHud() {
  const v = story.variablesState, min = v['minutos'], h = (23 + Math.floor(min / 60)) % 24, m = min % 60;
  $('hora').textContent = `${String(h).padStart(2, '0')}h${String(m).padStart(2, '0')}`;
  $('barra').style.width = Math.max(0, Math.min(100, 100 * (v['limite'] - min) / 100)) + '%';
  $('fome').innerHTML = [1, 2, 3, 4, 5].map(i => `<i class="${i <= v['fome'] ? 'cheio' : ''}"></i>`).join('');
  $('n-pistas').textContent = pistas.length;
}

function toast(txt) { const t = $('toast'); t.textContent = txt; t.classList.add('on'); clearTimeout(fimTimer); fimTimer = setTimeout(() => t.classList.remove('on'), 2600); }

// Puxa a próxima linha do roteiro e trata efeitos (dados, tags) antes de mostrar.
function avancar() {
  if (fila.length) return mostrarEvento(fila.shift());
  if (story.canContinue) {
    const texto = story.Continue().trim();
    for (const tag of story.currentTags) {
      const [k, ...resto] = tag.split(':'); const val = resto.join(':').trim();
      if (k.trim() === 'entra' && val === 'rayo') { $('rayo').classList.add('on'); $('capacete').classList.add('on'); }
      if (k.trim() === 'pista') { pistas.push(val); toast('Nova pista no caderno'); }
    }
    atualizarHud();
    if (fila.length) { fila.push({ tipo: 'linha', texto }); return avancar(); }
    if (!texto) return avancar();
    return mostrarLinha(texto);
  }
  if (story.currentChoices.length) return mostrarEscolhas();
  mostrarFim();
}

function mostrarEvento(ev) {
  if (ev.tipo === 'linha') return ev.texto ? mostrarLinha(ev.texto) : avancar();
  if (ev.tipo === 'dados') return mostrarDados(ev.r);
  if (ev.tipo === 'despertar') { atualizarHud(); toast(ev.ok ? 'Teste de Despertar: a Fome se manteve' : 'Teste de Despertar: a Fome subiu'); return avancar(); }
}

function mostrarDados(r) {
  const el = document.createElement('div'); el.className = 'dados'; el.setAttribute('role', 'dialog');
  el.innerHTML = `<div class="det">Parada de ${r.dados.length} dados · dificuldade ${r.dificuldade}</div>
    <div class="linha">${r.dados.map(d => `<span class="dado ${d.fome ? 'fomed' : ''} ${d.valor >= 6 ? 'ok' : ''}">${d.valor}</span>`).join('')}</div>
    <div class="res">${RESULTADOS[r.resultado]} · ${r.sucessos} sucesso${r.sucessos === 1 ? '' : 's'}</div>
    <div class="det">Dados vermelhos são de Fome. Clique para continuar.</div>`;
  $('palco').appendChild(el);
  const fechar = () => { el.remove(); document.removeEventListener('keydown', tecla); avancar(); };
  const tecla = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); fechar(); } };
  el.addEventListener('click', fechar); setTimeout(() => document.addEventListener('keydown', tecla), 50);
}

function mostrarLinha(texto) {
  const v = story.variablesState; let nome = null, corpo = texto, classe = 'narracao', passiva = null;
  const m = texto.match(/^([A-Za-zÀ-ú]+): (.*)$/);
  if (m && FALANTES.includes(m[1])) { nome = m[1] === 'Você' ? v['nome'] : m[1]; corpo = m[2]; classe = m[1] === 'Você' ? 'voce' : ''; }
  const p = texto.match(/^(.+?) :: (.*)$/);
  if (!nome && p) { passiva = p[1]; corpo = p[2]; }
  if (/^FIM DA CENA/.test(texto)) return avancar();
  $('nome').hidden = !nome; if (nome) $('nome').textContent = nome;
  const c = $('conteudo');
  c.innerHTML = `<div class="fala ${classe}">${passiva ? `<span class="passiva">${esc(passiva)}</span>` : ''}<span id="txt"></span></div><span class="seta" aria-hidden="true">▼</span>`;
  if (!window.__primeiroTexto) window.__primeiroTexto = performance.now();
  digitar(corpo);
}

function digitar(t) {
  const alvo = $('txt'); alvoTexto = t; let i = 0; clearInterval(digitando);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { alvo.textContent = t; return; }
  digitando = setInterval(() => { i += 2; alvo.textContent = t.slice(0, i); if (i >= t.length) clearInterval(digitando); }, 16);
}

function clicarDialogo() {
  if (story.currentChoices.length && !story.canContinue && !fila.length && !$('txt')) return;
  const alvo = $('txt'); if (!alvo) return;
  if (alvo.textContent.length < alvoTexto.length) { clearInterval(digitando); alvo.textContent = alvoTexto; return; }
  avancar();
}

function mostrarEscolhas() {
  $('nome').hidden = true; const c = $('conteudo');
  if (story.variablesState['nome'] === '') {
    const fichas = ['Carisma 2 · Raciocínio 3 · Manipulação 2 · Animalismo', 'Carisma 3 · Raciocínio 2 · Manipulação 3 · Dominação'];
    c.innerHTML = `<div class="titulo">${esc(story.currentText.trim() || 'Quem vai interrogar o Rayo?')}</div><div class="cartas">${story.currentChoices.map((ch, i) => {
      const [nome, ...desc] = ch.text.split('. ');
      return `<button class="carta" data-i="${i}" type="button"><b>${esc(nome)}</b><span>${esc(desc.join('. '))}</span><small>${fichas[i] || ''}</small></button>`; }).join('')}</div>`;
  } else {
    c.innerHTML = `<ul class="escolhas">${story.currentChoices.map((ch, i) => {
      const p = ch.text.match(/^(.+?) :: (.*)$/);
      const badge = p ? `<span class="badge ${tipoBadge(p[1])}">${esc(p[1])}</span>` : '';
      return `<li><button data-i="${i}" type="button"><span class="num">${i + 1}</span>${badge}<span>${esc(p ? p[2] : ch.text)}</span></button></li>`; }).join('')}</ul>`;
  }
  c.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); escolher(+b.dataset.i); }));
  const primeiro = c.querySelector('[data-i]'); if (primeiro) primeiro.focus({ preventScroll: true });
}

function escolher(i) { story.ChooseChoiceIndex(i); atualizarHud(); avancar(); }

function mostrarFim() {
  $('nome').hidden = true;
  $('conteudo').innerHTML = `<div class="titulo">Fim da cena de teste</div><div class="fala">Você saiu com ${pistas.length} pista${pistas.length === 1 ? '' : 's'}${story.variablesState['confessou'] ? ', incluindo o selo queimado' : ''}.</div>
    <ul class="escolhas"><li><button type="button" data-a="caderno"><span class="num">1</span><span>Ver o caderno</span></button></li><li><button type="button" data-a="de-novo"><span class="num">2</span><span>Jogar de novo com outro personagem</span></button></li></ul>`;
  $('conteudo').querySelector('[data-a=caderno]').addEventListener('click', e => { e.stopPropagation(); abrirCaderno(); });
  $('conteudo').querySelector('[data-a=de-novo]').addEventListener('click', e => { e.stopPropagation(); iniciar(); });
}

function abrirCaderno() {
  const el = document.createElement('div'); el.className = 'caderno';
  el.innerHTML = `<div class="folha"><h2>Caderno do interrogatório</h2>${pistas.length ? `<ol>${pistas.map(p => `<li>${esc(p)}</li>`).join('')}</ol>` : '<p class="vazio">Nenhuma pista ainda.</p>'}<button class="fechar" type="button">Fechar</button></div>`;
  $('palco').appendChild(el);
  const fechar = () => el.remove();
  el.querySelector('.fechar').addEventListener('click', fechar); el.addEventListener('click', e => { if (e.target === el) fechar(); });
  el.querySelector('.fechar').focus();
}

$('dialogo').addEventListener('click', clicarDialogo);
$('abrir-caderno').addEventListener('click', abrirCaderno);
$('reiniciar').addEventListener('click', iniciar);
document.addEventListener('keydown', e => {
  if (document.querySelector('.dados, .caderno')) { if (e.key === 'Escape') document.querySelector('.caderno')?.remove(); return; }
  if (e.key === ' ' || e.key === 'Enter') { if ($('txt')) { e.preventDefault(); clicarDialogo(); } }
  const n = parseInt(e.key, 10); const b = document.querySelector(`#conteudo [data-i="${n - 1}"]`);
  if (b && !$('txt')) b.click();
});
iniciar();
</script>
