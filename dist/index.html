<!doctype html>
<html lang="pt-BR" translate="no">
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>O Matusalém Desaparecido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Spectral:ital,wght@0,400;0,600;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: palco 16:9 com fundo realista e personagens recortados; hora, Fome e caderno pequenos dentro da caixa de texto.
   Dois temas para comparar: "livro" (identidade dos livros de V5) e "revista" (recorte de revista rasgada). */
:root {
  --noite: #120a0e;        /* fundo da página */
  --vinho: #2a1219;        /* painéis */
  --vinho-claro: #3d1b24;
  --papel: #efe3d2;        /* texto principal */
  --papel-fraco: #b9a594;
  --ambar: #e0a54a;        /* destaque quente da luminária */
  --sangue: #c8313f;       /* Fome */
  --borda: #5a2c35;
  --f-tipo: "Special Elite", "Courier New", monospace;  /* máquina de escrever */
  --tinta: #2a1d16;        /* texto sobre papel */
  --folha: #e9dfc9;        /* papel do diálogo */
  --f-texto: "Spectral", Georgia, "Times New Roman", serif;
  --f-nome: var(--f-tipo);  /* nomes e títulos */
  --acento: #8f1d26;       /* vermelho de destaque */
  --tinta-fraca: #6b5646;
  color-scheme: dark;
}
/* Tema livro: como as páginas de V5 (Galápagos): papel quase branco, títulos em Bodoni, texto em Garamond, vinho escuro */
:root[data-tema="livro"] {
  --folha: #f5f2eb; --tinta: #1d1716; --tinta-fraca: #6e6260; --acento: #7b1c1c;
  --f-nome: "Bodoni Moda", "Didot", Georgia, serif;
  --f-texto: "Cormorant Garamond", "EB Garamond", Garamond, Georgia, serif;
  --f-tipo: "Bodoni Moda", "Didot", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--noite); color: var(--papel); font-family: var(--f-texto);
  display: grid; place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.jogo { width: min(100%, calc((100vh - 32px) * 16 / 9), 1280px); position: relative; container-type: inline-size; }
.palco {
  position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
  background: #1a0d12;
  container-type: inline-size;
}
.palco img { position: absolute; user-select: none; -webkit-user-drag: none; }
.fundo { inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* retícula de jornal e vinheta por cima do fundo */
.reticula { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle, rgb(0 0 0 / .35) 28%, transparent 30%) 0 0 / .55cqw .55cqw,
              radial-gradient(ellipse at 60% 40%, transparent 40%, rgb(10 4 8 / .75) 100%); mix-blend-mode: multiply; }
/* Personagens: recortes "colados" na cena, um de cada lado. Rayo à direita, os outros à esquerda.
   Quem não está falando escurece; trocar de expressão troca só a imagem. */
.lado { position: absolute; bottom: -3%; height: calc(98% * var(--esc, 1)); margin: 0; opacity: 0; --giro: 1.5deg; transform: rotate(var(--giro)) translateY(4%);
  transition: opacity .5s, transform .5s, filter .3s; filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .65)); }
.lado.esq { left: 4%; }
.lado.dir { right: 4%; --giro: -1.5deg; }
/* escala por personagem, para os rostos ficarem do mesmo tamanho (a arte do Vincenzo é um close) */
.lado[data-p="Vincenzo"] { height: calc(90% * var(--esc, 1)); bottom: 4%; }
.lado.on { opacity: 1; transform: rotate(var(--giro)); }
.lado.calado { filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .65)) brightness(.5) saturate(.6); }
.palco .lado img { position: static; display: block; height: 100%; width: auto; }
/* nome embaixo do rosto, como legenda de revista */
.legenda { position: absolute; left: var(--leg-x, 50%); bottom: 36%; transform: translateX(-50%) rotate(calc(var(--giro) * -1.4)); white-space: nowrap;
  font-family: var(--f-nome); font-size: max(12px, 1.7cqw); background: var(--acento); color: #f4e7d2; padding: .2cqw 1.1cqw; box-shadow: .1cqw .3cqw .5cqw rgb(0 0 0 / .5); }
.lado.calado .legenda { background: #3a2a26; color: #c9b998; }
.moldura { inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.lado.troca { animation: troca .25s; }
@keyframes troca { 40% { transform: rotate(calc(var(--giro) * 1.5)) translateY(-1%); } 100% { transform: rotate(var(--giro)); } }

/* Hora, Fome e caderno: pequenos, no canto da caixa de texto, longe dos rostos */
.hud { position: absolute; top: .7cqw; right: 1.6cqw; display: flex; gap: 1.3cqw; align-items: center; z-index: 1;
  font-family: var(--f-tipo); font-size: max(12px, 1.3cqw); color: var(--tinta); letter-spacing: .04em; }
.hud .amanhecer { color: var(--tinta-fraca); font-size: .85em; }
/* quando a Fome ou o caderno mudam, o número dá um pulo para chamar o olho */
.hud .pulso { animation: pulso .9s ease-out; }
@keyframes pulso { 30% { transform: scale(1.35); filter: drop-shadow(0 0 .4cqw rgb(200 49 63 / .8)); } }
.hud .hora { color: var(--acento); font-variant-numeric: tabular-nums; }
/* Tempo acabando: na última hora e meia a hora pulsa, e a luz do amanhecer vai entrando pela cena */
.hud .hora.urgente { font-weight: 700; animation: urgente 1.2s ease-in-out infinite; }
@keyframes urgente { 50% { color: #d8452f; text-shadow: 0 0 6px rgb(216 69 47 / .5); } }
.sol { position: absolute; inset: 0; pointer-events: none; opacity: var(--sol, 0); transition: opacity 1.5s;
  background: linear-gradient(180deg, rgb(255 175 95 / .8), rgb(255 130 70 / .25) 45%, transparent 80%); mix-blend-mode: screen; }
@media (prefers-reduced-motion: reduce) { .hud .hora.urgente { animation: none; color: #d8452f; } }
.hud .barra { height: 3px; background: color-mix(in srgb, var(--tinta-fraca) 30%, transparent); width: max(36px, 4.5cqw); }
.hud .barra i { display: block; height: 100%; background: var(--acento); transition: width .4s; }
.hud .grupo { display: flex; gap: .5cqw; align-items: center; }
.hud .grupo[hidden] { display: none; }
.hud .lugar { font-family: var(--f-tipo); color: var(--acento); border: 1px solid currentColor; padding: 0 .5em; font-size: .85em; }
.hud .lugar.fora { color: #8a6a1c; }
.fome { display: flex; gap: 2px; }
.fome { transform-origin: center; }
.fome i { width: max(9px, 1cqw); aspect-ratio: 1; border: 1.5px solid var(--sangue); }
.fome i.cheio { background: var(--sangue); }
.caderno-btn { font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid currentColor; padding: 0 .1em; cursor: pointer; }
.caderno-btn:hover, .caderno-btn:focus-visible { color: var(--acento); outline: none; }
.caderno-btn b { display: inline-block; color: var(--acento); font-weight: 600; }

/* Diálogo */
.dialogo {
  position: absolute; left: 3%; right: 3%; bottom: 3.5%; min-height: 25%;
  background: var(--folha); color: var(--tinta); border: 0; box-shadow: .3cqw .5cqw 1.2cqw rgb(0 0 0 / .55);
  padding: 2.6cqw 2.6cqw 2.2cqw; z-index: 4; cursor: pointer; transform: rotate(.3deg); font-family: var(--f-texto);
}
.nome { position: absolute; top: 0; left: 2.4cqw; transform: translateY(-60%); font-family: var(--f-nome); font-weight: 600;
  background: var(--acento); color: #f4e7d2; padding: .25cqw 1.2cqw; font-size: max(13px, 1.7cqw); letter-spacing: .04em; }
.nome[hidden] { display: none; }
.fala.extra { margin-top: .4em; min-height: 0; }
.fala:has(+ .fala.extra) { min-height: 0; }
.fala { font-size: max(15px, 2.05cqw); line-height: 1.45; max-width: 70ch; min-height: 2.9em; text-wrap: pretty; }
.fala.narracao { font-style: italic; color: var(--tinta-fraca); }
.fala.voce { color: #6a2a12; }
/* o seu rosto (o protagonista): uma foto presa no canto da caixa de texto, quando você fala ou reage */
.eu { position: absolute; left: 1cqw; bottom: .6cqw; height: 25cqw; margin: 0; transform: rotate(-2deg); pointer-events: none; z-index: 5;
  filter: drop-shadow(.3cqw .7cqw .8cqw rgb(0 0 0 / .55)); transform-origin: 30% 100%; }
.eu[hidden] { display: none; }
.eu img { height: 100%; width: auto; max-width: 24cqw; object-fit: contain; object-position: 0 100%; display: block; }
.eu.troca { animation: troca .25s; }
/* quando o seu rosto aparece (depois de sumir), ele "pula" para a frente, para ficar claro que é você */
.eu.chega { animation: eu-chega .45s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes eu-chega { from { opacity: 0; transform: rotate(-6deg) translateY(10%) scale(.85); } }
.eu figcaption { position: absolute; left: 50%; top: 4%; transform: translateX(-50%) rotate(4deg); font-family: var(--f-tipo); font-size: max(10px, 1.15cqw); letter-spacing: .14em;
  background: #f4e7d2; color: var(--acento); border: 2px solid var(--acento); padding: .3em .55em .1em; line-height: 1.2; box-shadow: .1cqw .2cqw .4cqw rgb(0 0 0 / .45); }
@media (prefers-reduced-motion: reduce) { .eu.chega { animation: none; } }
/* celular deitado: a caixa é baixa, o retrato não pode cobrir o palco inteiro */
@media (max-height: 500px) and (min-aspect-ratio: 1/1) { .eu { height: 20cqw; } .eu img { max-width: 19cqw; } }
.dialogo.com-eu { padding-left: calc(2.6cqw + var(--eu-larg, 13cqw)); }
.dialogo.com-eu .nome { left: calc(1.4cqw + var(--eu-larg, 13cqw)); }
.seta { position: absolute; right: 1.6cqw; bottom: 1.2cqw; font-family: var(--f-tipo); color: var(--acento); font-size: max(12px, 1.5cqw); animation: pisca 1s steps(2) infinite; }
@keyframes pisca { 50% { opacity: 0; } }
.passiva { display: inline-block; font-family: var(--f-tipo); font-style: normal; font-size: .72em; padding: .05em .5em; margin-right: .5em;
  background: #1d3550; color: #bcd9f5; vertical-align: .12em; }

.escolhas { display: grid; gap: .15cqw; margin: 0; padding: 0; list-style: none; }
.escolhas button {
  width: 100%; text-align: left; font: inherit; font-size: max(14px, 1.6cqw); line-height: 1.3; color: var(--tinta);
  background: transparent; border: 1px solid transparent; padding: .3cqw .8cqw; cursor: pointer; display: flex; gap: .8cqw; align-items: baseline;
}
.escolhas button:hover, .escolhas button:focus-visible { background: color-mix(in srgb, var(--acento) 12%, var(--folha)); border-color: color-mix(in srgb, var(--acento) 35%, var(--folha)); outline: none; }
.escolhas.travada, .cartas.travada { pointer-events: none; opacity: .55; }
.escolhas, .cartas { transition: opacity .25s; }
.escolhas button.sem-volta { color: #8e1c14; font-weight: 600; }
.escolhas button.sem-volta::before { content: "⚠"; order: 2; margin-left: .3em; }
/* opção que pede um segundo toque: fica marcada e avisa */
.escolhas button.armada { background: color-mix(in srgb, var(--acento) 16%, var(--folha)); border-color: var(--acento); flex-wrap: wrap; }
.escolhas button[data-conf].armada::after { content: "Toque de novo para confirmar"; flex-basis: 100%; padding-left: 1.9em; font-family: var(--f-tipo); font-size: .72em; color: var(--acento); font-weight: bold; text-align: left; }
/* menu comprido (as provas na Corte): duas colunas no computador; no celular, uma coluna com rolagem */
.escolhas.muitas { grid-template-columns: 1fr 1fr; column-gap: 1.2cqw; }
/* no computador, quanto mais provas, menor a letra, para caber tudo sem cobrir a arte */
@media (min-aspect-ratio: 1/1) and (min-height: 521px) {
  .escolhas.muitas.n9 button { font-size: max(13px, 1.45cqw); }
  .escolhas.muitas.n11 button { font-size: max(12px, 1.3cqw); line-height: 1.22; }
}
/* barrinha de rolagem desenhada (o celular esconde a do navegador): aparece quando tem mais coisa para baixo */
.rolagem { position: absolute; right: 4px; width: 5px; border-radius: 3px; background: color-mix(in srgb, var(--tinta) 12%, transparent); pointer-events: none; z-index: 3; }
.rolagem[hidden] { display: none; }
.rolagem i { position: absolute; left: 0; right: 0; border-radius: 3px; background: var(--acento); opacity: .85; }
.rolagem.mais::after { content: "▼"; position: absolute; left: 50%; bottom: -1.1em; translate: -50% 0; font-size: 10px; color: var(--acento); animation: pisca 1s steps(2) infinite; }
.escolhas .num { font-family: var(--f-tipo); color: #8a7462; min-width: 1.2em; }
/* pergunta que você já fez: continua ali (e continua custando tempo), mas apagada */
.escolhas button.feita { color: #8d7c6c; }
.quem-e-quem p { display: flex; gap: .6em; align-items: center; margin: .35em 0; }
.quem-e-quem img { width: 3.2em; height: 3.2em; object-fit: cover; object-position: top; border-radius: 50%; background: #2a1219; flex: none; }
.em-breve { font-family: var(--f-tipo); color: var(--acento); letter-spacing: .12em; text-transform: uppercase; margin: 0 0 .6em; }
.escolhas .custo { font-family: var(--f-tipo); font-size: .78em; color: #5d4a3a; white-space: nowrap; }
.escolhas .custo::before { content: "⏱ "; }
.escolhas .custo.passa { color: var(--vermelho, #a01c28); font-weight: bold; white-space: normal; }
.escolhas button.feita .porque { opacity: .6; }
.escolhas button.feita::after { content: "já perguntou"; margin-left: auto; padding-left: 1em; font-family: var(--f-tipo); font-size: .7em; color: #9c8b7a; white-space: nowrap; }
/* O porquê da opção vem depois dela, no mesmo texto, entre parênteses e na cor do tipo. */
.porque { font-family: var(--f-tipo); font-size: .78em; }
.porque.cla { color: #5d2f86; }
.porque.atrib { color: #24507a; }
.porque.prova { color: #85590c; }
.porque.teste { color: #2f6a2b; }
.porque.disc { color: #8e1b2b; }

/* Escolha de personagem */
.cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6cqw; }
.carta { text-align: left; font: inherit; color: var(--tinta); background: #f3ebd9; border: 1px solid #c9b998; padding: 1.4cqw; cursor: pointer; display: grid; gap: .4cqw; }
.carta:hover, .carta:focus-visible { border-color: var(--acento); outline: none; }
.carta b { font-family: var(--f-nome); font-size: max(16px, 2.2cqw); color: var(--acento); font-weight: 600; }
.carta span { font-size: max(13px, 1.6cqw); color: var(--tinta-fraca); }
.carta small { font-family: var(--f-tipo); font-size: max(11px, 1.3cqw); color: var(--tinta); }
.titulo { font-family: var(--f-nome); font-size: max(13px, 1.6cqw); color: var(--tinta-fraca); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 1.2cqw; }

/* Dados: mesa escura por cima do jogo inteiro, dados de dez faces caem, giram e param no valor */
.mesa-dados { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; cursor: pointer;
  background: radial-gradient(ellipse at 50% 45%, rgb(18 10 14 / .55), rgb(18 10 14 / .88)); animation: mesa-entra .25s ease-out; }
@keyframes mesa-entra { from { opacity: 0; } }
.dados { background: var(--folha); color: var(--tinta); box-shadow: .3cqw .6cqw 1.4cqw rgb(0 0 0 / .6); transform: rotate(-.6deg);
  padding: 1.8cqw 2.4cqw 1.4cqw; display: grid; gap: 1.1cqw; justify-items: center; font-family: var(--f-tipo); min-width: 44%; max-width: 86%; }
.dados .linha { display: flex; gap: 1cqw; flex-wrap: wrap; justify-content: center; padding: .6cqw 0; }
.dado { width: max(34px, 5cqw); aspect-ratio: .86; position: relative; filter: drop-shadow(0 .35cqw .3cqw rgb(0 0 0 / .45));
  animation: dado-cai .9s cubic-bezier(.2, .7, .3, 1) both; animation-delay: var(--atraso, 0s); transition: translate .25s, opacity .25s, filter .25s; }
#conteudo:focus { outline: none; }
.dado .face { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 12%;
  clip-path: polygon(50% 0, 100% 42%, 50% 100%, 0 42%);
  background: linear-gradient(160deg, #f6eedc 0 48%, #d9cbab 52% 100%); color: var(--tinta); font-size: max(14px, 2.1cqw); }
.dado .face::before { content: ""; position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 42%, 50% 64%, 0 42%); background: rgb(255 255 255 / .28); }
.dado.fomed .face { background: linear-gradient(160deg, #c8313f 0 48%, #8a1622 52% 100%); color: #fbe9e6; }
.dado.rolando .face { animation: dado-gira .18s linear infinite; }
.dado.parou.ok { translate: 0 -.5cqw; filter: drop-shadow(0 0 .5cqw rgb(224 165 74 / .95)) drop-shadow(0 .5cqw .3cqw rgb(0 0 0 / .4)); }
.dado.parou.ok .face { font-weight: 700; }
.dado.parou.dez { filter: drop-shadow(0 0 .9cqw rgb(255 196 90 / 1)) drop-shadow(0 .5cqw .3cqw rgb(0 0 0 / .4)); }
.dado.parou:not(.ok) { opacity: .55; }
.dado.parou.bestial { opacity: 1; filter: drop-shadow(0 0 .7cqw rgb(200 49 63 / .9)); }
@keyframes dado-cai {
  0% { transform: translate(var(--dx, 0), -260%) rotate(var(--giro0, -200deg)); opacity: 0; }
  15% { opacity: 1; }
  60% { transform: translate(0, 8%) rotate(14deg); }
  78% { transform: translate(0, -14%) rotate(-6deg); }
  100% { transform: none; }
}
@keyframes dado-gira { 50% { transform: scaleX(.55) skewY(8deg); } }
.dados .res { font-size: max(16px, 2.5cqw); color: var(--acento); border: 2px solid currentColor; padding: .1em .7em; margin: .3cqw 0 .8cqw; opacity: 0; transform: rotate(-4deg) scale(1.8); }
.dados .res.on { animation: carimbo .35s cubic-bezier(.3, 1.6, .5, 1) forwards; }
.dados .res.bom { color: #2f6a2b; }
@keyframes carimbo { to { opacity: 1; transform: rotate(-4deg) scale(1); } }
.dados .det { font-size: max(11px, 1.3cqw); color: var(--tinta-fraca); text-align: center; }
.dados .seguir { font-family: var(--f-tipo); font-size: max(13px, 1.5cqw); background: var(--acento); color: #f4e7d2; border: 0; padding: .4cqw 1.6cqw; cursor: pointer; visibility: hidden; }
.dados .seguir.on { visibility: visible; }
@media (prefers-reduced-motion: reduce) { .mesa-dados, .dado, .dado.rolando .face { animation: none; } .dados .res.on { animation: none; opacity: 1; transform: rotate(-4deg); } }

/* Toast e caderno */
.toast { position: absolute; top: 0; left: 50%; translate: -50% -115%; z-index: 6; background: var(--acento); color: #f4e7d2; font-family: var(--f-tipo); font-size: max(11px, 1.2cqw);
  padding: .4cqw 1cqw; max-width: 40%; opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
.caderno { position: absolute; inset: 0; z-index: 7; background: rgb(12 6 9 / .9); display: grid; place-items: center; }
.caderno .bloco-folhas { width: min(88%, 720px); max-height: 88%; display: grid; grid-template-rows: auto 1fr; }
.caderno .abas { display: flex; gap: .4cqw; padding-left: 1.6cqw; }
.caderno .aba { font-family: var(--f-tipo); font-size: max(12px, 1.45cqw); border: 0; cursor: pointer; padding: .5cqw 1.3cqw .4cqw; background: #c9b998; color: #4a3828; }
.caderno .aba[aria-selected="true"] { background: var(--folha); color: var(--acento); }
.caderno .aba:focus-visible { outline: 2px solid #8f1d26; }
.caderno .folha { overflow: auto; background: var(--folha); color: var(--tinta); font-family: var(--f-texto); padding: 2.4cqw 2.8cqw; box-shadow: .3cqw .6cqw 1.4cqw rgb(0 0 0 / .6); }
.caderno textarea { width: 100%; min-height: 12em; resize: vertical; font-family: var(--f-tipo); font-size: max(14px, 1.7cqw); line-height: 1.6; color: #2a1810;
  border: 0; padding: 0 .6em; background: repeating-linear-gradient(#e9dcc4 0 calc(1.6em - 1px), #c9b5a0 calc(1.6em - 1px) 1.6em) local; }
.caderno textarea:focus { outline: 2px solid #8f1d26; }
.caderno h2 { font-family: var(--f-nome); font-weight: 600; font-size: max(16px, 2.2cqw); margin: 0 0 1cqw; }
.caderno ol { margin: 0; padding-left: 1.4em; display: grid; gap: .6cqw; font-size: max(14px, 1.8cqw); line-height: 1.4; }
.caderno h3 { font-family: var(--f-nome); font-weight: 600; font-size: max(15px, 1.9cqw); margin: 1.4cqw 0 .5cqw; color: var(--acento); }
.caderno h3 small, .caderno li small.de { font-family: var(--f-tipo); font-weight: 400; font-size: .7em; color: #8a7462; }
.caderno .vazio { font-style: italic; color: #6d5440; }
.caderno .fechar { margin-top: 1.6cqw; font-family: var(--f-tipo); background: #2a1810; color: #e9dcc4; border: 0; padding: .6cqw 1.4cqw; cursor: pointer; font-size: max(13px, 1.5cqw); }

.rodape { margin-top: 10px; font-family: var(--f-tipo); font-size: 12px; color: var(--papel-fraco); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rodape button { font: inherit; color: var(--papel-fraco); background: none; border: 1px solid var(--borda); padding: 2px 8px; cursor: pointer; }
.rodape .acoes { display: flex; align-items: center; gap: 10px; }
.rodape .som { display: flex; align-items: center; gap: 6px; }
.rodape #historico { color: var(--papel); border-color: var(--sangue); font-weight: 700; }
.rodape #historico::before { content: "\2630\00a0"; }
.rodape #historico.chamar { animation: chamar-hist 1.4s ease-in-out infinite; }
@keyframes chamar-hist { 0%, 100% { box-shadow: 0 0 0 0 rgb(200 49 63 / 0); } 50% { box-shadow: 0 0 0 4px rgb(200 49 63 / .65); } }
@media (prefers-reduced-motion: reduce) { .rodape #historico.chamar { animation: none; box-shadow: 0 0 0 3px rgb(200 49 63 / .65); } }
.dados .conta { font-size: max(13px, 1.7cqw); color: var(--tinta); text-align: center; }
.dados .conta b { font-weight: 400; color: var(--acento); }
.rodape button[aria-pressed="true"].opcao { color: var(--papel); border-color: var(--sangue); }
.historico p { margin: 0 0 .5cqw; }
.historico b { font-family: var(--f-tipo); font-weight: 400; color: var(--acento); }
.historico .narr { font-style: italic; color: #6d5440; }
.rodape .som button[aria-pressed="false"] { text-decoration: line-through; opacity: .7; }
.rodape input[type=range] { width: 90px; accent-color: #c8313f; }

/* Tema revista: caixa de texto em papel rasgado, legenda presa com fita */
:root[data-tema="revista"] .dialogo { background: none; box-shadow: none; filter: drop-shadow(.3cqw .5cqw .8cqw rgb(0 0 0 / .55)); }
:root[data-tema="revista"] .dialogo::before { content: ""; position: absolute; inset: -.8cqw -.6cqw; z-index: -1; background: var(--folha);
  -webkit-mask: var(--rasgo) 0 0 / 100% 100%; mask: var(--rasgo) 0 0 / 100% 100%; }
:root[data-tema="revista"] .legenda::before { content: ""; position: absolute; left: 50%; top: -.7cqw; width: 3.4cqw; height: 1.2cqw; translate: -50% 0; rotate: -4deg;
  background: rgb(236 228 206 / .7); box-shadow: 0 0 .2cqw rgb(0 0 0 / .2); }

/* Tema livro: página limpa, sem moldura de pôster; nomes em Bodoni maiúsculo, espaçado */
:root[data-tema="livro"] .moldura { display: none; }
:root[data-tema="livro"] .reticula { opacity: .35; }
:root[data-tema="livro"] .palco { border: 1.1cqw solid var(--folha); box-shadow: inset 0 0 0 1px var(--acento); }
:root[data-tema="livro"] .dialogo { transform: none; box-shadow: 0 .3cqw 1.4cqw rgb(0 0 0 / .45); border-top: 2px solid var(--acento); }
:root[data-tema="livro"] .fala { font-size: max(16px, 2.25cqw); line-height: 1.4; }
:root[data-tema="livro"] .nome, :root[data-tema="livro"] .legenda { text-transform: uppercase; letter-spacing: .18em; font-weight: 400; }
:root[data-tema="livro"] .legenda { background: var(--folha); color: var(--acento); transform: translateX(-50%); padding: .35cqw 1.4cqw; font-size: max(11px, 1.45cqw);
  border-top: 1px solid var(--acento); border-bottom: 1px solid var(--acento); box-shadow: 0 .2cqw .6cqw rgb(0 0 0 / .4); }
:root[data-tema="livro"] .lado.calado .legenda { background: #d9d3c8; color: #6e6260; }
:root[data-tema="livro"] .lado { --giro: 0deg; }
:root[data-tema="livro"] .titulo { letter-spacing: .2em; }
:root[data-tema="livro"] .carta b { font-weight: 400; letter-spacing: .03em; }
:root[data-tema="livro"] .caderno h2 { font-weight: 400; letter-spacing: .06em; }
:root[data-tema="livro"] .caderno textarea { font-family: var(--f-texto); }

@media (prefers-reduced-motion: reduce) { .lado, .toast { transition: none; animation: none; } .seta { animation: none; } }

/* ---------- Primeira versão jogável: elenco, ilustrações, capa e abertura ---------- */
.fundo { transition: opacity .4s; }
/* o salão: a foto tem muito teto, e a caixa de texto cobre o chão; mostra as mesas e clareia um pouco */
.fundo[data-f="salao"] { transform: scale(1.5); transform-origin: 50% 100%; filter: brightness(1.3) saturate(1.05); }
.fundo.trocando { opacity: 0; }
/* escala por personagem, para os rostos ficarem de tamanho parecido */
.lado[data-p="Nonna"] { height: 74%; bottom: 10%; }
.lado[data-p="Dante"], .lado[data-p="Constance"] { height: 92%; bottom: 2%; }
.lado[data-p="Harumi"] { height: 84%; bottom: 4%; }
.lado[data-p="Isadora"], .lado[data-p="Valentina"] { height: 84%; bottom: 4%; }
.lado[data-p="Dr. Arnaldo"], .lado[data-p="Luciana"] { height: 90%; bottom: 2%; }
.sinal i { border-color: #b8860b; }
.sinal i.cheio { background: #e0a020; box-shadow: 0 0 .4em #e0a020; }
/* a caixa de texto cobre a parte de baixo da cena (e cresce com o texto): o nome da Harumi fica no peito, acima dela */
.lado[data-p="Harumi"] .legenda { bottom: 52%; }
/* o Biel é um fantasma: azul, flutuando, com brilho frio */
.lado[data-p="Biel"] img { animation: flutua 4.5s ease-in-out infinite; filter: drop-shadow(0 0 1.6cqw rgb(150 200 255 / .75)); opacity: .9; }
@keyframes flutua { 50% { transform: translateY(-2.5%); } }
.lado[data-p="Biel"] .legenda { background: #2b4f7a; }

/* trajeto: mapa recortado de jornal, a rota se desenha e um ponto anda até o MASP */
.trajeto { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgb(10 5 8 / .6); cursor: pointer; opacity: 0; transition: opacity .5s; }
.trajeto.on { opacity: 1; }
.trajeto .mapa { position: relative; width: 70%; aspect-ratio: 16 / 9; background: #ece4d2; border: 1cqw solid #f6f0e2; box-shadow: .4cqw .8cqw 1.6cqw rgb(0 0 0 / .7); transform: rotate(-1.5deg); }
.trajeto svg { width: 100%; height: 100%; display: block; }
.trajeto .rua { fill: none; stroke: #b9ad95; stroke-width: 2.4; stroke-linecap: round; }
.trajeto .rua.grande { stroke: #a39578; stroke-width: 4; }
.trajeto .nome-rua { font: italic 3.2px Georgia, serif; fill: #6f6350; }
.trajeto .rota { fill: none; stroke: #b3201c; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.trajeto .ponto { fill: #b3201c; stroke: #ece4d2; stroke-width: .8; }
.trajeto .masp { fill: #c8281e; }
.trajeto .rotulo { font: bold 4.2px Georgia, serif; fill: #2a1d16; }
.trajeto .titulo { position: absolute; left: 4%; top: 4%; background: #1d1414; color: #ece4d2; font: italic 1.9cqw Georgia, serif; padding: .3em .7em; transform: rotate(-2deg); }
.trajeto .relogio { position: absolute; right: 4%; bottom: 5%; background: #1d1414; color: #e8c37a; font: bold 2.4cqw ui-monospace, monospace; padding: .2em .6em; transform: rotate(1.5deg); }
@media (max-aspect-ratio: 1/1) { .trajeto .mapa { width: 94%; } .trajeto .titulo { font-size: 3.4cqw; } .trajeto .relogio { font-size: 4cqw; } }

/* ilustração de momento-chave: foto de jornal colada por cima da cena */
.ilustracao { position: absolute; inset: 0; z-index: 3; display: grid; place-items: start center; padding-top: 3%; background: rgb(10 5 8 / .55); opacity: 0; pointer-events: none; transition: opacity .6s; }
.ilustracao.on { opacity: 1; }
.ilustracao img { position: static; width: 64%; aspect-ratio: 16 / 9; object-fit: cover; border: 1cqw solid #ece4d2; box-shadow: .4cqw .8cqw 1.6cqw rgb(0 0 0 / .7); transform: rotate(-1.2deg) scale(.96); transition: transform .8s; }
.ilustracao.on img { transform: rotate(-1.2deg); }
/* fim de capítulo: carimbo do final por cima da última ilustração */
.carimbo-final { position: absolute; left: 50%; top: 28%; z-index: 3; margin: 0; text-align: center; pointer-events: none; font-family: var(--f-tipo); color: #c8313f;
  border: .5cqw solid currentColor; padding: .6cqw 2.4cqw; background: rgb(236 228 210 / .9); opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(1.8);
  transition: opacity .25s, transform .4s cubic-bezier(.3, 1.6, .5, 1); box-shadow: .3cqw .6cqw 1.2cqw rgb(0 0 0 / .6); }
.carimbo-final.on { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg); }
.carimbo-final b { display: block; font-size: 6cqw; line-height: 1; }
.carimbo-final span { display: block; font-size: max(13px, 1.8cqw); color: #2a1d16; margin-top: .4cqw; }

/* emblema do clã nas cartas de personagem */
.carta { grid-template-columns: auto 1fr; column-gap: 1.2cqw; align-items: start; }
.carta .emblema { grid-row: span 4; width: max(40px, 5.6cqw); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--acento); color: var(--acento);
  font-family: var(--f-nome); font-size: max(18px, 2.8cqw); transform: rotate(-8deg); }
.cartas.tres { grid-template-columns: repeat(3, 1fr); }

/* Capa */
.capa, .abertura { position: absolute; inset: 0; z-index: 20; overflow: hidden; background: #0b0608; container-type: inline-size; }
.capa[hidden], .abertura[hidden] { display: none; }
.capa .capa-fundo, .abertura .quadro { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.capa .capa-fundo { filter: brightness(.6) saturate(.8); animation: kb 30s ease-in-out infinite alternate; }
.capa .elenco { position: absolute; inset: 0; pointer-events: none; }
.capa .elenco img { position: absolute; bottom: -4%; height: 62%; filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .7)); }
.capa .logo { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); margin: 0; text-align: center; width: 92%; line-height: 1.25; }
.capa .logo .palavra { display: inline-block; white-space: nowrap; margin: 0 .6cqw; }
.letra { display: inline-block; font-family: var(--f-tipo); font-size: 4.6cqw; padding: .1em .18em; margin: 0 .06em; box-shadow: .15cqw .3cqw .5cqw rgb(0 0 0 / .55); }
.letra.a { background: #ece4d2; color: #1d1412; }
.letra.b { background: #1a1212; color: #ece4d2; font-family: var(--f-nome); }
.letra.c { background: #8f1d26; color: #f4e7d2; }
.letra.d { background: #d9c9a8; color: #5a1a1f; font-family: "Bodoni Moda", Georgia, serif; font-weight: 600; }
.capa .sub { position: absolute; left: 50%; top: 37%; transform: translateX(-50%) rotate(-.6deg); margin: 0; white-space: nowrap; font-family: var(--f-tipo); font-size: max(12px, 1.45cqw);
  background: #ece4d2; color: #2a1d16; padding: .4cqw 1.4cqw; }
.capa .menu { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); display: flex; gap: 1.6cqw; align-items: center; z-index: 1; }
.capa .menu button { font-family: var(--f-tipo); font-size: max(15px, 2.1cqw); border: 0; cursor: pointer; padding: .6cqw 2.4cqw; background: #8f1d26; color: #f4e7d2; box-shadow: .2cqw .4cqw .8cqw rgb(0 0 0 / .6); transform: rotate(-1deg); }
.capa .menu[hidden] { display: none; }
.capa .menu.confirma { flex-direction: column; gap: .8cqw; }
.capa .menu.confirma p { margin: 0; font-family: var(--f-tipo); font-size: max(13px, 1.5cqw); background: #ece4d2; color: #2a1d16; padding: .4cqw 1.2cqw; transform: rotate(-.5deg); text-align: center; }
.capa .menu.confirma div { display: flex; gap: 1.6cqw; }
.capa .salvo { position: absolute; left: 50%; bottom: 1.6%; transform: translateX(-50%); margin: 0; white-space: nowrap; font-family: var(--f-tipo); font-size: max(11px, 1.2cqw); color: #2a1d16; background: #ece4d2; padding: .1cqw .8cqw; box-shadow: .2cqw .3cqw .6cqw rgb(0 0 0 / .6); }
.capa .salvo:empty { display: none; }
.capa .menu button.sec { background: #ece4d2; color: #2a1d16; font-size: max(13px, 1.6cqw); transform: rotate(.8deg); }
.capa .menu button:hover, .capa .menu button:focus-visible { outline: 2px solid #ece4d2; outline-offset: 3px; }
.capa .finais { position: absolute; right: 2.4cqw; bottom: 2cqw; margin: 0; font-family: var(--f-tipo); font-size: max(11px, 1.2cqw); color: #c9b998; background: none; border: 0; border-bottom: 1px dotted #c9b998; padding: 2px 0; cursor: pointer; }
.capa .finais:hover, .capa .finais:focus-visible { color: #fff; outline: none; }
.galeria { list-style: none; margin: 0; padding: 0; display: grid; gap: .8cqw; }
.galeria li { display: flex; gap: 1.2cqw; align-items: baseline; font-size: max(14px, 1.7cqw); line-height: 1.4; color: #8a7462; }
.galeria li b { font-family: var(--f-tipo); min-width: 2.2em; font-size: 1.1em; }
.galeria li.visto { color: var(--tinta); } .galeria li.visto b { color: var(--acento); }
.galeria strong { font-family: var(--f-tipo); font-size: .86em; letter-spacing: .04em; }
.horarios { list-style: none; padding-left: 0 !important; }
.horarios li { display: flex; gap: 1.2cqw; align-items: baseline; }
.horarios li b { font-family: var(--f-tipo); color: var(--acento); min-width: 6.2em; flex: none; font-size: .86em; }
/* Carrossel de capítulos: cada painel ocupa a capa inteira; o trilho anda de lado (arrastando, nas setas ou nas teclas ← →) */
.capa { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.capa .trilho { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.2, .7, .2, 1); will-change: transform; }
.capa .trilho.arrastando { transition: none; }
.capa.arrastando, .capa.arrastando * { cursor: grabbing !important; }
.capa .cap { position: absolute; top: 0; bottom: 0; width: 100%; overflow: hidden; }
.capa .cap img { -webkit-user-drag: none; }
.capa .num-cap { position: absolute; left: 50%; top: 3.2%; transform: translateX(-50%) rotate(-1.2deg); margin: 0; white-space: nowrap; font-family: var(--f-tipo); font-size: max(11px, 1.3cqw); letter-spacing: .25em;
  color: #f4e7d2; background: #8f1d26; padding: .2cqw 1.2cqw; box-shadow: .2cqw .4cqw .8cqw rgb(0 0 0 / .6); }
.capa .seta-cap { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; display: grid; justify-items: center; gap: .2cqw; border: 0; cursor: pointer; padding: .8cqw .9cqw;
  background: rgb(236 228 210 / .9); color: #2a1d16; font-family: var(--f-tipo); box-shadow: .2cqw .4cqw .8cqw rgb(0 0 0 / .6); }
.capa .seta-cap span { font-size: max(26px, 3.4cqw); line-height: .8; }
.capa .seta-cap small { font-size: max(10px, 1cqw); letter-spacing: .08em; white-space: nowrap; }
.capa .seta-cap.ant { left: 1.2cqw; rotate: 1.5deg; }
.capa .seta-cap.prox { right: 1.2cqw; rotate: -1.5deg; }
.capa .seta-cap[hidden] { display: none; }
.capa .seta-cap:hover, .capa .seta-cap:focus-visible { outline: 2px solid #ece4d2; outline-offset: 3px; background: #ece4d2; }
.capa .pontos { position: absolute; left: 2.4cqw; bottom: 2cqw; z-index: 2; display: flex; gap: .8cqw; }
.capa .pontos button { width: max(12px, 1.2cqw); aspect-ratio: 1; padding: 0; border: 2px solid #ece4d2; border-radius: 50%; background: transparent; cursor: pointer; box-shadow: 0 0 .5cqw rgb(0 0 0 / .8); }
.capa .pontos button[aria-selected="true"] { background: #c8313f; border-color: #c8313f; }
/* confirmação de apagar o jogo salvo: some o menu do painel e as setas, e o carrossel fica parado */
.capa.confirmando .cap .menu, .capa.confirmando .seta-cap, .capa.confirmando .pontos { display: none; }
@media (prefers-reduced-motion: reduce) { .capa .trilho { transition: none; } }

/* Abertura animada: quadros com zoom lento, hora, legenda e recortes entrando */
.abertura .quadro { opacity: 0; transition: opacity 1s; filter: saturate(.8); }
.abertura .quadro.on { opacity: 1; animation: kb 7s ease-out forwards; }
@keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.14) translate(-1.5%, -1%); } }
.abertura .vinheta { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgb(8 3 6 / .85) 100%); }
.abertura .hora-ab { position: absolute; left: 4%; top: 7%; font-family: var(--f-tipo); font-size: 3.4cqw; color: #ece4d2; background: #8f1d26; padding: .2cqw 1.2cqw; opacity: 0; transform: translateX(-30%); transition: opacity .5s, transform .5s; }
.abertura .legenda-ab { position: absolute; z-index: 1; left: 4%; bottom: 9%; max-width: 62%; font-family: var(--f-texto); font-size: 2.5cqw; line-height: 1.35; color: #2a1d16; background: #ece4d2; padding: 1cqw 1.8cqw;
  box-shadow: .3cqw .5cqw 1cqw rgb(0 0 0 / .6); opacity: 0; transform: translateY(20%) rotate(-.8deg); transition: opacity .5s, transform .5s; }
.abertura .on-txt { opacity: 1 !important; transform: rotate(-.8deg) !important; }
.abertura .recorte-ab { position: absolute; bottom: -3%; height: 82%; opacity: 0; transition: opacity .7s, transform 1.4s cubic-bezier(.2, .7, .2, 1); filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .7)); }
.abertura .recorte-ab.dir { right: 5%; transform: translateX(25%) rotate(-2deg); }
.abertura .recorte-ab.esq { right: 8%; transform: translateX(-15%) rotate(2deg); }
.abertura .recorte-ab.on { opacity: 1; transform: rotate(-1.5deg); }
.abertura .carimbo { position: absolute; left: 50%; top: 40%; white-space: nowrap; font-family: var(--f-tipo); font-size: 9cqw; color: #c8313f; border: .6cqw solid #c8313f; padding: 0 2cqw; opacity: 0;
  transform: translate(-50%, -50%) rotate(-12deg) scale(2.2); transition: opacity .25s, transform .35s cubic-bezier(.3, 1.6, .5, 1); mix-blend-mode: screen; }
.abertura .quadro.escuro { filter: saturate(.5) brightness(.55); }
/* etiqueta de quem é quem, presa embaixo do recorte */
.abertura .quem-ab { position: absolute; left: 70%; top: 60%; translate: -50% 0; white-space: nowrap; font-family: var(--f-tipo); font-size: 1.9cqw; color: #f4e7d2; background: #8f1d26; padding: .3cqw 1.2cqw; rotate: 2deg;
  box-shadow: .2cqw .4cqw .8cqw rgb(0 0 0 / .6); opacity: 0; transform: translateY(-30%); transition: opacity .4s, transform .4s; z-index: 1; }
.abertura .quem-ab.on { opacity: 1; transform: none; }
.abertura .carimbo.on { opacity: .9; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
.abertura .bilhete { position: absolute; right: 9%; top: 18%; width: 34%; background: #efe6d0; color: #2a1d16; font-family: var(--f-tipo); font-size: 2.2cqw; line-height: 1.5; padding: 2.2cqw 2.4cqw;
  box-shadow: .4cqw .8cqw 1.4cqw rgb(0 0 0 / .7); opacity: 0; transform: rotate(4deg) translateY(-30%); transition: opacity .6s, transform 1s; }
.abertura .bilhete b { display: block; width: 3.4cqw; aspect-ratio: 1; border-radius: 50%; background: #23407a; margin: 1cqw 0 0 auto; box-shadow: inset 0 0 .6cqw rgb(0 0 0 / .5); }
.abertura .bilhete.on { opacity: 1; transform: rotate(4deg); }
.abertura .flash { position: absolute; inset: 0; background: #c8313f; opacity: 0; mix-blend-mode: multiply; pointer-events: none; }
.abertura .flash.on { animation: flash 1.2s; }
@keyframes flash { 10% { opacity: .9; } 100% { opacity: 0; } }
.abertura .pular { position: absolute; right: 2cqw; top: 2cqw; z-index: 2; font-family: var(--f-tipo); font-size: max(12px, 1.3cqw); background: rgb(236 228 210 / .85); color: #2a1d16; border: 0; padding: .4cqw 1.2cqw; cursor: pointer; }
/* quadro que já é um recorte de jornal pronto (manchete e figura na imagem): entra inteiro, como papel na mesa, sem cortar a manchete */
.abertura .quadro.jornal { inset: auto; left: 9%; top: 12%; width: 82%; height: 66%; object-fit: contain; filter: saturate(.8) drop-shadow(.4cqw .8cqw 1.2cqw rgb(0 0 0 / .8)); }
.abertura .quadro.jornal.on { animation: kbj 8s ease-out forwards; }
@keyframes kbj { from { transform: scale(.94) rotate(-2.5deg); } to { transform: scale(1) rotate(-1deg); } }
.abertura .carimbo.canto { left: 78%; top: 70%; font-size: 6cqw; }
/* cartão de título do capítulo, no último quadro */
.abertura .titulo-ab { position: absolute; left: 50%; top: 42%; translate: -50% -50%; width: 90%; text-align: center; color: #ece4d2; opacity: 0; transform: scale(1.08); transition: opacity 1.2s, transform 2.4s ease-out; pointer-events: none; text-shadow: 0 .3cqw 1.4cqw rgb(0 0 0 / .9); }
.abertura .titulo-ab small { display: inline-block; font-family: var(--f-tipo); font-size: 2.4cqw; letter-spacing: .3em; background: #8f1d26; padding: .3cqw 1.4cqw; }
.abertura .titulo-ab b { display: block; font-family: var(--f-tipo); font-weight: normal; font-size: 6.4cqw; line-height: 1.1; margin-top: 1.2cqw; }
.abertura .titulo-ab.on { opacity: 1; transform: none; }
/* fim da abertura: ela some devagar por cima da cena que já começou */
.abertura.saindo { opacity: 0; transition: opacity .9s; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .abertura .quadro.on, .abertura .quadro.jornal.on, .capa .capa-fundo, .lado[data-p="Biel"] img { animation: none; } }

/* ---------- Ajuda para quem não joga Vampiro: ficha, botão "?", dicas e tutorial ---------- */
/* botão "?" no canto de cima da cena, longe dos rostos */
.ajuda-btn { position: absolute; top: 2.2cqw; right: 2.2cqw; z-index: 5; width: max(28px, 3.2cqw); aspect-ratio: 1; border-radius: 50%; border: 2px solid #ece4d2;
  background: var(--acento); color: #f4e7d2; font-family: var(--f-nome); font-size: max(15px, 1.8cqw); line-height: 1; cursor: pointer; box-shadow: .2cqw .4cqw .8cqw rgb(0 0 0 / .6); }
.ajuda-btn:hover, .ajuda-btn:focus-visible { outline: 2px solid #ece4d2; outline-offset: 2px; }
/* dica de uma linha ao passar o mouse sobre uma etiqueta */
.dica-pop { position: absolute; z-index: 30; max-width: min(420px, 60%); pointer-events: none; background: #1d1412; color: #efe3d2; font-family: var(--f-texto); font-size: max(13px, 1.35cqw);
  line-height: 1.35; padding: .6em .8em; box-shadow: .2cqw .4cqw 1cqw rgb(0 0 0 / .6); border-left: 3px solid var(--sangue); opacity: 0; transition: opacity .15s; }
.dica-pop.on { opacity: 1; }
.dica-pop b { font-family: var(--f-tipo); font-weight: 400; color: var(--ambar); }
[data-dica] { cursor: help; }
.porque[data-dica], .passiva[data-dica] { text-decoration: underline dotted; text-underline-offset: .2em; }
.carta .emblema.foto { width: max(64px, 8cqw); border-width: 2px; overflow: hidden; background: #1b1714; }
.carta .emblema.foto { position: relative; }
/* o rosto fica no centro do círculo, do mesmo tamanho nos três (--cw, --cx, --cy, --hh vêm de ELENCO_ESCALA) */
.carta .emblema.foto img { position: absolute; width: calc(var(--cw, 100%)); height: auto; max-width: none; left: calc(50% - var(--cx, .5) * var(--cw, 100%)); top: calc(50% - var(--cy, .2) * var(--hh, 1.3) * var(--cw, 100%)); }
.ficha-foto { float: right; width: min(34%, 220px); margin: 0 0 1cqw 1.5cqw; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.carta .ver { font-family: var(--f-tipo); font-size: max(11px, 1.2cqw); color: var(--acento); }
/* escolha de personagem: os três protagonistas grandes no palco, um em cima de cada carta; o da carta apontada acende */
.elenco-escolha { position: absolute; inset: 0 0 var(--sob-caixa, 0px); z-index: 3; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 100%; align-items: end; padding: 0 4%; pointer-events: none; }
.elenco-escolha[hidden] { display: none; }
/* os três ficam na MESMA escala (cabeça do mesmo tamanho): --r vem de ELENCO_ESCALA; --k aumenta tudo quando o palco é baixo */
.elenco-escolha figure { margin: 0; height: 92%; position: relative; display: flex; justify-content: center; align-items: flex-end; cursor: pointer; pointer-events: auto;
  opacity: 0; transform: translateY(8%) rotate(var(--giro, 0deg)); animation: elenco-entra .6s cubic-bezier(.2, .8, .3, 1) forwards; animation-delay: var(--atraso, 0s);
  filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .65)); transition: filter .25s, scale .25s; }
.elenco-escolha img { position: static; height: calc(100% * var(--k, 1) * var(--r, 1)); width: auto; max-width: none; flex: none; display: block; }
.elenco-escolha figcaption { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%) rotate(-1.5deg); white-space: nowrap; font-family: var(--f-nome);
  font-size: max(13px, 1.8cqw); background: var(--acento); color: #f4e7d2; padding: .2cqw 1.1cqw; box-shadow: .1cqw .3cqw .5cqw rgb(0 0 0 / .5); }
.elenco-escolha.apontando figure { filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .65)) brightness(.45) saturate(.5); }
.elenco-escolha.apontando figure.on { filter: drop-shadow(.3cqw .8cqw .9cqw rgb(0 0 0 / .65)); scale: 1.04; }
@keyframes elenco-entra { to { opacity: 1; transform: rotate(var(--giro, 0deg)); } }
.carta.acesa { border-color: var(--acento); }
/* celular deitado: só cabeça e ombros aparecem, todos alinhados pelo topo, o resto some atrás do papel */
@media (max-height: 500px) and (min-aspect-ratio: 1/1) { .elenco-escolha { overflow: hidden; align-items: start; --k: 2.4; } .elenco-escolha figure { height: 100%; align-items: flex-start; } .elenco-escolha figcaption { bottom: 4px; font-size: 11px; padding: 1px 8px; } }
@media (prefers-reduced-motion: reduce) { .elenco-escolha figure { animation: none; opacity: 1; transform: none; } }
/* ficha, ajuda e tutorial usam a mesma folha do caderno */
.caderno .folha.longa { min-height: 0; }
.caderno:has(.folha.longa) { grid-template-rows: 100%; }
.caderno .bloco-folhas:has(.folha.longa) { width: min(92%, 860px); display: flex; flex-direction: column; }
.caderno .folha.longa { flex: 0 1 auto; padding-bottom: 0; }
/* botões sempre à vista, mesmo com a folha rolando */
.caderno .folha.longa .botoes { position: sticky; bottom: 0; background: var(--folha); padding: 1cqw 0 1.6cqw; margin-top: .6cqw; }
.caderno .folha h3 { font-family: var(--f-nome); font-weight: 600; font-size: max(14px, 1.7cqw); margin: 1.4cqw 0 .4cqw; color: var(--acento); }
.caderno .folha p { margin: 0 0 .7cqw; font-size: max(14px, 1.65cqw); line-height: 1.45; }
.caderno .folha .lead { font-style: italic; color: #6d5440; }
.ficha-tab { width: 100%; border-collapse: collapse; font-size: max(13px, 1.4cqw); line-height: 1.3; color: inherit; }
.ficha-tab th, .ficha-tab td { color: inherit; font-size: inherit; }
.ficha-tab th { text-align: left; font-family: var(--f-tipo); font-weight: 400; white-space: nowrap; padding: .25cqw 1cqw .25cqw 0; vertical-align: top; }
.ficha-tab td { padding: .25cqw 0; vertical-align: top; border-bottom: 1px solid #d6c7ad; }
.ficha-tab th { border-bottom: 1px solid #d6c7ad; }
.pontos { font-family: var(--f-tipo); color: var(--acento); letter-spacing: .1em; white-space: nowrap; padding-right: 1cqw !important; }
.caderno .botoes { display: flex; gap: 1cqw; flex-wrap: wrap; align-items: center; }
.caderno .botoes .fechar { margin-top: 0; }
.caderno .botoes .fechar.sec { background: none; color: #2a1810; border: 1px solid #2a1810; }
.caderno .botoes .fechar.principal { background: var(--acento); color: #f4e7d2; }
.caderno .passo { font-family: var(--f-tipo); font-size: max(11px, 1.2cqw); color: #6d5440; margin-left: auto; }
.exemplos { display: grid; gap: .4cqw; margin: .4cqw 0 .8cqw; padding: 0; list-style: none; font-size: max(13px, 1.5cqw); }
.exemplos .porque { margin-right: .4em; }

/* ---------- Celular: retrato (cena em cima, texto embaixo) e paisagem (como no PC, mais justo) ---------- */
body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.dialogo, .escolhas, .cartas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.rodape .tela-cheia[hidden] { display: none; }
/* no toque não existe "passar o mouse": o realce não fica preso depois do toque */
@media (hover: none) {
  .escolhas button:hover:not(:focus-visible) { background: transparent; border-color: transparent; }
  .carta:hover:not(:focus-visible) { border-color: #c9b998; }
}
@media (pointer: coarse) {
  .ajuda-btn { width: 38px; font-size: 18px; }
  .escolhas button { padding: 6px 8px; min-height: 36px; align-items: center; }
  .rodape button { padding: 6px 10px; }
  .caderno .aba { padding: 8px 12px 6px; }
  .caderno .fechar, .dados .seguir, .capa .menu button { min-height: 40px; }
}

/* Retrato: a cena ocupa a metade de cima da tela, a caixa de texto o resto. Os dois recortes ficam menores e um pouco
   sobrepostos; quem fala vem para a frente. */
@media (max-aspect-ratio: 1/1) {
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .jogo { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .palco { aspect-ratio: auto; flex: 0 0 auto; height: min(52%, 130vw); }
  .palco .lado { scale: .78; transform-origin: 50% 100%; }
  .lado.esq { left: -14%; }
  .lado.dir { right: -14%; }
  .lado[data-p="Nonna"] { left: -3%; }
  .lado:not(.calado) { z-index: 1; }
  .legenda { font-size: 15px; padding: 3px 12px; }
  .ilustracao img { width: 94%; margin-top: 4%; }
  .carimbo-final b { font-size: 11cqw; }
  .dialogo { position: relative; inset: auto; flex: 1; min-height: 0; margin: 26px 10px 10px; padding: 54px 16px 22px; transform: none; display: flex; flex-direction: column; }
  #conteudo { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  /* o nome fica todo acima do rasgo do papel, sem encostar na hora */
  .nome { left: 12px; font-size: 15px; padding: 3px 12px; transform: translateY(-88%); }
  /* o rosto acompanha o texto, que fica no meio da caixa */
  .eu { height: 104px; left: 8px; top: calc(50% + 16px); bottom: auto; translate: 0 -50%; }
  .eu img { max-width: 120px; }
  .eu figcaption { font-size: 10px; }
  .elenco-escolha { padding: 0; --k: .5; }
  .elenco-escolha figure { height: 84%; }
  .elenco-escolha figcaption { font-size: 14px; bottom: 6%; padding: 2px 10px; }
  .dialogo.com-eu { padding-left: calc(16px + var(--eu-larg, 84px)); }
  .dialogo.com-eu .nome { left: calc(8px + var(--eu-larg, 84px)); }
  .hud { top: 20px; right: 14px; gap: 12px; font-size: 13px; }
  .hud .amanhecer { display: none; }
  .fala { font-size: 17px; }
  .escolhas { gap: 2px; }
  .escolhas.muitas { grid-template-columns: 1fr; }
  .escolhas button { font-size: 16px; }
  .titulo { font-size: 13px; margin-bottom: 8px; }
  .seta { right: 12px; bottom: 8px; font-size: 14px; }
  /* o aviso sai do lado direito, para não cobrir o nome de quem fala */
  .toast { max-width: 60%; font-size: 13px; padding: 4px 10px; left: auto; right: 10px; translate: 0 -115%; }
  .cartas, .cartas.tres { grid-template-columns: 1fr; gap: 8px; }
  .carta { padding: 10px 12px; column-gap: 12px; }
  .carta .emblema { width: 44px; font-size: 20px; }
  .carta .emblema.foto { width: 64px; }
  .carta b { font-size: 18px; } .carta span { font-size: 14px; } .carta small { font-size: 12px; } .carta .ver { font-size: 12px; }
  /* caderno, ficha, ajuda e tutorial: quase a tela toda */
  .caderno .bloco-folhas, .caderno .bloco-folhas:has(.folha.longa) { width: 94%; max-height: 94%; }
  .caderno .abas { overflow-x: auto; scrollbar-width: none; padding-left: 8px; gap: 4px; }
  .caderno .aba { white-space: nowrap; font-size: 13px; }
  .caderno .folha { padding: 16px 16px; }
  .caderno .folha.longa .botoes { padding: 10px 0 14px; }
  .caderno .folha p, .caderno ol { font-size: 15px; }
  .caderno h2 { font-size: 19px; margin-bottom: 8px; }
  .caderno .folha h3 { font-size: 15px; margin: 14px 0 4px; }
  .caderno .botoes { gap: 8px; }
  .caderno .fechar { font-size: 14px; padding: 8px 14px; }
  .ficha-tab tr { display: grid; grid-template-columns: 1fr auto; }
  .ficha-tab th, .ficha-tab td.pontos { border-bottom: 0; padding-top: 6px; }
  .ficha-tab td:last-child { grid-column: 1 / -1; padding-bottom: 6px; font-size: 14px; }
  .dica-pop { max-width: 92%; font-size: 14px; }
  .dados { min-width: 0; max-width: 92%; padding: 16px 16px 14px; gap: 10px; }
  .dados .linha { gap: 8px; }
  .dados .res { font-size: 18px; }
  .dados .det { font-size: 12px; }
  .dados .conta { font-size: 14px; }
  .dados .seguir { font-size: 15px; padding: 8px 18px; }
  /* capa */
  .letra { font-size: 6.6cqw; }
  .capa .logo { top: 8%; }
  .capa .sub { top: 31%; white-space: normal; width: 84%; text-align: center; font-size: 13px; padding: 4px 10px; }
  /* um recorte de cada vez, trocando com fade, em vez dos três empilhados */
  .capa .elenco img { left: 50% !important; height: 46% !important; bottom: 15%; transform: translateX(-50%) rotate(-1.5deg) !important; opacity: 0; transition: opacity 1.4s; }
  .capa .elenco img.on { opacity: 1; }
  .capa .menu { flex-direction: column; gap: 10px; bottom: 7%; width: 72%; }
  .capa .menu button { width: 100%; font-size: 18px; padding: 8px 12px; }
  .capa .menu button.sec { font-size: 15px; }
  .capa .menu.confirma p { font-size: 14px; padding: 6px 10px; }
  .capa .menu.confirma div { flex-direction: column; gap: 10px; }
  .capa .salvo { bottom: 2.4%; font-size: 12px; }
  .capa .finais { display: none; }
  .capa .num-cap { font-size: 12px; padding: 3px 10px; top: 2.6%; }
  .capa .seta-cap { padding: 8px 6px; }
  .capa .seta-cap span { font-size: 26px; }
  .capa .seta-cap small { display: none; }
  .capa .seta-cap.ant { left: 6px; }
  .capa .seta-cap.prox { right: 6px; }
  .capa .pontos { left: 50%; transform: translateX(-50%); bottom: auto; top: 36%; gap: 10px; }
  /* abertura */
  .abertura .hora-ab { font-size: 7cqw; top: 6%; }
  .abertura .legenda-ab { font-size: 17px; max-width: 92%; bottom: 6%; padding: 10px 14px; }
  /* em pé: a abertura cobre a tela toda; o recorte fica no centro, com a cintura escondida atrás da legenda */
  .abertura { position: fixed; }
  .abertura .recorte-ab { height: auto; max-height: 50%; width: auto; max-width: 92%; bottom: 11%; right: auto; left: 50%; translate: -50% 0; }
  .abertura .recorte-ab.dir { transform: translateY(8%) rotate(-2deg); }
  .abertura .recorte-ab.esq { transform: translateY(8%) rotate(2deg); }
  .abertura .recorte-ab.on { transform: rotate(-1.5deg); }
  .abertura .legenda-ab { left: 50%; translate: -50% 0; width: 88%; max-width: none; }
  .abertura .quem-ab { font-size: 13px; padding: 3px 10px; }
  .abertura .carimbo { font-size: 15cqw; }
  .abertura .quadro.jornal { left: 3%; top: 22%; width: 94%; height: 44%; }
  .abertura .carimbo.canto { left: 62%; top: 62%; font-size: 11cqw; }
  .abertura .titulo-ab { top: 40%; }
  .abertura .titulo-ab small { font-size: 4.4cqw; padding: 3px 12px; }
  .abertura .titulo-ab b { font-size: 11cqw; margin-top: 10px; }
  .abertura .bilhete { width: 66%; font-size: 4.6cqw; top: 16%; padding: 16px 18px; }
  .abertura .bilhete b { width: 7cqw; }
  .abertura .pular { font-size: 14px; padding: 8px 14px; top: 12px; right: 12px; }
  /* rodapé: só os botões, numa linha */
  .rodape { margin: 0; padding: 0 10px 8px; justify-content: center; }
  .rodape > span:first-child, .rodape input[type=range] { display: none; }
  .rodape .acoes { flex-wrap: wrap; justify-content: center; gap: 6px; }
}

/* Celular em pé com pouco espaço: tela pequena, zoom do Safari ou letra grande no aparelho (a tela "encolhe" em pixels).
   A cena diminui para a caixa de texto ganhar espaço, a hora e a Fome ficam numa linha só, sem invadir o texto,
   e o rodapé fica numa linha com botões menores. */
@media (max-aspect-ratio: 1/1) and (max-width: 340px), (max-aspect-ratio: 1/1) and (max-height: 560px) {
  .palco { height: min(36%, 60vw); }
  .dialogo { margin: 20px 6px 6px; padding: 12px 10px 16px; }
  /* a linha da hora entra no fluxo da caixa: se precisar quebrar, empurra o texto para baixo em vez de cobrir */
  .hud { position: static; flex: none; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; margin-bottom: 8px; font-size: 12px; white-space: nowrap; }
  .hud .barra { display: none; }
  .fome i { width: 8px; }
  .eu { height: 64px; } .eu img { max-width: 64px; } .eu figcaption { display: none; }
  .dialogo.com-eu { padding-left: calc(12px + var(--eu-larg, 56px)); }
  .fala { font-size: 16px; line-height: 1.4; }
  .escolhas button { font-size: 15px; }
  .rodape { padding: 0 4px 4px; }
  .rodape .acoes { gap: 4px; }
  .rodape button { padding: 3px 5px; font-size: 10px; min-height: 0; white-space: nowrap; }
}

/* Celular (em pé e deitado): texto curto fica no meio da caixa, não grudado no topo. As duas "molas" encolhem até zero
   quando o texto é comprido, e aí a rolagem começa do topo, como antes. */
@media (max-aspect-ratio: 1/1), (min-aspect-ratio: 1/1) and (max-height: 520px) {
  #conteudo { display: flex; flex-direction: column; }
  #conteudo::before, #conteudo::after { content: ""; flex: 1 1 0; }
  #conteudo > * { flex: none; }
  .fala { min-height: 0; }
}

/* Paisagem no celular: a mesma tela do PC, com a cena usando toda a altura e o rodapé enxuto */
@media (min-aspect-ratio: 1/1) and (max-height: 520px) {
  .escolhas.muitas { grid-template-columns: 1fr; }
  .escolhas.muitas button { font-size: 16px; }
  #conteudo:has(.escolhas.muitas) { max-height: 40vh; max-height: 40dvh; overflow-y: auto; overscroll-behavior: contain; }
  body { padding: 4px max(8px, env(safe-area-inset-right, 0px)) 2px max(8px, env(safe-area-inset-left, 0px)); }
  .jogo { width: min(100%, calc((100vh - 44px) * 16 / 9)); width: min(100%, calc((100dvh - 44px) * 16 / 9)); }
  .rodape { margin-top: 4px; justify-content: center; }
  .rodape > span:first-child, .rodape input[type=range] { display: none; }
  .rodape button { padding: 3px 10px; }
  .dialogo { min-height: 30%; padding: 34px 18px 16px; display: flex; flex-direction: column; }
  .hud { top: 10px; }
  #conteudo { flex: 1; max-height: calc(100vh - 122px); max-height: calc(100dvh - 122px); overflow-y: auto; overscroll-behavior: contain; }
  /* a caixa cobre a parte de baixo da cena: o nome do personagem sobe para não ficar escondido atrás dela */
  .legenda { bottom: 47%; }
  .escolhas button { min-height: 30px; padding: 3px 8px; }
  .caderno .bloco-folhas, .caderno .bloco-folhas:has(.folha.longa) { width: 94%; max-height: 96%; }
  .caderno .folha { padding: 12px 18px; }
  /* cinco opções ou mais: duas colunas, para a cena não sumir atrás da caixa */
  .escolhas.longa, .escolhas.muitas { grid-template-columns: 1fr 1fr; column-gap: 10px; }
  .escolhas.longa button, .escolhas.muitas button { font-size: 15px; line-height: 1.25; }
  /* o "?" vai para o canto esquerdo: no direito ele cobria o botão do Caderno quando a caixa crescia */
  .ajuda-btn { right: auto; left: 2.2cqw; }
  .lado[data-p="Harumi"] .legenda { bottom: 49%; }
  /* escolha de personagem: as três cartas cabem lado a lado, sem cortar a última */
  .cartas.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cartas.tres .carta { padding: 8px; column-gap: 8px; min-width: 0; }
  .cartas.tres .carta .emblema.foto { width: 46px; }

<script>// Regras de dados de Vampiro V5, usadas pelo jogo web e pelos testes.
// Resultado: 0 falha, 1 sucesso, 2 crítico, 3 crítico bagunçado, 4 falha bestial
(function (root) {
  function rolarV5(parada, fome, dificuldade, rng) {
    rng = rng || Math.random;
    const d10 = () => 1 + Math.floor(rng() * 10);
    const nFome = Math.min(fome, parada);
    const dados = [];
    for (let i = 0; i < parada; i++) dados.push({ valor: d10(), fome: i < nFome });
    let sucessos = dados.filter(d => d.valor >= 6).length;
    const dezes = dados.filter(d => d.valor === 10);
    const pares = Math.floor(dezes.length / 2);
    sucessos += pares * 2; // cada par de 10 vale 4 sucessos no total
    const passou = sucessos >= dificuldade;
    let resultado;
    if (passou && pares > 0 && dezes.some(d => d.fome)) resultado = 3;
    else if (passou && pares > 0) resultado = 2;
    else if (passou) resultado = 1;
    else if (dados.some(d => d.fome && d.valor === 1)) resultado = 4;
    else resultado = 0;
    return { resultado, sucessos, dados, dificuldade };
  }
  function despertarV5(rng) { return 1 + Math.floor((rng || Math.random)() * 10) >= 6; }
  root.V5 = { rolarV5, despertarV5 };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

da tinha chance de mostrar mais ","ev",{"VAR?":"provas_max"},{"VAR?":"provas_dadas"},"-",1,"==","/ev",[{"->":".^.b","c":true},{"b":["^uma coisa",{"->":".^.^.^.10"},null]}],[{"->":".^.b"},{"b":["^coisas",{"->":".^.^.^.10"},null]}],"nop","^, e parou antes. ",{"->":".^.^.^.74"},null]}],"nop","\n","^Dante: Você me traz um palpite na frente da Corte inteira?","\n",{"->":"final_sem_provas"},null],"cao_desmorona":["^O Cão olha para a escada. Dois carniçais do Príncipe já estão lá.","\n","^Cão: Tá bom. Tá no bunker, embaixo da Linha Amarela. Intacto. Eu ia devolver quando a poeira baixasse. ","#","^expr: encurralado","/#","\n","^Cão: E o moleque viu o que não devia. Fiz o que um Xerife faz.","\n","^Dante: Você fez o que um traidor faz.","\n","^O Cão não espera os carniçais. Ele salta por cima da mesa, e em meio segundo as unhas dele estão na sua garganta. O seu sangue pinga no chão do Porão. ","#","^expr cao: ataque ","/#","#","^expr voce: dor","/#","\n","^Dante: Pare. ","#","^expr: ordem","/#","\n","^Uma palavra só. O Cão congela no ar, como cachorro que ouviu o dono. Os carniçais o arrastam para longe de você.","\n","^Dante: Ninguém toca em quem me serve. Pelo menos esta noite.","\n","^Você leva a mão ao pescoço. Mais um segundo e não sobrava nada para o Príncipe proteger. ","#","^expr voce: dor","/#","\n","ev",{"VAR?":"p_boes"},"/ev",[{"->":".^.b","c":true},{"b":["\n","^Constance não tira os olhos de você. Ela percebe que você sabe mais do que disse.","\n","^Você tem o carimbo do BOES no bolso. O Príncipe ia entregar o Matusalém para os caçadores. O que você faz?","\n","ev","str","^Ficar calado e entregar só o Cão ao Príncipe","/str","/ev",{"*":".^.c-0","flg":4},"ev","str","^Mostrar o carimbo do BOES para a Corte inteira","/str","/ev",{"*":".^.c-1","flg":4},"ev","str","^Guardar a prova e levar aos Anarquistas, pelo Rayo","/str","/ev",{"*":".^.c-2","flg":4},"ev","str","^Final ideal :: Dizer só ao Príncipe, no ouvido, que você sabe para quem ia a carga.","/str",{"VAR?":"p_ ,null]}],[{"->":".^.b"},{"b":["^O",{"->":".^.^.^.16"},null]}],"nop","^ forasteir","ev",{"VAR?":"o"},"out","/ev","^ sabe disso. Só não sabe onde ele está.","\n","^Dante olha para ela por um longo tempo. Ele não pode derrubar a Primogênita Lasombra por causa de ","ev",{"VAR?":"o"},"str","^a","/str","==","/ev",[{"->":".^.b","c":true},{"b":["^uma",{"->":".^.^.^.34"},null]}],[{"->":".^.b"},{"b":["^um",{"->":".^.^.^.34"},null]}],"nop","^ forasteir","ev",{"VAR?":"o"},"out","/ev","^. Ainda não.","\n","#","^musica: final_triste","/#","^Dante: Saia da minha cidade antes da próxima noite. Sua dívida não está paga.","\n","ev",{"VAR?":"cla"},"str","^Nosferatu","/str","==","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":"irene_some_constance"},{"->":".^.^.^.55"},null]}],"nop","\n","^Você não chega à próxima noite. Na escada da pensão, a sua própria sombra se levanta da parede e fecha a sua boca. ","#","^expr voce: medo","/#","\n","#","^imagem: amanhecer","/#","^Os Lasombra não deixam acusação sem resposta. De manhã, sobra uma mancha de cinza no degrau e um lenço cor-de-rosa.","\n",{"->":"final_a_epilogo"},null],"morte_bode":["ev",{"VAR?":"denunciado"},"/ev",[{"->":".^.b","c":true},{"b":["^Na mesma noite",{"->":".^.^.^.5"},null]}],[{"->":".^.b"},{"b":["^Três noites depois",{"->":".^.^.^.5"},null]}],"nop","^, alguém bate na porta da sua pensão. É o Cão, com o cigarro que ele não traga.","\n","^Cão: Bom trabalho, forasteir","ev",{"VAR?":"o"},"out","/ev","^. Bom até demais. Gente esperta não dura nesta cidade. ","#","^expr: sorriso ","/#","#","^expr voce: medo","/#","\n","ev",{"VAR?":"cla"},"str","^Nosferatu","/str","==","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":"irene_some_cao"},{"->":".^.^.^.29"},null]}],"nop","\n","#","^imagem: amanhecer","/#","^Ninguém pergunta por você. Você não tinha amigos aqui, como o Príncipe disse.","\n",{"->":"final_a_epilogo"},null],"final_a_epilogo":["#","^imagem: bunker","/#","#","^musica: final_triste","/#","^Longe dali, embaixo dos trilhos da Linha Amarela, um sarcófago com um selo queimado espera no escuro. Só o Cão sabe onde ele está.","\n","^FINAL A · O BODE EXPIATÓRIO. Você acusou a pessoa errada e pagou com a vida. ","#","^final: A","/#","\n","end",null],"irene_some_cao":["^O Cão empurra a porta. O quarto está vazio: cama feita, mala aberta, janela fechada.","\n","^Você está a meio metro dele, encostada na parede, e ele não vê. A Ofuscação nunca foi tão fácil. ","#","^expr voce: some","/#","\n","^Cão: Rato. Eu sei que você está aqui.","\n","^Ele fareja o ar e vai embora. Ele vai voltar. Mas até lá, você já desceu pelo ralo do banheiro.","\n",{"->":"final_irene_esgoto"},null],"irene_some_constance":["ev",true,"/ev",{"VAR=":"constance_tentou","re":true},"^Na escada da pensão, a sua sombra se levanta da parede para fechar a sua boca, e não encontra boca nenhuma.","\n","^Você já não estava ali. Uma Nosferatu aprende a sumir antes de aprender a andar. ","#","^expr voce: some","/#","\n",{"->":"final_irene_esgoto"},null],"final_irene_esgoto":["ev","str","^F","/str","/ev",{"VAR=":"final_cap1","re":true},"#","^imagem: tunel","/#","#","^musica: final_triste","/#","^Para a cidade, a forasteira morreu. Para os ratos dos esgotos do Bixiga, chegou uma vizinha nova.","\n","^Daqui de baixo você ouve tudo: os túneis falam, e um deles, embaixo da Linha Amarela, cheira a morte velha.","\n","^Ninguém procura quem está morta. É a melhor posição para recomeçar a investigação.","\n","^Continua no capítulo 2.","\n","^FINAL F · A MORTA NOS ESGOTOS. Irene errou a acusação, mas a Ofuscação a salvou. A cidade acha que ela virou cinza. ","#","^final: F","/#","\n","end",null],"final_sem_provas":["#","^entra: cao","/#","^O Cão sorri, mostrando os dentes tortos. ","#","^expr cao: sorriso","/#","\n","^Cão: Príncipe, alguém de fora que acusa o Xerife sem prova é alguém que trabalha para alguém.","\n","^Dante: Concordo.","ev",{"VAR?":"denunciado"},"/ev",[{"->":".^.b","c":true},{"b":["^ E que ainda quebra a regra do Vincenzo.",{"->":".^.^.^.15"},null]}],"nop","\n","^Antes que você chegue à escada, as mãos do Cão estão nos seus ombros. ","#","^expr voce: medo","/#","\n","#","^imagem: amanhecer","/#","#","^musica: final_triste","/#","^Quando você abre os olhos, tem correntes nos pulsos, no telhado da cantina, olhando o céu do Bixiga ficar cor de laranja.","\n","ev",{"VAR?":"cla"},"str","^Gangrel","/str","==","/ev",[{"->":".^.b","c":true},{"b":["^ ",{"->":"tomas_foge"},{"->":".^.^.^.38"},null]}],"nop","\n","^É a última coisa que você vê.","\n","^FINAL D · SEM PROVAS. Você acusou o culpado sem ter como provar: só ","ev",{"VAR?":"provas_fortes"},"out","/ev","^ de ","ev",{"VAR?":"provas_max"},"out","/ev","^ provas se sustentaram diante da Corte. ","#","^final: D","/#","\n","end",null],"tomas_foge":["ev","str","^G","/str","/ev",{"VAR=":"final_cap1","re":true},"^A Besta acorda antes de você. As unhas viram garras, e a corrente, feita para gente, não para bicho, estoura no terceiro puxão. ","#","^expr voce: ameaca","/#","\n","^Você pula do telhado com a pele já fumegando, atravessa a rua e enterra o corpo no barro de um terreno baldio, como os velhos Gangrel do Sul ensinaram.","\n","#","^imagem: serra","/#","#","^musica: final_triste","/#","^Você acorda na noite seguinte, coberto de terra, com queimaduras que vão levar anos para sumir. Para o Príncipe, você é cinza no telhado.","\n","^Na estrada, um caminhoneiro aceita levar você até a Serra sem fazer perguntas. Lá em cima, a neblina é grossa. E dessa vez, quem sabe, tem lobisomem de verdade.","\n","^Continua no capítulo 2.","\n","^FINAL G · O BICHO ENTERRADO. Tomás acusou sem provas, mas a Besta Gangrel o tirou do sol. Agora ele é um fugitivo. ","#","^final: G","/#","\n","end",null],"final_b":["ev","str","^B","/str","/ev",{"VAR=":"final_cap1","re":true},"^Dante: Você me serviu bem, forasteir","ev",{"VAR?":"o"},"out","/ev","^. Sua dívida está paga.","\n","ev",{"VAR?":"denunciado"},"/ev",[{"->":".^.b","c":true},{"b":["\n","^Dante: Mas o Vincenzo tem razão. Vo p2","re":true},"#","^fundo: vao_livre","/#","#","^imagem: anarquistas","/#","^Você desce a escada de incêndio atrás do Rayo e conta tudo na garupa, gritando por cima do motor, enquanto a Paulista passa. ","#","^entra: rayo ","/#","#","^expr rayo: neutro","/#","\n","^Rayo: Uma Senescal com a caixa do Cão debaixo do braço, e um Príncipe que não sabe. Isso vale mais que bala, forasteir","ev",{"VAR?":"o"},"out","/ev","^.","\n","^Rayo: Mas ó: a bruxa só apagou a sua noite. Quem pôs o chip na sua boca foi outra gente, e essa gente tem informante no meio da gente. O Guga não quer ouvir, o Nego diz que é invenção da Corte.","\n","^Rayo: Então, até eu saber quem é, você conta essa história só pra mim. ","#","^expr: bravo","/#","\n","^A moto corta a Augusta. O chip continua quieto embaixo da sua língua, e pela primeira vez desde terça você não está sozinh","ev",{"VAR?":"o"},"out","/ev","^.","\n","^FINAL 2L · A VERDADE PARA A RUA. Você levou o segredo da Senescal aos Anarquistas. O Rayo te protege no capítulo 3. ","#","^final: 2L","/#","\n","end",null],"final2_dante":["ev","str","^dante","/str","/ev",{"VAR=":"aliado_cap2","re":true},"#","^imagem: trono_vazio","/#","^Você leva a verdade ao Príncipe, sozinh","ev",{"VAR?":"o"},"out","/ev","^, depois que a Corte esvazia. Ele ouve tudo sem piscar.","\n","^Dante: A Senescal fica. Eu preciso dela. Mas agora ela me deve, e você sabe por quê. Isso vale mais do que a cabeça dela. ","#","^entra: dante ","/#","#","^expr: calado","/#","\n",{"->t->":"saida2_rayo"},"^FINAL 2B · A VERDADE PARA O PRÍNCIPE. Você descobriu quem apagou a sua noite, e o Príncipe guardou a Senescal na coleira. Ele te protege no capítulo 3. ","#","^final: 2B","/#","\n","end",null],"final2_constance":["ev","str","^constance","/str","/ev",{"VAR=":"aliado_cap2","re":true},"#","^imagem: anarquistas","/#","ev",{"VAR?":"constance_tentou"},"/ev",[{"->":".^.b","c":true},{"b":["\n","^Você leva a verdade à mulher que mandou a sua sombra te matar na escada da pensão. Ela escuta sem piscar.","\n","^Constance: A morta que me escapou vem me trazer um presente. Muito bem, querida. Uma dívida apaga a outra. Por enquanto. ","#","^entra: constance ","/#","#","^expr: seria","/#","\n","^Constance: Uma Senescal com segredos e um Príncipe que a protege. Isso é uma corda. E eu sei puxar corda.","\n",{"->":".^.^.^.14"},null]}],[{"->":".^.b"},{"b":["\n","^Você leva a verdade à Constance. Ela sorri como quem recebe um presente esperado.","\n","^Constance: Uma Senescal com segredos e um Príncipe que a protege. Isso é uma corda, querid","ev",{"VAR?":"o"},"out","/ev","^. E eu sei puxar corda. ","#","^entra: constance ","/#","#","^expr: seria","/#","\n",{"->":".^.^.^.14"},null]}],"nop","\n",{"->t->":"saida2_rayo"},"^FINAL 2C · A VERDADE PARA A CONSTANCE. Você deu à Lasombra uma corda no pescoço da Senescal. Ela te protege no capítulo 3. ","#","^final: 2C","/#","\n","end",null],"final2_arnaldo":["ev","str","^arnaldo","/str","/ev",{"VAR=":"aliado_cap2","re":true},"^Você leva a verdade ao Dr. Arnaldo. A lei é a lei, até para a Senescal.","\n","^Arnaldo: Crime contra a hospitalidade. Vai a julgamento. E eu não esqueço de quem trouxe a prova. ","#","^entra: arnaldo ","/#","#","^expr: aponta","/#","\n",{"->t->":"saida2_rayo"},"^FINAL 2J · A VERDADE PARA A LEI. Você entregou a Senescal ao Juiz. A Camarilla te deve, e a Luciana te odeia. O Dr. Arnaldo te protege no capítulo 3. ","#","^final: 2J","/#","\n","end",null],"final2_guardar":["ev","str","^ninguem","/str","/ev",{"VAR=":"aliado_cap2","re":true},"^Você não conta a ninguém. Na saída, a Luciana passa por você e para.","\n","^Luciana: Você podia ter me entregado. Por que não? ","#","^entra: luciana ","/#","#","^expr: fria","/#","\n","^Você: Porque agora a senhora me deve uma noite.","\n","^Ela não sorri. Mas não diz não.","\n",{"->t->":"saida2_rayo"},"^FINAL 2K · O SEGREDO DA SENESCAL. Você guardou a verdade e a Senescal ficou te devendo. Ninguém te protege no capítulo 3, mas a Capela abre a porta para você. ", // Junta na mesma caixa até 3 linhas seguidas: a primeira, mais falas da mesma pessoa ou narrações, até 300 letras,

// Devolve as linhas extras como parágrafos { narracao, corpo }. test_cliques.cjs mede o efeito.

  digitandoAgora = false; mostradoEm = performance.now(); document.querySelectorAll('#conteudo .fala.extra[hidden]').forEach(e => { e.hidden = false; });
}

// 1º clique completa a frase, o seguinte avança. Um clique que chega logo depois de a frase completar
// é ignorado, para clique rápido não pular uma fala sem ler.
function clicarDialogo() {
  const alvo = $('txt'); if (!alvo) return;
  // ainda digitando? (não compara o tamanho do texto na tela: um tradutor automático troca o texto e o jogo nunca avançava)
  if (digitandoAgora) { clearInterval(digitando); alvo.textContent = alvoTexto; completou(); return; }
  if (!pulando && performance.now() - mostradoEm < 250) return;
  // texto maior que a caixa (tela pequena ou letra grande): o toque primeiro mostra o resto, depois avança
  const c = $('conteudo');
  if (!pulando && c && c.scrollHeight - c.clientHeight - c.scrollTop > 20) { c.scrollBy({ top: c.clientHeight * .8, behavior: 'smooth' }); return; }
  avancar();
}

// Segurar Ctrl passa rápido pelas falas (para nas escolhas, nos dados e nas janelas).
let pulando = false, pulaTimer;
function pular(liga) {
  if (liga === pulando) return; pulando = liga; clearInterval(pulaTimer);
  if (liga) pulaTimer = setInterval(() => { if (!$('txt') || document.querySelector('.mesa-dados, .caderno') || !$('capa').hidden) return; clicarDialogo(); }, 70);

const EMBLEMA = { Gangrel: 'G', Nosferatu: 'N', 'Ministério': 'M' };

const chaveArte = nome => (nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const retratoDe = nome => ARTE.personagens[chaveArte(nome)]?.neutro;
const TRAVA_MS = 450; let menuFixo = { k: '', h: 0 };
// Na escolha de personagem, os três aparecem de corpo inteiro no palco, cada um em cima da sua carta.
// Apontar (ou focar) uma carta acende o retrato dela; tocar no retrato abre a ficha, como a carta.
const GIRO_ELENCO = ['-2deg', '1deg', '2.5deg'];

const estiloElenco = nome => { const e = ELENCO_ESCALA[nome]; return e ? `--r:${e.r};--cw:${e.cw};--cx:${e.cx};--cy:${e.cy};--hh:${e.hh}` : ''; };

// Perguntas às testemunhas que já foram feitas ficam marcadas. Navegar pelo bar e a acusação não contam.
const CONVERSAS = /^(rayo_perguntas|cao_perguntas|harumi_perguntas|constance_perguntas|biel_perguntas_loop|vincenzo)\b/;
function chaveEscolha(ch) { const p = String(ch.sourcePath || ''); return CONVERSAS.test(p) && !/Voltar|descansar/.test(ch.text) ? p.split('.')[0] + '|' + ch.text : null; }

  esconderDica(); efeito('escolha'); const ch = story.currentChoices[i], k = chaveEscolha(ch); if (k) feitas.add(k);
  const txt = ch.text.split(' ;; ')[0], p = txt.match(/^(.+?) :: (.*)$/), origem = String(ch.sourcePath || '').split('.')[0];
  const lugar = /^[a-z_]/i.test(origem) ? origem : partida.lugar;
  if (story.variablesState['nome'] === '') registrar('personagem_escolhido', { escolhido: txt.split(' · ')[0] });
  else { partida.escolhas++; partida.ultimaEscolha = p ? p[2] : txt; registrar('escolha', { lugar, opcao: partida.ultimaEscolha, etiqueta: p ? p[1] : '', repetida: !!document.querySelector(`#conteudo [data-i="${i}"].feita`) }); }

// Caderno: uma folha por fonte (dossiê e cada testemunha que já deu pista) e uma folha livre para anotar.
// As anotações ficam só neste navegador.
let abaAtual = 'Dossiê', anotacoes = '';
try { anotacoes = localStorage.getItem('porao-anotacoes') || ''; } catch (e) {}

// Aba "Suspeitos" do caderno: junta as pistas que citam cada pessoa (capítulo 2)
const SUSPEITOS = [['Luciana, a Senescal', /Luciana|Senescal|luvas pretas|Capela/i], ['Agente Rocha e a Inquisição', /Rocha|Inquisição|segurança da porta|leitor|sedativo/i],
  ['Isadora, a anfitriã', /Isadora/i], ['O Príncipe Dante', /Príncipe|Dante/i]];
const SUSPEITOS1 = [['Rayo, o motoqueiro', /Rayo|motoqueiro/i], ['O Cão, o Xerife', /Cão|Xerife|olho amarelo/i], ['Harumi, do porto', /Harumi/i], ['Constance, a Primogênita', /Constance/i]];
// Quadro de horários: as pistas que citam uma hora, em ordem da noite. Lê "03h12", "às 3h", "às três e meia", "depois das três".
const NUM_HORA = { uma: 1, duas: 2, 'três': 3, quatro: 4, cinco: 5, seis: 6 }, NUM_MIN = { meia: 30, dez: 10, doze: 12, quinze: 15, vinte: 20, quarenta: 40, cinquenta: 50 };
function horaDaPista(texto) {
  const re = /(\d{1,2})h(\d{2})?|\b(?:[àa]s|das|pela)\s+(uma|duas|três|quatro|cinco|seis)\b(?:\s+e\s+(meia|dez|doze|quinze|vinte|quarenta|cinquenta))?/i;
  const m = texto.match(re); if (!m) return null;
  const h = m[1] != null ? +m[1] : NUM_HORA[m[3].toLowerCase()], min = m[1] != null ? +(m[2] || 0) : (NUM_MIN[(m[4] || '').toLowerCase()] || 0);
  const antes = texto.slice(Math.max(0, m.index - 12), m.index + 4).toLowerCase();
  const pre = /depois d/.test(antes) ? 'depois de ' : /antes d/.test(antes) ? 'antes de ' : /até/.test(antes) ? 'até ' : '';
  // a noite começa ao meio-dia: 22h40 vem antes de 02h40
  return { ordem: ((h + 12) % 24) * 60 + min + (pre === 'depois de ' ? .5 : 0), rotulo: `${pre}${String(h).padStart(2, '0')}h${String(min).padStart(2, '0')}` };
}
function pistasComHora() {
  return pistas.filter(p => !/gala|recebe a sós|chega tarde/i.test(p.texto)).map(p => ({ p, h: horaDaPista(p.texto) })).filter(x => x.h).sort((a, b) => a.h.ordem - b.h.ordem);
}
function abrirCaderno() {
  registrar('abriu', { o_que: 'caderno' });
  const suspeitos = ((story?.variablesState['capitulo'] || 1) < 2 ? SUSPEITOS1 : SUSPEITOS).filter(([, re]) => pistas.some(p => re.test(p.texto)));
  const comHora = pistasComHora();
  const abas = ['Dossiê', ...(suspeitos.length ? ['Suspeitos'] : []), ...(comHora.length >= 2 ? ['Horários'] : []), ...Object.values(ABAS_PISTA).filter(a => a !== 'Dossiê' && pistas.some(p => p.aba === a)), 'Anotações'];
  if (!abas.includes(abaAtual)) abaAtual = 'Dossiê';
  const el = document.createElement('div'); el.className = 'caderno';
  el.innerHTML = `<div class="bloco-folhas"><div class="abas" role="tablist">${abas.map(a =>
    `<button class="aba" role="tab" type="button" data-aba="${esc(a)}">${esc(a)}</button>`).join('')}</div><div class="folha" role="tabpanel"></div></div>`;
  document.querySelector('.jogo').appendChild(el);
  const folha = el.querySelector('.folha');
  const mostrar = aba => {
    abaAtual = aba;
    el.querySelectorAll('.aba').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === aba));
    if (aba === 'Anotações') {
      folha.innerHTML = `<h2>Minhas anotações</h2><textarea aria-label="Minhas anotações" placeholder="Escreva aqui o que quiser lembrar."></textarea>`;
      const t = folha.querySelector('textarea'); t.value = anotacoes;
      t.addEventListener('input', () => { anotacoes = t.value; try { localStorage.setItem('porao-anotacoes', anotacoes); } catch (e) {} });
    } else if (aba === 'Horários') {
      folha.innerHTML = `<h2>Horários: a noite em ordem</h2><ol class="horarios">${comHora.map(({ p, h }) => `<li><b>${esc(h.rotulo)}</b><span>${esc(p.texto)} <small class="de">(${esc(p.aba)})</small></span></li>`).join('')}</ol>`;
    } else if (aba === 'Suspeitos') {
      // resumo: cada pessoa com as pistas que falam dela, de todas as abas
      folha.innerHTML = `<h2>Suspeitos: o que aponta para cada um</h2>${suspeitos.map(([nome, re]) => { const ps = pistas.filter(p => re.test(p.texto));
        return `<h3>${esc(nome)} <small>${ps.length} pista${ps.length === 1 ? '' : 's'}</small></h3><ol>${ps.map(p => `<li>${esc(p.texto)} <small class="de">(${esc(p.aba)})</small></li>`).join('')}</ol>`; }).join('')}`;
