    pararAbertura(); if (i >= QUADROS_AB.length) return fim();
    atualQ = i; const q = QUADROS_AB[i], jornal = FUNDOS_JORNAL.has(q.fundo);
    const dur = (q.bilhete ? 5200 : lento ? Math.max(6000, 1800 + q.txt.length * 50) : 5000) + (q.titulo ? 2500 : 0);
    const atual = qs[i % 2], antigo = qs[(i + 1) % 2];
    if (!i || QUADROS_AB[i - 1].fundo !== q.fundo) { atual.src = ARTE.fundos[q.fundo]; atual.classList.toggle('escuro', !!q.escuro); atual.classList.toggle('jornal', jornal); atual.classList.remove('on'); void atual.offsetWidth; atual.classList.add('on'); antigo.classList.remove('on'); }
    hora.classList.remove('on-txt'); leg.classList.remove('on-txt'); rec.classList.remove('on'); carimbo.classList.remove('on'); quem.classList.remove('on'); titulo.classList.remove('on');
    carimbo.classList.toggle('canto', jornal);
    if (q.titulo) em(500, () => { titulo.querySelector('small').textContent = q.titulo[0]; titulo.querySelector('b').textContent = q.titulo[1]; titulo.classList.add('on'); });
    em(300, () => { hora.textContent = q.hora; hora.classList.add('on-txt'); });
    em(q.titulo ? 1800 : 700, () => { leg.textContent = q.txt; leg.classList.add('on-txt'); });
    if (q.rec) em(900, () => { rec.src = ARTE.personagens[q.rec][q.pose] || ARTE.personagens[q.rec].neutro; rec.dataset.p = q.rec; rec.className = 'recorte-ab ' + (i % 2 ? 'dir' : 'esq'); void rec.offsetWidth; rec.classList.add('on'); });
    if (q.quem) em(2300, () => {
      // a etiqueta fica no peito de quem aparece, medida depois que o recorte termina de entrar
      quem.textContent = q.quem;
      const r = rec.getBoundingClientRect(), a = ab.getBoundingClientRect();
      quem.style.left = (r.left - a.left + r.width / 2) + 'px'; quem.style.top = (r.top - a.top + r.height * .58) + 'px';
      quem.classList.add('on');
    });
    if (q.carimbo) em(1200, () => { carimbo.textContent = q.carimbo; carimbo.classList.add('on'); flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on'); });
    if (q.bilhete) em(900, () => bilhete.classList.add('on'));
    em(dur, () => mostrarQ(i + 1));
  };
  mostrarQ(0);
}

// ---------- Música: uma faixa por cena (musica/<nome>.mp3), com fade na troca ----------
// Todas CC0, do OpenGameArt (créditos em musica/CREDITOS.md). A tag "# musica: nome" do roteiro troca a faixa; sem ela, vale a do fundo.
const MUSICA_FUNDO = { rua: 'rua', salao: 'salao', balcao: 'balcao', escada: 'escada', sinuca: 'sinuca', fundo_bar: 'sessao', corte: 'corte',
  loft: 'escada', vao_livre: 'rua', gala: 'salao', paulista: 'rua' };
const som = { faixa: null, el: null, vol: .6, ligado: true, liberado: false };
try { Object.assign(som, JSON.parse(localStorage.getItem('matusalem-som') || '{}')); } catch (e) {}
const volumeAlvo = () => som.ligado ? som.vol : 0;
function fade(el, para, ms, fim) {
  cancelAnimationFrame(el._fade); const de = el.volume, t0 = performance.now();
  const passo = t => { const k = Math.max(0, Math.min(1, (t - t0) / ms)); el.volume = de + (para - de) * k; if (k < 1) el._fade = requestAnimationFrame(passo); else fim?.(); };
  el._fade = requestAnimationFrame(passo);
}
function tocarMusica(nome, loop = true) {
  if (som.faixa === nome) return;
  som.faixa = nome;
  const velho = som.el; if (velho) fade(velho, 0, 1200, () => velho.pause());
  const el = som.el = new Audio(`musica/${nome}.mp3`); el.loop = loop; el.volume = 0;
  if (som.liberado && !document.hidden) entrar(el);
}
// o play() responde depois; se a faixa já foi trocada nesse meio-tempo, essa fica calada (antes ela tocava solta, sem obedecer ao botão nem ao volume)
function entrar(el) { el.play().then(() => som.el === el ? fade(el, volumeAlvo(), 1500) : el.pause()).catch(() => {}); }
function ajustarSom() {
  $('som').setAttribute('aria-pressed', som.ligado); $('volume').value = Math.round(som.vol * 100);
  if (som.el) fade(som.el, volumeAlvo(), 300);
  try { localStorage.setItem('matusalem-som', JSON.stringify({ vol: som.vol, ligado: som.ligado })); } catch (e) {}
}
// o navegador só deixa tocar som depois do primeiro clique ou tecla
function liberarSom() {
  if (som.liberado) return; som.liberado = true;
  if (som.el) entrar(som.el);
}
addEventListener('pointerdown', liberarSom, true); addEventListener('keydown', liberarSom, true);
// Efeitos sonoros feitos na hora (sem arquivo): papel na escolha, lápis na pista nova, coração na Fome, dados e carimbo no final.
// Seguem o botão de música e o volume. Volumes e tons medidos com contexto de áudio offline (pico entre 0,25 e 0,45;
// batidas acima de 100 Hz, porque alto-falante de celular não toca grave de 60 Hz).
let ctxSom = null, ruidoBuf = null;
function efeito(tipo) {
  const vol = volumeAlvo(); if (!som.liberado || !vol || document.hidden) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctxSom = ctxSom || new AC(); if (ctxSom.state === 'suspended') ctxSom.resume();
    const c = ctxSom, t0 = c.currentTime + .01;
    if (!ruidoBuf) { ruidoBuf = c.createBuffer(1, c.sampleRate * .5, c.sampleRate); const d = ruidoBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const saida = c.createGain(); saida.gain.value = vol * .5; saida.connect(c.destination);
    // um sopro de ruído filtrado: papel, lápis, dado batendo
    const ruido = (t, dur, freq, q, g) => { const n = c.createBufferSource(); n.buffer = ruidoBuf; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const e = c.createGain(); e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g * 7, t + .008); e.gain.exponentialRampToValueAtTime(.001, t + dur);
      n.connect(f); f.connect(e); e.connect(saida); n.start(t, Math.random() * .3, dur + .05); };
    // uma batida grave: coração, carimbo
    const batida = (t, freq, dur, g) => { const o = c.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .5, t + dur);
      const e = c.createGain(); e.gain.setValueAtTime(g, t); e.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(e); e.connect(saida); o.start(t); o.stop(t + dur + .02); };
    if (tipo === 'escolha') ruido(t0, .06, 2600, .8, .35);
    else if (tipo === 'pista') { ruido(t0, .09, 3400, 2.5, .3); ruido(t0 + .11, .12, 2900, 2.5, .28); }
    else if (tipo === 'fome') { batida(t0, 150, .16, .9); batida(t0 + .24, 130, .2, .7); }
    else if (tipo === 'dados') for (let i = 0; i < 7; i++) ruido(t0 + i * .09 + Math.random() * .03, .04, 1500 + Math.random() * 1500, 3, .4);
    else if (tipo === 'final') { batida(t0, 170, .28, 1); ruido(t0, .12, 900, .7, .2); }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!som.el || !som.liberado) return; if (document.hidden) som.el.pause(); else som.el.play().catch(() => {}); });
$('som').addEventListener('click', () => { som.ligado = !som.ligado; if (som.ligado && !som.vol) som.vol = .6; ajustarSom(); });
$('volume').addEventListener('input', e => { som.vol = e.target.value / 100; som.ligado = som.vol > 0; ajustarSom(); });
ajustarSom();

// Janela com a cara do caderno: abas opcionais, uma folha e botões embaixo. montar(aba) devolve { html, botoes: [[texto, classe, ação]] }.
function abrirJanela(rotulo, abas, inicial, montar) {
  document.querySelector('.caderno')?.remove(); esconderDica();
  const el = document.createElement('div'); el.className = 'caderno';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', rotulo);
  el.innerHTML = `<div class="bloco-folhas">${abas.length ? `<div class="abas" role="tablist">${abas.map(a =>
    `<button class="aba" role="tab" type="button" data-aba="${esc(a)}">${esc(a)}</button>`).join('')}</div>` : '<div></div>'}<div class="folha longa" tabindex="-1"></div></div>`;
  document.querySelector('.jogo').appendChild(el);
  const folha = el.querySelector('.folha'), fechar = () => el.remove();
  const mostrar = aba => {
    el.querySelectorAll('.aba').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === aba));
    const { html, botoes = [] } = montar(aba, mostrar, fechar);
    folha.innerHTML = html + `<div class="botoes">${botoes.map(([t, cl], i) => cl === 'passo' ? `<span class="passo">${esc(t)}</span>`
      : `<button class="fechar ${cl || ''}" type="button" data-b="${i}">${esc(t)}</button>`).join('')}</div>`;
    folha.querySelectorAll('[data-b]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); botoes[+b.dataset.b][2](); }));
    folha.scrollTop = 0;
    (folha.querySelector('.principal') || folha.querySelector('[data-b]'))?.focus({ preventScroll: true });
  };
  el.querySelectorAll('.aba').forEach(b => b.addEventListener('click', () => mostrar(b.dataset.aba)));
  el.addEventListener('click', e => { if (e.target === el) fechar(); });
  mostrar(inicial);
  return el;
}

function abrirFicha(i) {

    [`Jogar com ${nome}`, 'principal', () => { fechar(); escolher(nomes.indexOf(nome)); }],
    ['Voltar', 'sec', fechar],
  ] }));
}

// Dica de uma linha sobre cada etiqueta: o que ela faz ou por que a opção apareceu.
function paradaDoTeste(nomeTeste) {
  const v = story.variablesState;
  if (/Briga|Furtividade|Carisma \+ Lábia/.test(nomeTeste)) return v['parada_caca'] || (v['nome'] === 'Joana' ? 6 : 5);  // caça, pelo tipo de predador
  if (/Persuasão/.test(nomeTeste)) return v['carisma'] + 1;
  if (/Subterfúgio/.test(nomeTeste)) return v['manipulacao'] + v['subterfugio'];
  if (/Intimidação/.test(nomeTeste)) return v['intimidacao'];
  if (/Prontidão/.test(nomeTeste)) return v['raciocinio'] + 2;
  return null;
}
function chanceDe(parada, fome, dif) {
  let ok = 0; const N = 3000;
  for (let i = 0; i < N; i++) { const r = V5.rolarV5(parada, fome, dif).resultado; if (r >= 1 && r <= 3) ok++; }
  return Math.round(100 * ok / N / 5) * 5;
}
function dicaDe(g, texto, passiva) {
  const v = story.variablesState, tipo = tipoBadge(g);
  if (tipo === 'cla') return `Só aparece porque você é ${g}. ${CLAS[g] || ''}`;
  if (tipo === 'prova') {
    const rot = (texto.split(':')[0] || '').trim();
    const onde = rot === 'Dossiê' ? 'o que o Príncipe contou no dossiê' : `a pista certa no caderno${rot ? ` ("${rot}")` : ''}`;
    return `Só aparece porque você já tem ${onde}. Jogar uma prova na cara de alguém pode pegar a pessoa numa mentira.`;
  }
  if (tipo === 'disc') {
    const forte = /^Disciplina forte/.test(g), d = g.replace(/^Disciplina( forte)?:\s*/, '');
    return `${d}, a sua Disciplina: ${DISC[d]?.curta || 'um poder de vampiro.'} ${forte ? CUSTO_FORTE : v['capitulo'] >= 2 ? CUSTO_DISC2 : CUSTO_DISC}`;
  }
  if (tipo === 'teste') {
    const m = g.match(/^Teste:\s*(.+?),\s*dif\.\s*(\d+)/); if (!m) return 'Teste: rola dados; cada 6 ou mais é um sucesso.';
    const dif = +m[2], n = paradaDoTeste(m[1]), f = v['fome'];
    if (n == null) return `Teste: rola dados (${m[1]}) e precisa de ${dif} sucesso${dif === 1 ? '' : 's'}. Cada dado com 6 ou mais conta um.`;
    const verm = Math.min(f, n);
    return `Teste: você rola ${n} dados (${m[1]}) e precisa de ${dif} sucesso${dif === 1 ? '' : 's'}. Cada dado com 6 ou mais conta um.${verm ? ` ${verm} ${verm === 1 ? 'deles é' : 'deles são'} de Fome.` : ''} Chance de passar: uns ${chanceDe(n, f, dif)}%.`;
  }
  const m = g.match(/^(.+?) (\d+)$/);
  if (m && m[1] === 'Sinal') return 'O chip na sua língua transmitiu. Com Sinal 5, a Inquisição vem buscar você.';
  if (m && m[1] === 'Fome') return `${passiva ? 'Você sentiu isto' : 'Só aparece'} porque a sua Fome está em ${m[2]} ou mais. Com fome, os sentidos de predador ficam mais aguçados.`;
  if (m) {
    const nota = NOTAS.find(n => n[1] === m[1]);
    return `${passiva ? 'Você percebeu isto sozinh' + (v['o'] === 'a' ? 'a' : 'o') : 'Só aparece'} porque o seu ${m[1]} é ${m[2]} ou mais.${nota ? ' ' + nota[1] + ': ' + nota[2].charAt(0).toLowerCase() + nota[2].slice(1) : ''}`;
  }
  return '';
}

document.querySelectorAll('.hud [data-dica]').forEach(el => { el.dataset.dica = DICAS_HUD[el.dataset.dica]; });
function mostrarDica(el) {
  const txt = el?.dataset.dica; if (!txt) return esconderDica();
  const pop = $('dica-pop'), jogo = document.querySelector('.jogo').getBoundingClientRect(), r = el.getBoundingClientRect();
  pop.textContent = txt; pop.classList.add('on');
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let top = r.top - jogo.top - h - 8; if (top < 0) top = r.bottom - jogo.top + 8;
  pop.style.left = Math.max(0, Math.min(jogo.width - w, r.left - jogo.left + r.width / 2 - w / 2)) + 'px';
  pop.style.top = top + 'px';
}
function esconderDica() { const p = $('dica-pop'); p.classList.remove('on'); p.textContent = ''; }
// no toque, o navegador também dispara mouseover e focusin: esses ficam de fora, e quem manda é o toque
let ultimoToque = 0, segurou = false, seguraTimer;
const tocouAgora = () => performance.now() - ultimoToque < 900;
document.querySelector('.jogo').addEventListener('mouseover', e => { if (!tocouAgora()) mostrarDica(e.target.closest('[data-dica]')); });
document.querySelector('.jogo').addEventListener('mouseleave', esconderDica);
// teclado: com a opção em foco, mostra a dica da etiqueta dela

document.querySelector('.jogo').addEventListener('focusin', e => { if (tocouAgora()) return; const el = e.target.closest?.('[data-dica]') || (e.target.matches?.('button') && e.target.querySelector('[data-dica]')); el ? mostrarDica(el) : esconderDica(); });
addEventListener('pointerdown', esconderDica, true);
const jogoEl = document.querySelector('.jogo');
jogoEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  ultimoToque = performance.now(); segurou = false; clearTimeout(seguraTimer);
  const op = e.target.closest('#conteudo button'), dica = op?.querySelector('[data-dica]');
  if (dica) seguraTimer = setTimeout(() => { segurou = true; mostrarDica(dica); }, 450);
});
['pointerup', 'pointercancel', 'pointermove'].forEach(t => jogoEl.addEventListener(t, e => { if (t !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 6) clearTimeout(seguraTimer); }));
jogoEl.addEventListener('click', e => {
  if (!tocouAgora()) return;
  const el = e.target.closest('[data-dica]');
  if (segurou || (el && el.tagName !== 'BUTTON')) {
    e.preventDefault(); e.stopPropagation();
    if (!segurou) mostrarDica(el);
    segurou = false;
  }
}, true);
jogoEl.addEventListener('contextmenu', e => { if (tocouAgora()) e.preventDefault(); });

// Sem chave, ou rodando no próprio computador (file:, localhost) ou com ?semregistro=1, não manda nada.
const REGISTRO = { chave: 'phc_yjz43fGQScTjBvo3konPN6zGF6kLy2BgjDJVgShDT3WB', host: 'https://us.i.posthog.com', versao: '4043175' };
const registroLigado = /^phc_/.test(REGISTRO.chave) && /^https?:$/.test(location.protocol)
  && !/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname) && !/semregistro=1|pular=1/.test(location.search)
  // robôs (o da Vercel abre a página duas vezes a cada publicação) e navegadores automáticos não contam como visita
  && !navigator.webdriver && !/bot|headless|vercel|lighthouse|crawl|spider|preview/i.test(navigator.userAgent);
const sorteio = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

const sessaoId = sorteio();
const partida = { escolhas: 0, inicio: 0, lugar: '', ativa: false, ultimaEscolha: '' };

    fetch(REGISTRO.host + '/i/v0/e/', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain' },

}
