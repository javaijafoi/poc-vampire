<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Fluxograma do Matusalém</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: mapa de cenas à esquerda (ou em cima no celular), ficha de papel à direita com três abas. */
:root {
  --noite: #f3ece2; --painel: #fbf7f0; --papel: #fffdf8; --tinta: #231a17; --tinta-fraca: #6d5e57;
  --linha: #d9ccbd; --sangue: #a3222f; --ambar: #a86a12; --verde: #2f6b3f; --azul: #2c5a7a;
  --chip: #efe5d8; --sombra: rgba(40, 20, 20, .12);
  --f-titulo: "Special Elite", "Courier New", monospace;
  --f-texto: "Spectral", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --noite: #120a0e; --painel: #1d1216; --papel: #24171c; --tinta: #efe3d2; --tinta-fraca: #b9a594;
  --linha: #4a2c35; --sangue: #e0525e; --ambar: #e0a54a; --verde: #79c08a; --azul: #7fb3d6;
  --chip: #33212a; --sombra: rgba(0, 0, 0, .4); color-scheme: dark } }
:root[data-theme="dark"] {
  --noite: #120a0e; --painel: #1d1216; --papel: #24171c; --tinta: #efe3d2; --tinta-fraca: #b9a594;
  --linha: #4a2c35; --sangue: #e0525e; --ambar: #e0a54a; --verde: #79c08a; --azul: #7fb3d6;
  --chip: #33212a; --sombra: rgba(0, 0, 0, .4); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--noite); color: var(--tinta); font: 15px/1.45 var(--f-texto); margin: 0; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, .clic:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--linha); background: var(--painel); }
h1 { font: 22px/1.1 var(--f-titulo); margin: 0; letter-spacing: .02em; }
h1 small { display: block; font: 12px var(--f-ui); color: var(--tinta-fraca); letter-spacing: 0; margin-top: 3px; }
.caps { display: flex; gap: 4px; flex-wrap: wrap; }
.caps button { border: 1px solid var(--linha); background: transparent; border-radius: 3px; padding: 4px 10px; cursor: pointer; font: 13px var(--f-ui); }
.caps button[aria-pressed="true"] { background: var(--tinta); color: var(--noite); border-color: var(--tinta); }
.caps button.vazio { color: var(--tinta-fraca); border-style: dashed; }
.ferramentas { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; font: 13px var(--f-ui); margin-left: auto; }
.ferramentas label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.ferramentas select { padding: 3px 6px; border: 1px solid var(--linha); background: var(--papel); border-radius: 3px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 34%); min-height: 0; }
#mapa-wrap { position: relative; min-height: 0; min-width: 0; }
#mapa { position: absolute; inset: 0; }
.legenda { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: calc(100% - 24px);
  background: var(--painel); border: 1px solid var(--linha); padding: 6px 10px; border-radius: 4px; font: 12px var(--f-ui); color: var(--tinta-fraca); }
.legenda button { border: 0; cursor: pointer; }
.legenda i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.vazio-cap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--tinta-fraca); }
.vazio-cap h2 { font: 24px var(--f-titulo); color: var(--tinta); margin: 0 0 8px; }

aside { background: var(--papel); border-left: 1px solid var(--linha); display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.abas { display: flex; border-bottom: 1px solid var(--linha); }
.abas button { flex: 1; padding: 10px 6px; border: 0; background: transparent; cursor: pointer; font: 14px var(--f-titulo); color: var(--tinta-fraca); border-bottom: 2px solid transparent; }
.abas button[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--sangue); }
.corpo { overflow: auto; padding: 14px 16px 40px; min-width: 0; }
.corpo h2 { font: 20px/1.2 var(--f-titulo); margin: 0 0 2px; text-wrap: balance; }
.corpo h3 { font: 12px var(--f-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-fraca); margin: 18px 0 6px; }
.sub { color: var(--tinta-fraca); font: 13px var(--f-ui); }
.dica { font: 13px/1.5 var(--f-ui); color: var(--tinta-fraca); background: var(--chip); padding: 10px 12px; border-radius: 4px; }

.op { border: 1px solid var(--linha); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; background: var(--painel); }
.op.travada { opacity: .5; }
.op .t { font-weight: 600; }
.op .gat { font: 11px var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--ambar); display: block; }
.linhas { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font: 13px/1.4 var(--f-ui); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-block; font: 12px/1.3 var(--f-ui); padding: 2px 7px; border-radius: 10px; background: var(--chip); color: var(--tinta); }
.chip.pede { box-shadow: inset 0 0 0 1px var(--azul); }
.chip.nao { box-shadow: inset 0 0 0 1px var(--sangue); }
.chip.ok { background: color-mix(in srgb, var(--verde) 22%, var(--chip)); }
.chip.falta { background: color-mix(in srgb, var(--sangue) 20%, var(--chip)); }
.r { color: var(--tinta-fraca); }
.abre { color: var(--verde); } .fecha { color: var(--sangue); } .pista { color: var(--ambar); }
.clic { cursor: pointer; text-decoration: underline; text-decoration-color: var(--linha); text-underline-offset: 2px; }
.clic:hover { text-decoration-color: currentColor; }
.estado-tag { float: right; font: 11px var(--f-ui); padding: 1px 6px; border-radius: 3px; }
.estado-tag.sim { background: color-mix(in srgb, var(--verde) 25%, transparent); }
.estado-tag.nao { background: color-mix(in srgb, var(--sangue) 25%, transparent); }

table { border-collapse: collapse; width: 100%; font: 13px var(--f-ui); font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--linha); vertical-align: top; }
th { font-weight: 600; color: var(--tinta-fraca); font-size: 12px; }
td.n { text-align: right; }
.barra { height: 4px; background: var(--sangue); border-radius: 2px; margin-top: 3px; opacity: .7; }
.chave { border-bottom: 1px solid var(--linha); padding: 8px 0; }
.chave summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.chave summary b { font: 13px var(--f-ui); font-weight: 600; }
.chave summary .pct { margin-left: auto; font: 12px var(--f-ui); color: var(--tinta-fraca); font-variant-numeric: tabular-nums; white-space: nowrap; }
.estado { display: flex; flex-wrap: wrap; gap: 6px 10px; font: 13px var(--f-ui); align-items: center; }
.estado input[type=number] { width: 4.5em; padding: 2px 4px; border: 1px solid var(--linha); background: var(--painel); border-radius: 3px; }
.tog { cursor: pointer; user-select: none; }
.tog input { accent-color: var(--sangue); }

@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--linha); }
  .app { height: auto; }
  .ferramentas { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Mapa da história: leitura de cima para baixo, sem setas cruzadas */
#visao { display: none; overflow: auto; min-height: 0; }
.app.modo-visao #visao { display: block; }
.app.modo-visao main, .app.modo-visao .ferramentas { display: none; }
.v-wrap { max-width: 1080px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left, 0px)) 60px; }
.v-intro { font: 14px/1.5 var(--f-ui); color: var(--tinta-fraca); max-width: 70ch; margin: 0 0 8px; }
.v-cap { margin-top: 28px; }
.v-cap > h2 { font: 26px/1.15 var(--f-titulo); margin: 0; text-wrap: balance; }
.v-cap > h2 small { display: block; font: 13px var(--f-ui); color: var(--tinta-fraca); margin-top: 4px; }
.v-etapas { list-style: none; margin: 16px 0 0; padding: 0; counter-reset: etapa; }
.v-etapas > li { position: relative; padding: 0 0 18px 44px; counter-increment: etapa; }
.v-etapas > li::before { content: counter(etapa); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
  background: var(--tinta); color: var(--noite); display: grid; place-items: center; font: 600 14px var(--f-ui); }
.v-etapas > li::after { content: ""; position: absolute; left: 14px; top: 32px; bottom: 2px; border-left: 2px dashed var(--linha); }
.v-etapas b { font: 17px var(--f-titulo); display: block; padding-top: 4px; }
.v-etapas p { margin: 4px 0 6px; font-size: 15px; }
.v-etapas .chips { gap: 6px; }
.v-etapas .chip { font-size: 13px; padding: 3px 9px; }
.v-grupos { display: grid; gap: 14px; margin-left: 44px; }
.v-grupo { border: 1px solid var(--linha); border-left: 5px solid var(--cor); border-radius: 4px; background: var(--papel); padding: 12px 14px; }
.v-grupo.certo { --cor: var(--verde); } .v-grupo.meio { --cor: var(--ambar); } .v-grupo.errado { --cor: var(--sangue); }
.v-grupo h3 { margin: 0 0 4px; font: 600 14px var(--f-ui); color: var(--cor); }
.v-grupo .nota { font: 13px/1.45 var(--f-ui); color: var(--tinta-fraca); margin: 0 0 6px; }
.v-finais { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; margin-top: 8px; }
.v-final { background: var(--painel); border: 1px solid var(--linha); border-radius: 4px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; }
.v-final .tt { font: 600 14px/1.3 var(--f-ui); }
.v-final .tt .letra { display: inline-block; min-width: 26px; text-align: center; background: var(--cor); color: var(--papel); border-radius: 3px; padding: 0 5px; margin-right: 6px; }
.v-final p { margin: 0; font: 13px/1.45 var(--f-ui); }
.v-final .rod { margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 8px; font: 12px var(--f-ui); color: var(--tinta-fraca); }
.v-final .segue { color: var(--azul); font-weight: 600; }
.v-final .quem { color: var(--ambar); font-weight: 600; }
.v-ponte { margin-top: 32px; border: 1px solid var(--linha); border-radius: 4px; background: var(--papel); padding: 14px; }
.v-ponte h2 { font: 22px var(--f-titulo); margin: 0 0 4px; }
.v-ponte .tab { overflow-x: auto; margin-top: 10px; }
.v-ponte table { min-width: 640px; }
.v-ponte td:first-child { font-weight: 600; white-space: nowrap; }
.v-seta { text-align: center; font: 13px var(--f-ui); color: var(--tinta-fraca); margin: 18px 0 0 44px; }
@media (max-width: 600px) { .v-grupos, .v-seta { margin-left: 0; } .v-cap > h2 { font-size: 22px; } }
</style>

</div>

// ------------------------------------------------------------------ dados derivados
function preparar(c) {
  const porId = Object.fromEntries(c.knots.map(k => [k.id, k]));
  const secoes = [...new Set(c.knots.map(k => k.secao || 'Outros'))];
  const ops = []; // todas as opções, com o knot de origem
  for (const k of c.knots) k.escolhas.forEach((e, i) => { e.knot = k.id; e.i = i; ops.push(e); });
  const entradas = {};
  const ligar = (de, s, e) => (entradas[s.para] = entradas[s.para] || []).push({ de, op: e, quando: s.quando });
  for (const k of c.knots) {
    for (const s of k.auto.saidas) ligar(k.id, s, null);
    for (const e of k.escolhas) for (const s of (e.saidas.length ? e.saidas : k.auto.saidas)) ligar(k.id, s, e);
  }
  // quem liga e quem lê cada variável
  const leitores = {}, escritores = {};
  for (const e of ops) for (const cnd of e.conds) for (const v of varsDe(cnd, c.vars)) (leitores[v] = leitores[v] || []).push({ op: e, nao: negada(cnd, v), cond: cnd });
  const anotar = (v, onde) => (escritores[v] = escritores[v] || []).push(onde);
  for (const k of c.knots) {
    for (const m of k.auto.muda) anotar(m.v, { knot: k.id, op: null, m });

  for (const k of c.knots) for (const f of [...k.auto.finais, ...k.escolhas.flatMap(e => e.finais)]) (finais[f] = finais[f] || []).push(k.id);
  return { porId, secoes, ops, entradas, leitores, escritores, finais };
}
function varsDe(cnd, vars) { return [...new Set((cnd.match(/\b[a-z_][a-z0-9_]*\b/gi) || []).filter(w => w in vars))]; }
function negada(cnd, v) { return new RegExp(`\\bnot\\s+\\(?\\s*${v}\\b`).test(cnd) && !new RegExp(`\\bor\\b`).test(cnd); }

  tomas: 'Tomás', lobisomens: 'lobisomens', esgoto: 'esgoto', epilogo: 'epílogo', loop: '', forte: 'Disciplina forte:' };
function nomeCena(id) {

  }

function descVar(v) { const x = cap.vars[v]; return x && x.desc ? x.desc : v.replace(/_/g, ' '); }
function condHumana(c) {
  let t = c.replace(/\bnot\s+\(([^()]*)\)/g, 'não ($1)')
    .replace(/\bnot\s+(\w+)/g, (m, v) => v in cap.vars ? `sem ${v}` : m)

function chipCond(c) {

// ------------------------------------------------------------------ simulador de estado
function estadoInicial(nome) {
  if (!nome) return null;
  const st = {};
  for (const [v, x] of Object.entries(cap.vars)) { try { st[v] = JSON.parse(x.inicial); } catch { st[v] = x.inicial; } }
  const abertura = cap.knots[0];
  const e = abertura && abertura.escolhas.find(e => e.muda.some(m => m.v === 'nome' && m.expr.includes(nome)));

}

  if (/\bteste\b|\(\s*\)|\w\(/.test(c)) return null;

    return p.reduce((a, r) => a + (r.visitas[id] || 0), 0) / p.reduce((a, r) => a + r.partidas, 0);
  };
  for (const k of cap.knots) {
    const sec = k.secao || 'Outros';

    const pv = pctVisita(k.id);

    nodes.push({ data: { id: k.id, label: nomeCena(k.id) + (pv !== null ? `\n${fmtPct(pv)} das partidas` : '') + (voltas ? `\n↻ ${voltas} pergunta${voltas > 1 ? 's' : ''}` : ''),
      cor: CORES_SECAO[d.secoes.indexOf(sec) % CORES_SECAO.length] }, classes: [final ? 'final' : '', pv === 0 ? 'nunca' : ''].join(' ') });
  }
  const juntar = (de, para, tipo, rotulo, aberta) => {
    if (de === para) return;
    if (!d.porId[para]) return;
    const chave = `${de}>${para}>${tipo}`;
    if (!vistos[chave]) { vistos[chave] = { data: { id: chave, source: de, target: para, rotulos: [], abertas: 0, total: 0 }, classes: tipo }; edges.push(vistos[chave]); }
    const x = vistos[chave].data; x.total++; if (aberta) x.abertas++; if (rotulo && x.rotulos.length < 3) x.rotulos.push(rotulo);

    for (const s of k.auto.saidas) {
      const tempo = s.quando.some(q => /minutos\s*>=\s*limite/.test(q));
      const ok = s.quando.every(q => avaliar(q) !== false);
      juntar(k.id, s.para, tempo ? 'tempo' : s.para === 'salao' && k.id !== 'prologo' ? 'volta' : 'auto', s.quando.map(condHumana).join(' e '), ok);
    }
    for (const e of k.escolhas) {
      const outs = e.saidas.length ? e.saidas : k.auto.saidas;
      for (const s of outs) {
        const volta = s.para === 'salao' && k.id !== 'prologo';

    const x = e.data;
    x.label = x.classes === 'tempo' ? '' : (x.total > 1 ? `${x.total} opções` : (x.rotulos[0] || ''));

const curto = t => t.length > 34 ? t.slice(0, 32).trim() + '…' : t;
const fmtPct = p => p === null || p === undefined ? '' : (p > 0 && p < .01 ? '<1%' : Math.round(p * 100) + '%');

function desenhar(manterVista) {

  if (cy) cy.destroy();
  const tinta = css('--tinta'), fraca = css('--tinta-fraca'), papel = css('--papel'), sangue = css('--sangue'), ambar = css('--ambar'), linha = css('--linha'), verde = css('--verde'), azul = css('--azul');
  cy = cytoscape({
    container: $('#mapa'), elements: { nodes, edges }, wheelSensitivity: .25, minZoom: .1, maxZoom: 2.5,
    style: [
      { selector: 'node', style: { shape: 'round-rectangle', width: 'label', height: 'label', padding: '9px', 'background-color': papel,
        'border-width': 1.5, 'border-color': 'data(cor)', label: 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 170, 'text-valign': 'center',
        'font-family': 'Spectral, Georgia, serif', 'font-size': 13, color: tinta, 'line-height': 1.25 } },
      { selector: 'node.final', style: { 'border-width': 3, 'border-color': sangue, 'background-color': papel, 'font-weight': 600 } },
      { selector: 'node.nunca', style: { 'border-style': 'dashed', opacity: .65 } },
      { selector: 'node:selected', style: { 'background-color': ambar, color: '#1d1716', 'border-color': ambar } },
      { selector: 'node.realce', style: { 'border-width': 4, 'border-color': ambar } },
      { selector: 'node.liga', style: { 'border-width': 4, 'border-color': verde } },
      { selector: 'node.le', style: { 'border-width': 4, 'border-color': azul } },
      { selector: 'node.apagado', style: { opacity: .18 } },
      { selector: 'edge', style: { width: 1.4, 'line-color': fraca, 'target-arrow-color': fraca, 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': .9,
        label: 'data(label)', 'font-size': 10, 'font-family': 'system-ui, sans-serif', color: fraca, 'text-background-color': css('--noite'), 'text-background-opacity': .85,
        'text-background-padding': 2, 'text-rotation': 'autorotate', 'text-max-width': 140, 'text-wrap': 'ellipsis' } },
      { selector: 'edge.auto', style: { 'line-style': 'dashed', 'line-color': ambar, 'target-arrow-color': ambar, color: ambar } },
      { selector: 'edge.tempo', style: { 'line-style': 'dotted', 'line-color': linha, 'target-arrow-color': linha, width: 1, display: $('#ver-tempo').checked ? 'element' : 'none' } },
      { selector: 'edge.volta', style: { 'line-color': linha, 'target-arrow-color': linha, width: 1, label: '', display: $('#ver-voltas').checked ? 'element' : 'none' } },
      { selector: 'edge.travada', style: { 'line-style': 'dotted', 'line-color': sangue, 'target-arrow-color': sangue, opacity: .55 } },
      { selector: 'edge.apagado', style: { opacity: .08 } },
    ],
    layout: { name: 'dagre', rankDir: 'TB', nodeSep: 26, rankSep: 70, edgeSep: 10,
      edgeWeight: e => e.hasClass('volta') || e.hasClass('tempo') ? 0 : 1, animate: false },
  });
  // as voltas e o fim do tempo não entram no cálculo do desenho, só aparecem por cima
  cy.on('tap', 'node', ev => selecionar(ev.target.id()));
  cy.on('tap', ev => { if (ev.target === cy) limparRealce(); });
  if (vista) { cy.zoom(vista.zoom); cy.pan(vista.pan); }
  else if (cy.zoom() < .7) {
    // o mapa inteiro fica pequeno demais para ler: começa no salão, que é o centro do capítulo
    const hub = cy.nodes().max(n => n.indegree(false)).ele;
    cy.zoom(.75); cy.center(hub); cy.panBy({ x: 0, y: -cy.height() * .3 });

  if (selecionado && cy.$id(selecionado).length) cy.$id(selecionado).select();

}

function limparRealce() { chaveSel = null; aplicarRealce(); }
function aplicarRealce() {
  if (!cy) return;
  cy.elements().removeClass('realce liga le apagado');
  if (chaveSel && chaveSel.tipo === 'var') {
    const v = chaveSel.v, d = cap.d;
    const liga = new Set((d.escritores[v] || []).map(w => w.knot));
    const le = new Set((d.leitores[v] || []).map(r => r.op.knot));
    cy.nodes().forEach(n => { if (liga.has(n.id())) n.addClass('liga'); else if (le.has(n.id())) n.addClass('le'); else n.addClass('apagado'); });
    cy.edges().addClass('apagado');
  } else if (chaveSel && chaveSel.tipo === 'final') {
    // tudo o que leva até as cenas desse final
    const alvo = cy.collection(cap.d.finais[chaveSel.f].map(id => cy.$id(id)));
    const antes = alvo.predecessors().union(alvo);
    cy.elements().difference(antes).addClass('apagado');
    alvo.addClass('realce');
  }
}

function selecionar(id, centrar) {

function efeitos(x) {

function simDe() {

  const tot = rs.reduce((a, r) => a + r.partidas, 0);
  return {
    tot, rs,
    visitas: id => rs.reduce((a, r) => a + (r.visitas[id] || 0), 0) / tot,
    chave: v => rs.reduce((a, r) => a + (r.chaves[v] || 0), 0) / tot,

}

function resumoCap() {

function finalTitulo(id, f) {

let TITULOS_FINAIS = {};

document.addEventListener('change', ev => {
  const t = ev.target;

for (const b of document.querySelectorAll('.abas button')) b.addEventListener('click', () => { aba = b.id.slice(4); renderPainel(); });

// ------------------------------------------------------------------ mapa da história (visão geral)
function pctFinal(n, letra) {
  const c = DADOS.capitulos.find(x => x.n === n);
  if (!c || !c.sim) return null;
  const rs = Object.values(c.sim), tot = rs.reduce((a, r) => a + r.partidas, 0);
  return rs.reduce((a, r) => a + (r.finais[letra] || 0), 0) / tot;
}
function dificuldade(p) {

  return 'fácil de cair';
}
function abrirVisao() {
  const V = DADOS.visao;
  $('#app').classList.add('modo-visao');
  for (const b of document.querySelectorAll('#caps button')) b.setAttribute('aria-pressed', String(b.dataset.n === '0'));
  const ponteNome = { B: 'B', C_corte: 'C diante da Corte', C_anarq: 'C pelos Anarquistas', S: 'S', E: 'E', H: 'H', F: 'F', G: 'G' };
  let h = `<div class="v-wrap"><p class="v-intro">O jogo inteiro, de cima para baixo: o que você faz em cada capítulo e onde cada caminho termina. Os finais verdes seguem para o próximo capítulo; os vermelhos acabam a história (menos as fugas de cada personagem). Para ver cada cena e opção, abra a aba do capítulo lá em cima.</p>`;
  V.capitulos.forEach((c, i) => {
    h += `<section class="v-cap"><h2>Capítulo ${c.n} · ${esc(c.titulo)}<small>${esc(c.onde)}</small></h2><ol class="v-etapas">`;
    for (const e of c.etapas) h += `<li><b>${esc(e.nome)}</b><p>${esc(e.texto)}</p>${e.itens ? `<div class="chips">${e.itens.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}</li>`;
    h += `<li><b>Final</b></li></ol><div class="v-grupos">`;
    for (const g of c.grupos) {
      h += `<div class="v-grupo ${g.tipo}"><h3>${esc(g.nome)}</h3>${g.nota ? `<p class="nota">${esc(g.nota)}</p>` : ''}<div class="v-finais">`;
      for (const f of g.finais) {
        const titulo = (DADOS.titulosFinais || {})[f.letra] || '';
        const p = f.variante ? null : pctFinal(c.n, f.letra);
        h += `<div class="v-final"><div class="tt"><span class="letra">${esc(f.letra)}</span>${esc(titulo)}${f.variante ? ` · ${esc(f.variante)}` : ''}</div><p>${esc(f.como)}</p><div class="rod">`
          + (f.quem ? `<span class="quem">só ${esc(f.quem)}</span>` : '')
          + (f.segue ? `<span class="segue">→ continua no cap. ${c.n + 1}</span>` : '')
          + (f.aliado ? `<span class="segue">→ protege no cap. ${c.n + 1}: ${esc(f.aliado)}</span>` : '')
          + (p !== null ? `<span title="partidas de teste com escolhas ao acaso">${esc(dificuldade(p))}</span>` : '')
          + `</div></div>`;
      }
      h += `</div></div>`;
    }
    h += `</div></section>`;
    if (i === 0 && V.ponte) {
      const P = V.ponte;
      h += `<div class="v-seta">↓ os finais verdes, amarelos e as fugas seguem para o capítulo 2 ↓</div><section class="v-ponte"><h2>${esc(P.titulo)}</h2><p class="v-intro">${esc(P.nota)}</p><div class="tab"><table><thead><tr>${P.colunas.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>`
        + P.linhas.map(l => `<tr>${l.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('') + `</tbody></table></div></section>`;
    }
  });
  h += `<p class="v-intro" style="margin-top:28px">Capítulos 3 e 4: ainda sem roteiro. Quem te protege no capítulo 3 é quem você escolheu no fim do capítulo 2.</p></div>`;
  $('#visao').innerHTML = h;
  $('#visao').scrollTop = 0;
}

function abrirCapitulo(n) {
  $('#app').classList.remove('modo-visao');
  cap = DADOS.capitulos.find(c => c.n === n);
  cap.d = cap.d || preparar(cap);
  selecionado = null; chaveSel = null;
  for (const b of document.querySelectorAll('#caps button')) b.setAttribute('aria-pressed', String(+b.dataset.n === n));
  const sel = $('#personagem');
  const nomes = cap.knots.length ? cap.knots[0].escolhas.map(e => (e.muda.find(m => m.v === 'nome') || {}).expr).filter(Boolean).map(x => x.replace(/"/g, '')) : [];
  sel.innerHTML = '<option value="">todas as opções</option>' + nomes.map(n => `<option>${esc(n)}</option>`).join('');
  estado = null;
  const vazio = !cap.knots.length;
  $('#legenda').hidden = vazio;
  if (vazio) { if (cy) { cy.destroy(); cy = null; } $('#mapa').innerHTML = `<div class="vazio-cap"><div><h2>${esc(cap.titulo)}</h2><p>${esc(cap.resumo)}</p></div></div>`; }
  else { $('#mapa').innerHTML = ''; desenhar(); }
  renderPainel();
}

$('#gerado').textContent = `gerado do roteiro em Ink · ${new Date(DADOS.gerado).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}`;
$('#caps').innerHTML = (DADOS.visao ? `<button type="button" data-n="0">Mapa da história</button>` : '') + DADOS.capitulos.map(c => `<button type="button" data-n="${c.n}" class="${c.knots.length ? '' : 'vazio'}" title="${esc(c.titulo)}">Cap. ${c.n}${c.knots.length ? ' · ' + esc(c.titulo) : ''}</button>`).join('');
for (const b of document.querySelectorAll('#caps button')) b.addEventListener('click', () => +b.dataset.n ? abrirCapitulo(+b.dataset.n) : abrirVisao());
TITULOS_FINAIS = DADOS.titulosFinais || {};
if (DADOS.visao) abrirVisao(); else abrirCapitulo(DADOS.capitulos[0].n);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => cap && cap.knots.length && desenhar(true));
new MutationObserver(() => cap && cap.knots.length && desenhar(true)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>

</body></html>
