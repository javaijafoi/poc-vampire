<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;height:100%}*{box-sizing:border-box}[hidden]{display:none!important}</style>
</head><body>
<title>Fluxograma do Matusalém</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: mapa de cenas à esquerda (ou em cima no celular), ficha de papel à direita com três abas. */
:root {
  --noite: #f3ece2; --painel: #fbf7f0; --papel: #fffdf8; --tinta: #231a17; --tinta-fraca: #6d5e57;
  --linha: #d9ccbd; --sangue: #a3222f; --ambar: #a86a12; --verde: #2f6b3f; --azul: #2c5a7a;
  --chip: #efe5d8; --sombra: rgba(40, 20, 20, .12);
  --f-titulo: "Special Elite", "Courier New", monospace;
  --f-texto: "Spectral", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --noite: #120a0e; --painel: #1d1216; --papel: #24171c; --tinta: #efe3d2; --tinta-fraca: #b9a594;
  --linha: #4a2c35; --sangue: #e0525e; --ambar: #e0a54a; --verde: #79c08a; --azul: #7fb3d6;
  --chip: #33212a; --sombra: rgba(0, 0, 0, .4); color-scheme: dark } }
:root[data-theme="dark"] {
  --noite: #120a0e; --painel: #1d1216; --papel: #24171c; --tinta: #efe3d2; --tinta-fraca: #b9a594;
  --linha: #4a2c35; --sangue: #e0525e; --ambar: #e0a54a; --verde: #79c08a; --azul: #7fb3d6;
  --chip: #33212a; --sombra: rgba(0, 0, 0, .4); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--noite); color: var(--tinta); font: 15px/1.45 var(--f-texto); margin: 0; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, .clic:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--linha); background: var(--painel); }
h1 { font: 22px/1.1 var(--f-titulo); margin: 0; letter-spacing: .02em; }
h1 small { display: block; font: 12px var(--f-ui); color: var(--tinta-fraca); letter-spacing: 0; margin-top: 3px; }
.caps { display: flex; gap: 4px; flex-wrap: wrap; }
.caps button { border: 1px solid var(--linha); background: transparent; border-radius: 3px; padding: 4px 10px; cursor: pointer; font: 13px var(--f-ui); }
.caps button[aria-pressed="true"] { background: var(--tinta); color: var(--noite); border-color: var(--tinta); }
.caps button.vazio { color: var(--tinta-fraca); border-style: dashed; }
.ferramentas { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; font: 13px var(--f-ui); margin-left: auto; }
.ferramentas label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.ferramentas select { padding: 3px 6px; border: 1px solid var(--linha); background: var(--papel); border-radius: 3px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 34%); min-height: 0; }
#mapa-wrap { position: relative; min-height: 0; min-width: 0; }
#mapa { position: absolute; inset: 0; }
.legenda { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: calc(100% - 24px);
  background: var(--painel); border: 1px solid var(--linha); padding: 6px 10px; border-radius: 4px; font: 12px var(--f-ui); color: var(--tinta-fraca); }
.legenda button { border: 0; cursor: pointer; }
.legenda i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.vazio-cap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--tinta-fraca); }
.vazio-cap h2 { font: 24px var(--f-titulo); color: var(--tinta); margin: 0 0 8px; }

aside { background: var(--papel); border-left: 1px solid var(--linha); display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.abas { display: flex; border-bottom: 1px solid var(--linha); }
.abas button { flex: 1; padding: 10px 6px; border: 0; background: transparent; cursor: pointer; font: 14px var(--f-titulo); color: var(--tinta-fraca); border-bottom: 2px solid transparent; }
.abas button[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--sangue); }
.corpo { overflow: auto; padding: 14px 16px 40px; min-width: 0; }
.corpo h2 { font: 20px/1.2 var(--f-titulo); margin: 0 0 2px; text-wrap: balance; }
.corpo h3 { font: 12px var(--f-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-fraca); margin: 18px 0 6px; }
.sub { color: var(--tinta-fraca); font: 13px var(--f-ui); }
.dica { font: 13px/1.5 var(--f-ui); color: var(--tinta-fraca); background: var(--chip); padding: 10px 12px; border-radius: 4px; }

.op { border: 1px solid var(--linha); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; background: var(--painel); }
.op.travada { opacity: .5; }
.op .t { font-weight: 600; }
.op .gat { font: 11px var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--ambar); display: block; }
.linhas { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font: 13px/1.4 var(--f-ui); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-block; font: 12px/1.3 var(--f-ui); padding: 2px 7px; border-radius: 10px; background: var(--chip); color: var(--tinta); }
.chip.pede { box-shadow: inset 0 0 0 1px var(--azul); }
.chip.nao { box-shadow: inset 0 0 0 1px var(--sangue); }
.chip.ok { background: color-mix(in srgb, var(--verde) 22%, var(--chip)); }
.chip.falta { background: color-mix(in srgb, var(--sangue) 20%, var(--chip)); }
.r { color: var(--tinta-fraca); }
.abre { color: var(--verde); } .fecha { color: var(--sangue); } .pista { color: var(--ambar); }
.clic { cursor: pointer; text-decoration: underline; text-decoration-color: var(--linha); text-underline-offset: 2px; }
.clic:hover { text-decoration-color: currentColor; }
.estado-tag { float: right; font: 11px var(--f-ui); padding: 1px 6px; border-radius: 3px; }
.estado-tag.sim { background: color-mix(in srgb, var(--verde) 25%, transparent); }
.estado-tag.nao { background: color-mix(in srgb, var(--sangue) 25%, transparent); }

table { border-collapse: collapse; width: 100%; font: 13px var(--f-ui); font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--linha); vertical-align: top; }
th { font-weight: 600; color: var(--tinta-fraca); font-size: 12px; }
td.n { text-align: right; }
.barra { height: 4px; background: var(--sangue); border-radius: 2px; margin-top: 3px; opacity: .7; }
.chave { border-bottom: 1px solid var(--linha); padding: 8px 0; }
.chave summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.chave summary b { font: 13px var(--f-ui); font-weight: 600; }
.chave summary .pct { margin-left: auto; font: 12px var(--f-ui); color: var(--tinta-fraca); font-variant-numeric: tabular-nums; white-space: nowrap; }
.estado { display: flex; flex-wrap: wrap; gap: 6px 10px; font: 13px var(--f-ui); align-items: center; }
.estado input[type=number] { width: 4.5em; padding: 2px 4px; border: 1px solid var(--linha); background: var(--painel); border-radius: 3px; }
.tog { cursor: pointer; user-select: none; }
.tog input { accent-color: var(--sangue); }

@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--linha); }
  .app { height: auto; }
  .ferramentas { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <header>
    <h1>Fluxograma das escolhas<small id="gerado"></small></h1>

    <div class="ferramentas">

  <main>

        <span><i style="border-color:var(--sangue);border-top-style:dotted"></i>travada no estado simulado</span>
        <button type="button" class="chip" id="ver-tudo">ver o mapa inteiro</button>

    <aside>

        <button role="tab" id="aba-finais" aria-selected="false">Finais</button>
      </div>
      <div class="corpo" id="corpo"></div>
    </aside>
  </main>
</div>

// ------------------------------------------------------------------ simulador de estado
function estadoInicial(nome) {
  if (!nome) return null;

    return p.reduce((a, r) => a + (r.visitas[id] || 0), 0) / p.reduce((a, r) => a + r.partidas, 0);
  };

    const pv = pctVisita(k.id);

  }

    const chave = `${de}>${para}>${tipo}`;

}

function lnkCena(id) { return `<span class="clic" tabindex="0" data-cena="${esc(id)}">${esc(nomeCena(id))}</span>`; }
function lnkVar(v) { return `<span class="clic" tabindex="0" data-var="${esc(v)}" title="${esc(descVar(v))}">${esc(descVar(v))}</span>`; }

function painelCena() {
  const d = cap.d;
  if (!selecionado) return `<h2>${esc(cap.titulo)}</h2><p class="sub">${esc(cap.resumo)}</p>
    <p class="dica">Cada caixa é uma cena do roteiro e cada seta é uma opção do jogador (linha cheia) ou um pulo automático (tracejado). Clique numa cena para ver as opções dela, o que cada uma pede, o que ela libera e o que ela tranca.<br><br>
    Em <b>Simular com</b>, escolha um personagem: as opções que ele ainda não pode escolher ficam apagadas. Na aba <b>Pistas e travas</b> você liga e desliga pistas para ver o caminho abrir e fechar.</p>
    ${resumoCap()}`;
  const k = d.porId[selecionado];
  const sim = cap.sim ? simDe() : null;
  const pv = sim ? sim.visitas(k.id) : null;
  let h = `<h2>${esc(nomeCena(k.id))}</h2><div class="sub">${esc(k.secao || '')} · linha ${k.linha} do ink${pv !== null ? ` · ${fmtPct(pv)} das partidas de teste passam aqui` : ''}</div>`;
  const ent = (d.entradas[k.id] || []).filter((x, i, a) => a.findIndex(y => y.de === x.de) === i);
  if (ent.length) h += `<h3>Como se chega aqui</h3><div class="linhas">${ent.slice(0, 12).map(x => `<div>de ${lnkCena(x.de)}${x.op ? `: <i>${esc(curto(x.op.texto))}</i>` : ''}${x.quando.length ? ` <span class="r">(se ${esc(x.quando.map(condHumana).join(' e '))})</span>` : ''}</div>`).join('')}${ent.length > 12 ? `<div class="r">e mais ${ent.length - 12} cenas</div>` : ''}</div>`;
  const auto = k.auto;
  if (auto.muda.length || auto.pistas.length || auto.saidas.length || auto.tuneis) {
    h += `<h3>Acontece sozinho ao entrar</h3><div class="linhas">${efeitos(auto)}${auto.tuneis ? `<div class="r">Passa por ${auto.tuneis.map(lnkCena).join(', ')} (avisos de hora e chegada da Constance)</div>` : ''}${auto.saidas.map(s => `<div>→ ${lnkCena(s.para)}${s.quando.length ? ` <span class="r">se ${esc(s.quando.map(condHumana).join(' e '))}</span>` : ''}</div>`).join('')}</div>`;
  }
  if (k.escolhas.length) {
    h += `<h3>Opções (${k.escolhas.length})</h3>`;
    for (const e of k.escolhas) {
      const ok = estado ? disponivel(e) : null;
      h += `<div class="op ${ok === false ? 'travada' : ''}">${ok !== null ? `<span class="estado-tag ${ok ? 'sim' : 'nao'}">${ok ? 'aparece' : 'travada'}</span>` : ''}
        ${e.gatilho ? `<span class="gat">${esc(e.gatilho)}</span>` : ''}<span class="t">${esc(e.texto)}</span>${e.fixa ? '' : ' <span class="r" title="Opção com * some depois de escolhida">(uma vez)</span>'}
        <div class="linhas">${e.conds.length ? `<div class="chips">${e.conds.map(chipCond).join('')}</div>` : ''}${efeitos(e)}
        ${(e.saidas.length ? e.saidas : k.auto.saidas).map(s => `<div>→ ${s.para === k.id ? '<span class="r">volta para as perguntas</span>' : lnkCena(s.para)}${s.quando.length ? ` <span class="r">se ${esc(s.quando.map(condHumana).join(' e '))}</span>` : ''}</div>`).join('')}</div></div>`;
    }
  }
  return h;
}

function efeitos(x) {
  const d = cap.d, out = [];
  if (x.minutos) out.push(`<div class="r">custa ${x.minutos} min${x.despertar ? ' · pode subir a Fome' : ''}</div>`);
  else if (x.despertar) out.push(`<div class="r">pode subir a Fome</div>`);
  if (x.teste) out.push(`<div class="r">teste de dados: ${esc(x.teste.parada)} contra dificuldade ${x.teste.dif}</div>`);
  for (const p of x.pistas) out.push(`<div class="pista">✎ pista (${esc(p.aba)}): ${esc(p.texto)}${p.quando.length ? ` <span class="r">se ${esc(p.quando.map(condHumana).join(' e '))}</span>` : ''}</div>`);
  for (const m of x.muda) {
    if (['passar'].includes(m.v)) continue;
    const ls = d.leitores[m.v] || [];
    const liga = m.op === '=' && m.expr === 'true';
    const abre = ls.filter(r => liga ? !r.nao : r.nao), fecha = ls.filter(r => liga ? r.nao : !r.nao);
    const q = m.quando.length ? ` <span class="r">se ${esc(m.quando.map(condHumana).join(' e '))}</span>` : '';
    if (m.op === '=' && (m.expr === 'true' || m.expr === 'false')) {
      out.push(`<div>${liga ? '🔓' : '🔒'} ${lnkVar(m.v)}${q}${abre.length ? ` <span class="abre">abre ${abre.length}</span>` : ''}${fecha.length ? ` <span class="fecha">fecha ${fecha.length}</span>` : ''}</div>`);
      if (abre.length) out.push(`<div class="abre">&nbsp;&nbsp;abre: ${abre.slice(0, 6).map(r => `<span class="clic" data-cena="${esc(r.op.knot)}">${esc(curto(r.op.texto))}</span>`).join(' · ')}${abre.length > 6 ? ' …' : ''}</div>`);
      if (fecha.length) out.push(`<div class="fecha">&nbsp;&nbsp;fecha: ${fecha.slice(0, 6).map(r => `<span class="clic" data-cena="${esc(r.op.knot)}">${esc(curto(r.op.texto))}</span>`).join(' · ')}${fecha.length > 6 ? ' …' : ''}</div>`);
    } else if (!['nome', 'cla', 'carisma', 'raciocinio', 'manipulacao', 'subterfugio', 'intimidacao', 'ocultismo', 'disciplina', 'o', 'minutos'].includes(m.v) || ls.length) {
      out.push(`<div class="r">${esc(m.v)} ${esc(m.op === '=' ? '=' : m.op)} ${esc(m.expr)}${q}${ls.length ? ` · usado em ${ls.length} opções` : ''}</div>`);
    }
  }
  return out.join('');
}

function simDe() {
  const nome = $('#personagem').value;
  const rs = nome && cap.sim[nome] ? [cap.sim[nome]] : Object.values(cap.sim);
  const tot = rs.reduce((a, r) => a + r.partidas, 0);
  return {
    tot, rs,
    visitas: id => rs.reduce((a, r) => a + (r.visitas[id] || 0), 0) / tot,
    chave: v => rs.reduce((a, r) => a + (r.chaves[v] || 0), 0) / tot,
  };
}

function resumoCap() {
  const d = cap.d, nunca = cap.sim ? cap.knots.filter(k => simDe().visitas(k.id) === 0) : [];
  return `<h3>Neste capítulo</h3><div class="linhas"><div>${cap.knots.length} cenas, ${d.ops.length} opções, ${Object.keys(d.finais).length} finais.</div>
    ${cap.sim ? `<div class="r">${simDe().tot} partidas de teste com escolhas ao acaso.</div>` : ''}
    ${nunca.length ? `<div class="fecha">Nenhuma partida de teste chegou em: ${nunca.map(k => lnkCena(k.id)).join(', ')}</div>` : ''}</div>`;
}

function painelChaves() {
  const d = cap.d, sim = cap.sim ? simDe() : null;
  const bools = Object.keys(cap.vars).filter(v => cap.vars[v].inicial === 'false' && (d.leitores[v] || d.escritores[v]));
  const pistas = bools.filter(v => v.startsWith('p_')), outras = bools.filter(v => !v.startsWith('p_'));
  let h = `<p class="dica">Uma <b>chave</b> é algo que o jogo lembra: uma pista que você achou ou algo que já aconteceu. Clique numa chave para ver no mapa <span class="abre">onde ela é ligada</span> e <span style="color:var(--azul)">onde ela abre ou fecha opções</span>.${estado ? ' Marque e desmarque para ver as opções abrirem e fecharem no mapa.' : ' Escolha um personagem em <b>Simular com</b> para poder ligar e desligar as chaves.'}</p>`;
  if (estado) {
    h += `<h3>Estado simulado</h3><div class="estado">
      <label>Fome <input type="number" id="st-fome" min="1" max="5" value="${estado.fome}"></label>
      <label>Minutos <input type="number" id="st-minutos" min="0" max="400" step="10" value="${estado.minutos}"></label>
      <button class="chip" id="st-zerar" type="button">zerar chaves</button></div>`;
  }
  const linha = v => {
    const pct = sim ? sim.chave(v) : null;
    const liga = d.escritores[v] || [], le = d.leitores[v] || [];
    const abre = le.filter(r => !r.nao), fecha = le.filter(r => r.nao);
    return `<details class="chave" ${chaveSel && chaveSel.v === v ? 'open' : ''} data-chave="${esc(v)}"><summary>
      ${estado ? `<input type="checkbox" data-st="${esc(v)}" ${estado[v] ? 'checked' : ''} aria-label="ligar ${esc(v)}" onclick="event.stopPropagation()">` : ''}
      <b>${esc(descVar(v))}</b><span class="pct">${pct !== null ? fmtPct(pct) + ' das partidas' : ''}</span></summary>
      <div class="linhas"><div class="r">${esc(v)}</div>
      <div class="abre">liga em: ${liga.map(w => `<span class="clic" data-cena="${esc(w.knot)}">${esc(w.op ? curto(w.op.texto) : nomeCena(w.knot))}</span>`).join(' · ') || '<span class="r">nenhum lugar</span>'}</div>
      ${abre.length ? `<div>abre: ${abre.map(r => `<span class="clic" data-cena="${esc(r.op.knot)}">${esc(curto(r.op.texto))}</span>`).join(' · ')}</div>` : ''}
      ${fecha.length ? `<div class="fecha">fecha: ${fecha.map(r => `<span class="clic" data-cena="${esc(r.op.knot)}">${esc(curto(r.op.texto))}</span>`).join(' · ')}</div>` : ''}
      ${sim && sim.rs.length > 1 ? `<div class="r">${Object.entries(cap.sim).map(([n, r]) => `${esc(n)} ${fmtPct((r.chaves[v] || 0) / r.partidas)}`).join(' · ')}</div>` : ''}
      </div></details>`;
  };
  h += `<h3>Pistas (${pistas.length})</h3>${pistas.map(linha).join('')}<h3>O que já aconteceu (${outras.length})</h3>${outras.map(linha).join('')}`;
  return h;
}

function painelFinais() {
  const d = cap.d, letras = Object.keys(d.finais).sort();
  const nomes = cap.sim ? Object.keys(cap.sim) : [];
  let h = `<p class="dica">Clique num final para ver no mapa todas as cenas que podem levar até ele. Os números vêm de ${cap.sim ? simDe().tot : 0} partidas de teste com escolhas ao acaso, então mostram o que é fácil ou difícil de alcançar, não o que um jogador atento faria.</p>`;
  h += `<table><thead><tr><th>Final</th>${nomes.map(n => `<th class="n">${esc(n)}</th>`).join('')}</tr></thead><tbody>`;
  for (const f of letras) {
    const ks = d.finais[f], titulo = finalTitulo(ks[0], f);
    h += `<tr><td><span class="clic" tabindex="0" data-final="${esc(f)}"><b>${esc(f)}</b> · ${esc(titulo)}</span> <span class="clic r" data-cena="${esc(ks[0])}">abrir</span>${ks.length > 1 ? `<div class="r">${ks.map(lnkCena).join(', ')}</div>` : ''}</td>
      ${nomes.map(n => { const r = cap.sim[n], p = (r.finais[f] || 0) / r.partidas; return `<td class="n">${p ? fmtPct(p) : '<span class="r">nunca</span>'}<div class="barra" style="width:${Math.round(p * 100)}%"></div></td>`; }).join('')}</tr>`;
  }
  return h + '</tbody></table>';
}
function finalTitulo(id, f) {
  // o título vem da linha "FINAL X · TÍTULO." do roteiro, guardada na pista do knot quando existir
  const t = TITULOS_FINAIS[f];
  return t || nomeCena(id);
}
let TITULOS_FINAIS = {};

// ------------------------------------------------------------------ eventos
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-cena]'); if (c) { selecionar(c.dataset.cena, true); return; }
  const v = ev.target.closest('[data-var]'); if (v) { chaveSel = { tipo: 'var', v: v.dataset.var }; aba = 'chaves'; renderPainel(); aplicarRealce(); return; }
  const f = ev.target.closest('[data-final]'); if (f) { chaveSel = { tipo: 'final', f: f.dataset.final }; aplicarRealce(); return; }
  if (ev.target.id === 'ver-tudo' && cy) { cy.animate({ fit: { padding: 20 } }, { duration: 250 }); return; }
  if (ev.target.id === 'st-zerar') { const n = $('#personagem').value; estado = estadoInicial(n); renderPainel(); desenhar(true); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.classList.contains('clic')) ev.target.click(); });
document.addEventListener('toggle', ev => {
  const det = ev.target.closest && ev.target.closest('details[data-chave]');
  if (det && det.open) { chaveSel = { tipo: 'var', v: det.dataset.chave }; aplicarRealce(); }
}, true);
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.st) { estado[t.dataset.st] = t.checked; desenhar(true); if (aba === 'cena') renderPainel(); }
  else if (t.id === 'st-fome' || t.id === 'st-minutos') { estado[t.id.slice(3)] = +t.value; desenhar(true); }
  else if (t.id === 'personagem') { estado = estadoInicial(t.value); desenhar(true); renderPainel(); }
  else if (t.id === 'ver-voltas' || t.id === 'ver-tempo') desenhar(true);
});
for (const b of document.querySelectorAll('.abas button')) b.addEventListener('click', () => { aba = b.id.slice(4); renderPainel(); });

function abrirCapitulo(n) {
  cap = DADOS.capitulos.find(c => c.n === n);
  cap.d = cap.d || preparar(cap);
  selecionado = null; chaveSel = null;
  for (const b of document.querySelectorAll('#caps button')) b.setAttribute('aria-pressed', String(+b.dataset.n === n));
  const sel = $('#personagem');
  const nomes = cap.knots.length ? cap.knots[0].escolhas.map(e => (e.muda.find(m => m.v === 'nome') || {}).expr).filter(Boolean).map(x => x.replace(/"/g, '')) : [];
  sel.innerHTML = '<option value="">todas as opções</option>' + nomes.map(n => `<option>${esc(n)}</option>`).join('');
  estado = null;
  const vazio = !cap.knots.length;
  $('#legenda').hidden = vazio;
  if (vazio) { if (cy) { cy.destroy(); cy = null; } $('#mapa').innerHTML = `<div class="vazio-cap"><div><h2>${esc(cap.titulo)}</h2><p>${esc(cap.resumo)}</p></div></div>`; }
  else { $('#mapa').innerHTML = ''; desenhar(); }
  renderPainel();
}

$('#gerado').textContent = `gerado do roteiro em Ink · ${new Date(DADOS.gerado).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}`;
$('#caps').innerHTML = DADOS.capitulos.map(c => `<button type="button" data-n="${c.n}" class="${c.knots.length ? '' : 'vazio'}" title="${esc(c.titulo)}">Cap. ${c.n}${c.knots.length ? ' · ' + esc(c.titulo) : ''}</button>`).join('');
for (const b of document.querySelectorAll('#caps button')) b.addEventListener('click', () => abrirCapitulo(+b.dataset.n));
TITULOS_FINAIS = DADOS.titulosFinais || {};
abrirCapitulo(DADOS.capitulos[0].n);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => cap.knots.length && desenhar(true));
new MutationObserver(() => cap.knots.length && desenhar(true)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>

</body></html>
